<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐍 贪吃蛇：方块迷阵</title>
<style>
:root{
  --bg0:#0b0f2b; --bg1:#1b1147; --ink:#eaf1ff; --sub:#9fb0d9;
  --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --acc:#7cf6c4; --gold:#ffd166; --warn:#ff7b9c; --purple:#c4a2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#2a1a5e 0%,var(--bg1) 45%,var(--bg0) 100%);
  color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;justify-content:center;padding:10px;overflow:hidden;user-select:none;
}
#app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;min-height:0}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
#title{font-size:17px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
#title b{color:var(--acc)}
#starTotal{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;color:var(--gold);font-size:13px}
/* 画布区：flex 子项 + min-height:0，才会在「视口不够高」时缩下去。
   之前是 flex:0 1 auto，高度由内容（正方形画布）撑开，超出部分直接被 body 的 overflow:hidden 切掉，
   于是地图最下面一两行看不见 —— 这里必须让它可收缩，并且由 resize() 按剩余高度算格子大小。 */
#stage{position:relative;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.28);border:1px solid var(--line);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(120,180,255,.05);
  flex:1 1 auto;min-height:0;max-height:calc(100vh - 150px);
  display:flex;align-items:center;justify-content:center;padding:6px}
canvas{display:block;touch-action:none;border-radius:6px;background:#0e1130}
.panel{position:absolute;inset:0;background:rgba(8,10,32,.86);backdrop-filter:blur(7px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;z-index:5;
  max-height:100%;overflow:hidden}   /* 面板不外溢，撑不下就自己滚 */
.panel.hide{display:none}
/* 选关面板内容可能比画布区高 —— 让它自己能滚，别把页面撑破 */
#pMenu{overflow:auto;justify-content:flex-start;gap:8px}
.panel h2{margin:0;font-size:20px;letter-spacing:1px;flex:none}
.panel .big{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 18px rgba(255,209,102,.45)}
.panel p{margin:0;color:var(--sub);font-size:13px;max-width:420px;flex:none}
/* 长规则文本的容器（决斗模式有 8 段规则）：
   滚动职责交给了 .winbody（窗口式改造后，#rDesc 外面多了窗口壳，
   它自己再滚会出现「双滚动条」且滚动条贴不到边）。这里只管排版。
   ⚠ min-height:0 / overflow 必须在 .winbody 上，否则内容一长
     窗口就被撑高、按钮又被顶出屏幕（那正是本条规则最初要解决的问题）。 */
#rDesc{width:100%;text-align:left}
#rDesc>p{margin:0 0 7px;color:var(--sub);font-size:13px;line-height:1.55}
#rDesc>p:last-child{margin-bottom:0}
#rDesc b{color:var(--txt);font-weight:600}
/* 判定结论行（致敌判定等）：默认用强调色，
   金色窗口下换成亮金 —— 绿字压在金底上会发刺、像报错提示。 */
#rDesc p.verdict{color:var(--acc);font-weight:600}
.winbox.gold #rDesc p.verdict{color:#ffd98a}
/* 结果面板（结算 / 开场规则）用一个**居中的窗口**，而不是内容多长就撑多长的整屏面板。
   这是从 anime_max 那版沿用的 popup-box 形态：
     · 固定宽度 + 圆角卡片 → 视觉上是个「窗口」，不是铺满的页面
     · 头部固定、正文滚动、按钮固定在底部 → 内容再长按钮也不会被顶没
   ⚠ 上一版是 `#pResult{justify-content:flex-start}` 直接让内容顶到屏幕上方，
     那样虽然按钮可见，但长规则文本看起来像「网页正文」而不是「窗口」，
     且背景模糊铺满全屏、缺少聚焦感。 */
#pResult{justify-content:center;align-items:center;padding:16px;
/  background:rgba(6,5,18,.58);backdrop-filter:blur(3px)}
/* 窗口本体 */
.winbox{width:min(560px,94vw);max-height:min(86%,620px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(30,24,66,.96),rgba(18,14,44,.97));
  border:1px solid rgba(160,140,255,.34);border-radius:18px;
  box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset;
  overflow:hidden;text-align:center}
/* 头部：标题 + 关闭钮 */
.winhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px 11px;border-bottom:1px solid rgba(255,255,255,.10);flex:none}
.winhead h2{margin:0;font-size:18px;letter-spacing:.5px;flex:1;min-width:0}
#rClose{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:var(--txt);border-radius:999px;width:28px;height:28px;font-size:13px;line-height:1;cursor:pointer}
#rClose:hover{background:rgba(255,255,255,.17)}
/* 正文：唯一可滚的部分。min-height:0 是 flex 子项能滚的必要条件。
   滚动条要**自己画** —— 默认滚动条是灰白圆角条，压在紫色窗口上很突兀，
   而且它顶在圆角边角上会让边框看起来「破了个口」。 */
.winbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
/* 滚动条一律自己画：默认那条灰白圆角条压在紫色界面上很突兀，
   而且它顶在圆角边角上会让边框看起来「破了个口」。
   紫色拇指 + 透明轨道，悬浮加亮 —— 跟窗口边框的紫是同一支色（rgba(160,140,255) 系）。
   ⚠ **所有会滚的容器必须都写进这条选择器列表**：漏一个就会冒出默认灰条。
     #pMenu（选关面板）最早就是漏掉的那个 —— 窗口里是紫条、主界面滚起来却还是灰条。
     新增滚动容器时，把选择器加到这里，别另起一条规则抄一遍颜色。 */
#pMenu,.winbody{scrollbar-width:thin;scrollbar-color:rgba(175,160,255,.55) transparent}
#pMenu::-webkit-scrollbar,.winbody::-webkit-scrollbar{width:9px}
#pMenu::-webkit-scrollbar-track,.winbody::-webkit-scrollbar-track{background:transparent}
#pMenu::-webkit-scrollbar-thumb,.winbody::-webkit-scrollbar-thumb{
  background:rgba(175,160,255,.5);border-radius:9px;
  border:2px solid transparent;background-clip:padding-box}
#pMenu::-webkit-scrollbar-thumb:hover,.winbody::-webkit-scrollbar-thumb:hover{
  background:rgba(175,160,255,.78);background-clip:padding-box}
.winbox.gold .winbody{scrollbar-color:rgba(255,209,102,.6) transparent}
.winbox.gold .winbody::-webkit-scrollbar-thumb{background:rgba(255,209,102,.55);background-clip:padding-box}
.winbox.gold .winbody::-webkit-scrollbar-thumb:hover{background:rgba(255,209,102,.85);background-clip:padding-box}
/* 底部按钮条：不参与滚动，永远可见 */
.winfoot{flex:none;padding:11px 16px 13px;border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.16)}

/* ---------- 胜利态：金色主题 ---------- */
/* 只在胜利时挂 .gold。失败态保持冷紫色 —— 情绪一眼可辨，
   而且这个金色不靠 emoji，靠边框/底色/标题的暖色偏移，避免和满屏金色星标糊在一起。 */
.winbox.gold{border-color:rgba(255,209,102,.72);
  background:linear-gradient(180deg,rgba(78,58,20,.96),rgba(38,26,10,.97));
  box-shadow:0 18px 52px rgba(0,0,0,.55),0 0 34px rgba(255,193,84,.26),0 0 0 1px rgba(255,226,160,.22) inset}
.winbox.gold .winhead{border-bottom-color:rgba(255,209,102,.30)}
.winbox.gold .winhead h2{color:#ffe4a3;text-shadow:0 0 18px rgba(255,193,84,.45)}
.winbox.gold .winfoot{border-top-color:rgba(255,209,102,.24);background:rgba(80,54,12,.28)}
/* 金底上星标需要提亮 + 暖色描边，否则和背景融在一起看不出几颗星 */
.winbox.gold .big{filter:drop-shadow(0 0 10px rgba(255,203,80,.55)) brightness(1.12)}
.winbox.gold #rDesc>p{color:#f0dcae}          /* 正文跟着偏暖，否则冷灰字压在金底上发灰 */
.winbox.gold #rDesc b{color:#fff3d2}
.winbox.gold .pwr.win-line{border-color:rgba(255,209,102,.42);background:rgba(255,209,102,.10)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none}
/* 选关面板里的按钮排在两个模式卡「下面」，不挤在网格旁边；
   8 张关卡卡不再需要滚动条（选关面板整体可滚） */
#menuBtns{margin-top:4px}
button{font:inherit;font-weight:800;color:#0a1030;background:linear-gradient(135deg,#9dffdc,#4fd1a5);
  border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:transform .08s,filter .15s}
button:active{transform:translateY(1px)}
button:hover{filter:brightness(1.1)}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button.warn{background:linear-gradient(135deg,#ffb3c7,#ff7b9c);color:#3a0d1c}
/* 关卡选择：8 张卡一屏放下，不要再出现滚动条（选关面板整体可滚） */
#lvGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:460px;padding:2px;flex:none}
.lvcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .1s,border-color .15s}
.lvcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.lvcard.lock{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
/* 自由模式 / 抢食模式 / 决斗模式：跟 8 张关卡卡不是一个物种，整行铺开、描边。
   ⚠⚠ 三张卡**必须是同一套布局**，否则高度和文字基线互相错开：
   早先 .free 漏了 flex-wrap:wrap（文字全挤一行），另两张设了（换行成两行），
   肉眼看就是「三张卡没对齐」。现在统一走 .mode 的三行网格：
     第 1 行 = 「特殊模式」标签 + 模式名（同一基线）
     第 2 行 = 玩法说明（跨两列，允许换行）
     第 3 行 = 成绩（跨两列；min-height 固定，没成绩也占位 → 三卡等高） */
#freeCard,#raceCard,#duelCard,#magicCard,#keyCard{display:grid;width:100%;max-width:460px;flex:none}
.lvcard.mode{display:grid;grid-template-columns:auto auto;
  grid-template-areas:'lab name' 'type type' 'stat stat';
  align-items:center;justify-content:center;gap:2px 10px;padding:10px 10px}
.lvcard.mode .lvno{grid-area:lab;align-self:center}
.lvcard.mode .lvname{grid-area:name;font-size:15px;white-space:nowrap}
.lvcard.mode .lvtype{grid-area:type;font-size:10px;color:var(--purple);text-align:center}
.lvcard.mode .lvstat{grid-area:stat;font-size:11px;color:var(--sub);text-align:center;
  min-height:15px}   /* 固定高度：没成绩的那张卡不会塌一行，三卡仍然等高 */
.lvcard.mode .lvtype,.lvcard.mode .lvstat{width:100%}
.lvcard.free{border-color:rgba(255,209,102,.55);background:linear-gradient(160deg,rgba(255,209,102,.16),var(--panel))}
.lvcard.free.locked{opacity:.45;filter:grayscale(.8)}
.lvcard.race{border-color:rgba(124,246,196,.55);background:linear-gradient(160deg,rgba(124,246,196,.18),var(--panel))}
.lvcard.race.locked{opacity:.45;filter:grayscale(.8)}
.lvcard.duel{border-color:rgba(255,140,160,.6);background:linear-gradient(160deg,rgba(255,140,160,.2),var(--panel))}
.lvcard.duel.locked{opacity:.45;filter:grayscale(.8)}
.lvcard.magic{border-color:rgba(186,140,255,.6);background:linear-gradient(160deg,rgba(186,140,255,.2),var(--panel))}
.lvcard.magic.locked{opacity:.45;filter:grayscale(.8)}
/* 占位卡（门与钥匙）：虚线边框 + 斜纹底，一眼看出「还没做实」 */
.lvcard.soon{border-style:dashed;border-color:rgba(150,150,170,.45);
  background:repeating-linear-gradient(135deg,rgba(150,150,170,.07) 0 8px,transparent 8px 16px)}
.lvcard.soon .lvtype{color:var(--sub)}
.lvno{font-size:11px;color:var(--sub)}
.lvname{font-weight:900;font-size:13px}
.lvtype{font-size:10px;color:var(--purple)}
.lvstars{font-size:13px;color:var(--gold);letter-spacing:1px;min-height:18px}
/* HUD */
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;overflow:hidden}
.chip .k{font-size:10px;color:var(--sub);letter-spacing:.5px}
.chip .v{font-size:15px;font-weight:900;white-space:nowrap}
#bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid var(--line)}
#barIn{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .25s}
#tips{color:var(--sub);font-size:12px;text-align:center;min-height:18px}
/* 状态栏必须**高度恒定**：早先用 `flex-wrap:wrap` + `min-height`，条目一多就换行，
   行高从 26px 跳到 52px → 页面总高变化 → resize() 重算画布 → 画面反复震荡。
   改为永不换行、固定高度、超出横向滚动（滚动条隐藏）。
   `safe center` 是关键：普通 `center` 在内容溢出时会把左侧裁掉且无法滚回。 */
#pwrs{display:flex;gap:6px;justify-content:center;justify-content:safe center;
  height:26px;min-height:26px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:center;
  scrollbar-width:none;-ms-overflow-style:none}
#pwrs::-webkit-scrollbar{height:0;display:none}
.pwr{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;flex:none}
.pwr b{color:var(--gold)}
.pwr.cy{color:#9ff0ff;border-color:rgba(160,240,255,.45)}
/* 秘笈面板 */
#pCheat{background:rgba(8,10,32,.72)}
#cheatIn{font:inherit;font-weight:800;letter-spacing:2px;text-align:center;text-transform:lowercase;
  color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--acc);border-radius:10px;
  padding:9px 14px;width:min(280px,80vw);outline:none}
#cheatIn::placeholder{color:rgba(159,176,217,.5);letter-spacing:1px;font-weight:600}
#chList{max-width:420px;display:flex;flex-direction:column;gap:5px;text-align:left;font-size:12px;color:var(--sub)}
#chList .ci{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
#chList .ci b{color:var(--acc);letter-spacing:1px}
#chList .ci.on b{color:var(--gold)}
#chList .ci.on{border-color:rgba(255,209,102,.5)}
#chMsg{min-height:18px;font-size:12px;color:var(--warn);font-weight:800}
/* 抢食模式：能量条 + 技能按钮（只在抢食模式里显示） */
#nut{display:none;gap:8px;align-items:center;flex:none}
body.race #nut{display:flex}
#nutBar{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.08);
  border:1px solid var(--line);overflow:hidden}
#nutIn{height:100%;width:0;background:linear-gradient(90deg,#8fd6ff,#c4a2ff);transition:width .25s}
#nutTxt{font-size:11px;font-weight:800;color:var(--purple);white-space:nowrap}
#skills{display:none;gap:8px;justify-content:center;flex:none}
body.race #skills{display:flex}
.sk{flex:1 1 0;max-width:220px;display:flex;align-items:center;justify-content:center;gap:7px;
  font:inherit;font-weight:900;font-size:13px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;
  transition:transform .08s,border-color .15s,opacity .15s;-webkit-tap-highlight-color:transparent}
.sk .key{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.sk .cost{font-size:11px;color:var(--gold)}
.sk:active{transform:translateY(1px)}
.sk.ready{border-color:rgba(124,246,196,.65)}
.sk.ready .cost{color:var(--acc)}
.sk.no{opacity:.45;filter:grayscale(.7)}
/* 固定行都不参与收缩，把有限的高度全留给画布区 */
#hud,#bar,#pwrs,#tips{flex:none}
/* 矮屏：把非必要的东西收起来，优先保画布 */
@media (max-height:760px){
  #tips{display:none}
  .chip{padding:4px 4px}
  .chip .v{font-size:14px}
}
@media (max-height:620px){
  #pwrs{display:none}
  #title{font-size:15px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title">🐍 贪吃蛇 <b>方块迷阵</b></div>
    <div id="starTotal">⭐ 0</div>
  </div>

  <div id="stage">
    <canvas id="cv" width="620" height="620"></canvas>
    <div class="panel" id="pMenu">
      <h2>选择关卡</h2>
      <p id="menuSub">吃掉带数字的方块壮大自己，达到目标分即可通关。数字越大长得越快，但也更容易把自己堵死。</p>
      <div id="lvGrid"></div>
      <div id="freeCard"></div>
      <div id="raceCard"></div>
      <div id="duelCard"></div>
      <div id="magicCard"></div>
      <div id="keyCard"></div>
      <div class="rowbtns" id="menuBtns">
        <button class="ghost" id="btnHelp">玩法说明</button>
        <button class="warn" id="btnWipe">清空存档</button>
      </div>
    </div>
    <div class="panel hide" id="pResult">
      <div class="winbox" id="winBox">
        <div class="winhead">
          <h2 id="rTitle">通关！</h2>
          <button id="rClose" title="关闭">✕</button>
        </div>
        <div class="winbody">
          <div class="big" id="rStars">⭐⭐⭐</div>
          <div id="rDesc"></div>
        </div>
        <div class="rowbtns winfoot" id="rBtns"></div>
      </div>
    </div>
    <div class="panel hide" id="pPause">
      <h2>暂停</h2>
      <div class="rowbtns">
        <button id="btnResume">继续</button>
        <button class="ghost" id="btnRetry2">重来</button>
        <button class="ghost" id="btnMenu2">选关</button>
      </div>
    </div>
    <div class="panel hide" id="pCheat">
      <h2>🌀 秘笈</h2>
      <p>输入密令后回车生效；再输一次同一个密令就关掉。Tab 或 Esc 收起。</p>
      <input id="cheatIn" placeholder="密令…" autocomplete="off" spellcheck="false">
      <div class="rowbtns">
        <button id="chGo">生效</button>
        <button class="ghost" id="chClose">收起</button>
      </div>
      <div id="chMsg"></div>
      <div id="chList"></div>
    </div>
  </div>

  <div id="hud">
    <div class="chip"><div class="k">关卡</div><div class="v" id="cLv">—</div></div>
    <div class="chip"><div class="k" id="kScore">分数 / 目标</div><div class="v" id="cScore">0</div></div>
    <div class="chip"><div class="k">长度</div><div class="v" id="cLen">4</div></div>
    <div class="chip"><div class="k" id="kTime">连击</div><div class="v" id="cTime">0</div></div>
  </div>
  <div id="bar"><div id="barIn"></div></div>
