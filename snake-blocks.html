     拿 id 拼会把第 17 关显示成「20. 天坠」。前 8 关恰好 id===关号，所以这个错
     在前 8 关上永远看不出来 —— 又是静默坑。 */
  $('cLv').textContent=duel?S.L.name:(race?'抢食模式':(free?'自由模式':(magic?S.L.name:(lvNo(S.L.id)+'. '+S.L.name))));
  $('kScore').textContent=duel?'长度比':(race?'掠夺分':(free?'分数':(magic?'存活时间':'分数 / 目标')));
  $('cScore').textContent=duel?(duelRatio().toFixed(2)+'×'):(race?String(S.score):(free?String(S.score):(magic?(Math.ceil(S.timeLeft)+'s'):(S.score+' / '+S.L.target))));
  $('cLen').textContent=duel?(S.body.length+' vs '+rivalLen()):(race?(S.body.length+' 节'):(free?(S.body.length+' / '+dragonNeed()):(magic?(S.body.length+' 节 / '+S.rivals.filter(r=>r.alive).length+' 条蛇'):(S.body.length+(S.grow?' (+'+S.grow+')':'')))));
  if(S.L.time){$('kTime').textContent='剩余时间';$('cTime').textContent=Math.ceil(S.timeLeft)+'s';
    $('cTime').style.color=S.timeLeft<=10?'var(--warn)':'var(--ink)';}
  else{$('kTime').textContent='连击';$('cTime').textContent='×'+S.combo;
    $('cTime').style.color=S.combo>=3?'var(--gold)':'var(--ink)';}
  $('barIn').style.width=(progress()*100).toFixed(1)+'%';
  const chips=[];
  if(S.shield>0)chips.push('<div class="pwr">🛡 鳞甲 <b>×'+S.shield+'</b></div>');
  if(S.slowUntil>S.steps)chips.push('<div class="pwr">⏳ 缓步 <b>'+Math.ceil((S.slowUntil-S.steps)*tickNow()/1000)+'s</b></div>');
  if(S.L.hunger)chips.push('<div class="pwr" style="color:#ff9db4">🍖 饥饿</div>');
  if(S.invT>0)chips.push('<div class="pwr cy">🛡 起步无敌 <b>'+S.invT.toFixed(1)+'s</b></div>');
  for(const r of S.rivals)if(!r.alive)chips.push('<div class="pwr" style="color:#ff9db4">'+RIVAL.emoji+' '+foeName(r)+' <b>'+Math.ceil(r.respawn)+'s</b> 后回归</div>');
  if(free){
    chips.push('<div class="pwr" style="color:#ffe9a8">🐉 化龙 <b>'+S.body.length+' / '+dragonNeed()+'</b></div>');
    if(S.fang>0)chips.push('<div class="pwr" style="color:#ffd166">🦷 毒牙 <b>×'+S.fang+'</b> 撞'+RN+'即撕咬</div>');
    if(S.freeT<FREE.WARM)chips.push('<div class="pwr cy">🐢 提速中 <b>'+speedPct()+'%</b></div>');
    if(!S.rivals.length&&S.freeT<FREE.RIVAL_AT)
      chips.push('<div class="pwr" style="color:#ff9db4">'+RIVAL.emoji+' '+RN+' <b>'+Math.ceil(FREE.RIVAL_AT-S.freeT)+'s</b> 后入场</div>');
  }
  if(race){
    chips.push('<div class="pwr" style="color:#d8b4ff">🐍 抢食 <b>'+S.raceStolen+'</b> 块</div>');
    chips.push('<div class="pwr" style="color:#e2f0cb">🍂 腐坏 <b>'+S.raceSpoiled+'</b></div>');
    if(sprinting())chips.push('<div class="pwr cy">💨 冲刺 <b>'+Math.max(0,S.runUntil-S.steps)+'</b> 步</div>');
    if(S.goldRush)chips.push('<div class="pwr" style="color:#ffd166">✨ 金色狂潮 <b>'+Math.max(0,S.rushUntil-S.steps)+'</b> 步</div>');
    const nx=RACE.EVENT_EVERY*(S.evIdx+1)-S.steps;
    if(RACE.on.event&&nx>0)chips.push('<div class="pwr" style="color:#9ff0ff">🌪 事件 <b>'+nx+'</b> 步后</div>');
  }
  if(duel){
    /* 决斗模式最重要的一个数：我的长度 / 它的长度。2 倍就能做陷阱、4 倍能封场。 */
    const rat=duelRatio(),rl=rivalLen();
    const tier=rat>=DUEL.WIPE_LINE?'封场':(rat>=DUEL.DANGER_LINE?'压制':(rat>=DUEL.TRAP_LINE?'可围':(rat>=1?'势均':'挨打')));
    const col=rat>=DUEL.WIPE_LINE?'#7cf6c4':(rat>=DUEL.TRAP_LINE?'#ffd166':'#ff9db4');
    chips.push('<div class="pwr" style="color:'+col+'">⚔ 长度比 <b>'+rat.toFixed(2)+'×</b>（'+tier+'）</div>');
    const r0=S.rivals[0];
    if(r0&&r0.alive){
      chips.push('<div class="pwr" style="color:#ff9db4">🐍 '+RN+' <b>'+rl+'</b> 节'+
        (r0.rush?' 🔥加速':'')+(r0.grow?' 📈待长'+r0.grow:'')+'</div>');
      if(r0.choke>0)chips.push('<div class="pwr" style="color:#7cf6c4">🪤 被堵住拐弯 <b>'+r0.choke+'</b>/'+DUEL.TURN_WAIT+'</div>');
      if(r0.doomed)chips.push('<div class="pwr" style="color:#7cf6c4">☠ 它快没路了</div>');
      /* 饥饿进度：这是玩家「围住它就能赢」这条战术的仪表盘 ——
         不显示的话玩家不知道自己在赢还是白绕，所以连倒计时一起给。 */
      if(DUEL.STARVE_EVERY){
        const since=S.steps-(r0.lastEat||0);
        const left=Math.max(0,DUEL.STARVE_EVERY-since);
        chips.push('<div class="pwr" style="color:'+(left<8?'#ffb4b4':'#ffe1a8')+'">🍽 饥饿'+
          (left>0?(' <b>'+left+'</b> 拍后掉 1 节'):' 缩 '+r0.body.length+'→'+
            Math.max(DUEL.STARVE_DEATH,r0.body.length-1))+'</div>');
      }
    }
    chips.push('<div class="pwr" style="color:#9ff0ff">🟥 负数 <b>'+countNeg()+'</b></div>');
    if(S.duelNeg>0)chips.push('<div class="pwr" style="color:#e2f0cb">我吃的负数 <b>'+S.duelNeg+'</b></div>');
  }
  if(CHEAT.ghost)chips.push('<div class="pwr cy">🌀 虚化</div>');
  if(CHEAT.rush)chips.push('<div class="pwr cy">⚡ 疾行</div>');
  if(CHEAT.half)chips.push('<div class="pwr cy">⏳ 半速</div>');
  /* 第 21 关「魔术蛇」的两条蛇状态 */
  if(magic){
    const mm0=S.rivals.find(r=>r.role==='mom'&&r.alive);
    const kn=S.rivals.filter(r=>r.role==='kid'&&r.alive).length;
    if(mm0)chips.push('<div class="pwr" style="color:#ff9db4">🎩 本体 <b>'+
      (mm0.body.length+(mm0.grow||0))+'</b> / '+MAGIC.SPLIT_AT+' 节</div>');
    if(kn)chips.push('<div class="pwr" style="color:#ffcf7a">🔶 分身 <b>×'+kn+'</b></div>');
    if((S.magicMerges||0)>0)chips.push('<div class="pwr" style="color:#ffe9a8">🔗 合流 <b>'+S.magicMerges+'</b> 次</div>');
    if((S.magicSwaps||0)>0)chips.push('<div class="pwr" style="color:#d8b4ff">🌀 易位 <b>'+S.magicSwaps+'</b> 次</div>');
  }
  $('pwrs').innerHTML=chips.join('');
  $('starTotal').textContent='⭐ '+totalStars();
  /* 养分条 + 技能按钮的可用状态（只有抢食模式开局才显示） */
  if(showRaceUi){
    $('nutTxt').textContent='养分 '+S.nut+' / '+RACE.NUT_MAX;
    $('nutIn').style.width=(S.nut/RACE.NUT_MAX*100).toFixed(0)+'%';
    for(const [id,kind,cost] of [['skRun','run',RACE.RUN_COST],['skBoom','boom',RACE.BOOM_COST]]){
      const el=$(id),ok=canSkill(kind);

      el.classList.toggle('no',!ok&&S.alive&&!S.over);
      el.querySelector('.cost').textContent=cost+' 养分';
    }
  }
  /* 养分条 / 技能按钮是「显示与否」会变的固定行，它们一出现可用高度就变了，
     所以 HUD 更新完再量一次画布 —— 否则矮屏上又会把地图底部挤出去 */
  if(_hudRows!==(showRaceUi?1:0)){_hudRows=showRaceUi?1:0;resize();}
}
/* ================= 存档 ================= */
const SAVE_KEY='snake_blocks_v1';
const SAVE_V=2;                                   /* 结构版本；以后加字段靠 migrateSave 兜 */
let save={v:SAVE_V,best:{},cleared:{},free:{best:0,bestLen:0,dragons:0},
  race:{best:0,bestLen:0,eats:0,stolen:0,spoiled:0,plays:0},
  duel:{plays:0,wins:0,bestSteps:0,fastestScore:0},
  magic:{plays:0,wins:0,splits:0,swaps:0,merges:0,bestTime:0}};
function migrateSave(o){
  if(!o||typeof o!=='object')return null;
  o.v=SAVE_V;
  o.best=o.best||{};o.cleared=o.cleared||{};
  o.free=Object.assign({best:0,bestLen:0,dragons:0},o.free||{});
  o.race=Object.assign({best:0,bestLen:0,eats:0,stolen:0,spoiled:0,plays:0},o.race||{});
  o.duel=Object.assign({plays:0,wins:0,bestSteps:0,fastestScore:0},o.duel||{});
  o.magic=Object.assign({plays:0,wins:0,splits:0,swaps:0,bestTime:0},o.magic||{});
  return o;
}
function loadSave(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw)save=migrateSave(JSON.parse(raw))||save;}catch(e){}
  syncProgress();
}
/* 把存档里的解锁信息同步给逻辑层（逻辑段不碰 save） */
function syncProgress(){
  setProgress(!!save.cleared[8],((save.free&&save.free.dragons)||0),
    ((save.race&&save.race.plays)||0),((save.duel&&save.duel.wins)||0));
}
/* 自由模式要通关第 8 关才开 —— 它的规则跟关卡模式不是一回事，太早放出来只会让人困惑 */
function freeUnlocked(){return !!save.cleared[8];}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}syncProgress();}
function totalStars(){
  let n=0;for(const id in save.best)n+=starOf(save.best[id],levelById(+id));return n;
}
function unlocked(id){
  if(id===LEVELS[0].id)return true;
  const i=LEVELS.findIndex(l=>l.id===id);
  return i>0&&!!save.cleared[LEVELS[i-1].id];
}

/* ================= 面板 ================= */
/* 结算窗口本次是否胜利 —— **唯一判据**，五种结局都从这里走。
   ⚠ 两个坑：
   ① 别去比对 S.reason 的文案：改一次文案这个判定就静默失效（表现是胜利了却紫框）。
   ② **以 showResult(win) 的参数为准，而不是只读 S.win**：
     结算面板的最终形态由 showResult(win) 决定（它才是那次结算的权威），
     S.win 只是「已达到目标」的中间状态，有的路径（比如超时/对手先死）
     会在S.win 还是 false 时也走showResult。
     所以显式记录 S.resWin，由 showResult 写入。
   各模式的胜利语义本来就不同，硬凑一个字段反而会漏：
     · 关卡模式 win 参数 / S.win（达标即胜）
     · 自由模式 S.dragon（化龙即胜）
     · 抢食模式无胜负（掠夺结束，成绩导向）→ 一律不算胜利，保持冷色
     · 决斗   蚀蛇死亡（r0&&!r0.alive）—— 唯一判据，它死了我就赢 */
function resultWon(){
  if(!S)return false;
  if(S.resWin!=null)return !!S.resWin;          /* showResult 已明确表态 */
  if(S.L&&S.L.race)return false;
  if(S.L&&S.L.duel)return !!(S.rivals[0]&&!S.rivals[0].alive);
  if(S.L&&S.L.magic)return !!S.win;             /* 魔术蛇：活到时间到即赢 */
  return !!(S.win||S.dragon);
}
function show(id){
  $(id).classList.remove('hide');
  /* 结算窗口的胜利金色主题挂在 show 上，而不是每个结算函数各自设。
     理由：结算有 5 个入口（关卡/自由/抢食/决斗/开场规则），逐个设置一定会漏一个，
     而「漏了」的表现是胜利了却是紫框 —— 恰好是最显眼的地方出错。 */
  if(id==='pResult')$('winBox').classList.toggle('gold',resultWon());
}
function hide(id){$(id).classList.add('hide');}
function hideAllPanels(){for(const p of ['pMenu','pResult','pPause','pCheat'])hide(p);}

function openMenu(){
  running=false;hideAllPanels();show('pMenu');
  const grid=$('lvGrid');

function typeName(t){
  return {'classic':'平原','maze':'乱石','hazard':'负能','timed':'限时','portal':'穿越','hungry':'饥饿',
    'rival':RN,'boss':'终局','free':'自由','race':'抢食',
    /* 第 9~12 关的四个新机制 */
    'rare':'星屑','drift':'流沙','shrink':'毒雾','omni':'终局',
    /* 第 13~16 关 */
    'fall':'落石','fog':'暗夜','soul':'噬魂','void':'求空',
    /* 第 17~19 关 */
    'grav':'天坠','rot':'腐径','portal':'回廊','mirror':'镜花','magic':'魔术'}[t]||t;
}

/* ================= 秘笈面板 ================= */
function cheatOn(id){return $(id)?!$(id).classList.contains('hide'):false;}
function renderCheatList(){
  $('chList').innerHTML=Object.keys(CHEATS).map(k=>{
    const c=CHEATS[k];
    const on=(c.key==='ghost'&&CHEAT.ghost)||(c.key==='rush'&&CHEAT.rush);
    return '<div class="ci'+(on?' on':'')+'"><b>'+c.icon+' '+c.key+'</b>　'+
           c.name+'　'+c.desc+(on?'　<font color="var(--gold)">[已开启]</font>':'')+'</div>';
  }).join('');
}
let cheatResume=false,cheatPrev=null;
function openCheatPanel(){
  cheatPrev=['pMenu','pResult','pPause'].find(id=>!$(id).classList.contains('hide'))||null;
  /* 开着局时弹出面板要暂停，否则一边打字一边已经撞死了 */
  cheatResume=!!(S&&running&&!S.paused&&!S.over);
  if(cheatResume)S.paused=true;
  hideAllPanels();show('pCheat');
  renderCheatList();
  const inp=$('cheatIn');
  $('chMsg').textContent='';
  inp.value='';
  setTimeout(()=>{try{inp.focus();}catch(e){}},0);
}
function closeCheatPanel(back){
  hide('pCheat');
  if(back){cheatResume=false;cheatPrev=null;openMenu();return;}
  if(cheatPrev)show(cheatPrev);              /* 结算/暂停面板原样还回来 */
  if(cheatResume&&S&&!S.over)S.paused=false; /* 关掉面板自动续上 */
  cheatResume=false;cheatPrev=null;
}
function submitCheat(){
  const inp=$('cheatIn'),code=inp.value;
  const c=matchCheat(code);
  if(!c){$('chMsg').textContent='✗ 没有这条秘笈：'+code;
    $('cheatIn').value='';renderCheatList();return;}
  const r=applyCheat(c);
  if(r==='open'){                       /* 全解锁属于存档操作，只能在浏览器段做 */
    for(const L of LEVELS)save.cleared[L.id]=true;
    save.free=Object.assign({best:0,bestLen:0,dragons:0},save.free||{});
    if(!save.free.dragons)save.free.dragons=1;   /* 抢食模式的第二把钥匙 —— 一并给了 */
    save.race=Object.assign({best:0,bestLen:0,eats:0,stolen:0,spoiled:0,plays:0},save.race||{});
    if(!save.race.plays)save.race.plays=1;       /* 决斗模式的第三把钥匙 */
    save.duel=Object.assign({plays:0,wins:0,bestSteps:0,fastestScore:0},save.duel||{});
    /* 魔术蛇的第四把钥匙是「斩蛇一次」—— 上面那行只是建了 duel 对象，
       胜利次数要从已有存档里继承过来，不能靠 Object.assign 的默认 0 覆盖掉。 */
    if(!save.duel.wins)save.duel.wins=0;
    save.magic=Object.assign({plays:0,wins:0,splits:0,swaps:0,bestTime:0},save.magic||{});
    writeSave();
  }
  if(r==='dragon'){                     /* 要推事件、放特效，只能在浏览器段做 */
    if(S&&S.L.free&&!S.over){S.cheatUsed=true;forceDragon();consumeEvents();
      $('chMsg').textContent='✓ 🐉 化龙已触发（测试用，不计入存档）';
      if(S.paused)S.paused=false;cheatResume=false;
      closeCheatPanel(false);render(1);updateHUD();return;}
    $('chMsg').textContent='✗ 化龙只能在自由模式局里用';
    inp.value='';inp.focus();return;
  }
  renderCheatList();
  if(S){S.cheatUsed=S.cheatUsed||anyCheat();}
  updateHUD();
  const st=(c.key==='open')?'已生效':(r==='on'?'已开启':'已关闭');
  $('chMsg').textContent=(c.key==='open'?'✓ ':'✓ ')+c.icon+' '+c.name+' '+st;
  inp.value='';inp.focus();
  flashTips(c.icon+' '+c.name+' '+st+(CHEAT.ghost?'　（本局不计入存档）':''));
  sfx(r==='on'?'power':'shield');
}

     ① 「开局 3 秒无敌」用的是全局 INVULN，而决斗的无敌是 DUEL.INVULN（1.5 秒）——
        放进来会跟上面「限制项」写的秒数直接打架（实测确实打过架）；
     ② 「有蚀蛇追击」是旧措辞，决胜条件已在上面单列；
     ③ 决斗的乱石生成已包含在限制项的表述里。
     ⚠⚠ **「终局模式」不是一个模式，是三个**（决斗 duel / 抢食 race / 自由 free）。
       早先只排除了 duel，结果抢食模式的开场说明里混进了
       「🪨 乱石每局重新生成」「🛡 开局 3 秒起步无敌」「🐍 有蚀蛇追击」——
       抢食的乱石来自赛道生成、开局无敌对它另有含义，写在这里是错的。
       **加新模式时记得逐条过一遍这里的条件，别只看 duel。** */
  const endgame=!!(L.duel||L.race||L.magic);
  if(L.randWalls&&!endgame)extra+='<p>🪨 乱石<b>每局重新生成</b>（数量不变）</p>';
  if(!endgame&&!L.free)extra+='<p>🛡 开局 <b>'+INVULN+' 秒</b>起步无敌</p>';
  if(L.wrap)extra+='<p>🌀 边界可穿越</p>';
  if(L.hunger)extra+='<p>🍖 每 '+L.hunger+' 步掉落一节</p>';
  if(L.rival&&!L.free&&!endgame)extra+='<p>🐍 有蚀蛇追击</p>';   /* 终局模式各自单列说明 */  if(L.powers&&L.powers.length)extra+='<p>🎁 道具：'+L.powers.map(p=>POWERS[p].icon+' '+POWERS[p].name).join(' · ')+'</p>';
  /* 抢食模式没有目标分，配置里也就没有 target —— 别把 undefined 打给玩家看 */
  $('rDesc').innerHTML='<p>'+(L.desc||'')+'</p>'+extra;
  $('rBtns').innerHTML='<button id="cfGo">开始</button><button class="ghost" id="cfBack">返回选关</button>';
  $('cfGo').onclick=()=>{startFn(L);};
  $('cfBack').onclick=()=>{openMenu();};
  pendingLevel=L;
}
let pendingLevel=null;

function startLevel(L){
  hideAllPanels();
  newState(L.id);
  resize();
  running=true;acc=0;parts.length=0;floats.length=0;rings.length=0;
  if(CHEAT.ghost)flashTips('🌀 虚化中：穿墙穿身，本局成绩不计入存档');
  else if(L.race)flashTips('🥇 抢食之战：临期方块双倍分 · Q 冲刺 / E 爆破 · 每 '+RACE.EVENT_EVERY+' 步一次事件');
  else if(L.duel)flashTips('⚔ '+L.name+'：致敌判定 — 撞击其身体 / 封锁可行走格数 / 诱导自咬；避免边界与负数');
  else if(L.magic)flashTips('🎩 本体长到 '+MAGIC.SPLIT_AT+' 节即分裂；本体与分身可易位、分身之间可合流 —— 坚持 '+L.time+' 秒');
  else if(L.free)flashTips('🐉 长到 '+dragonNeed()+' 节化龙 · 第 '+FREE.RIVAL_AT+' 秒'+RN+'入场 · 捡 🦷 可撕咬'+RN);
  updateHUD();render(1);
}

function showResult(win){
  running=false;
  S.resWin=!!win;   /* 结算面板的金色主题以这个参数为准，见 resultWon 的说明 */
  if(S.L.free){showResultFree();return;}   /* 自由模式没有星级也没有下一关，另走一套结算 */
  if(S.L.race){showResultRace();return;}   /* 抢食模式没有目标分也没有通关，看掠夺成绩 */
  if(S.L.duel){showResultDuel();return;}   /* 决斗模式只有「斩蛇」和「被杀」两种结局 */
  if(S.L.magic){showResultMagic();return;} /* 第 21 关「魔术蛇」：撑满 60 秒或被咬断 */
  sfx(win?'win':'die');
  const L=S.L,sc=S.score;
  if(win){
    /* ⚠ 第 16 关「作减求空」记的是**用了多少步**（越小越好），不是分数 ——
       它归零即胜，没有「得分越高越好」这回事，拿分数当纪录会把方向搞反。 */
    const rec=L.void?S.steps:sc;
    const st=starOf(rec,L);
    const dirty=S.cheatUsed;            /* 开过秘笈的一局不写存档，别把测试成绩记成正式纪录 */
    if(!dirty){
      if(L.void){if(!save.best[L.id]||rec<save.best[L.id])save.best[L.id]=rec;}
      else if(!save.best[L.id]||sc>save.best[L.id])save.best[L.id]=sc;
      save.cleared[L.id]=true;
      writeSave();
    }
    const nxt=LEVELS.find(l=>l.id===L.id+1);
    show('pResult');
    $('rTitle').textContent='🎉 通关！'+(dirty?'（秘笈局）':'');
    $('rStars').textContent=dirty?'🌀':'⭐'.repeat(st)+'☆'.repeat(3-st);
    $('rDesc').innerHTML=(L.void
      ? '<p>🕳 <b>作减求空</b> —— 用了 <b>'+S.steps+'</b> 步把自己缩到一节不剩（过程分 '+sc+'）</p>'
      : '<p>最终得分 <b>'+sc+'</b> / 目标 '+L.target+'　最身长 '+S.body.length+' 节　最高连击 ×'+S.bestCombo+'</p>')+
      (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩与解锁<b>不计入存档</b>。</p>'
            :'<p>'+(st<3?'还想拿满星：⭐⭐ 需 '+(L.void?L.s2+' 步以内':L.s2+' 分')+
                    '，⭐⭐⭐ 需 '+(L.void?L.s3+' 步以内':L.s3+' 分'):'完美表现，三星到手！')+'</p>');
    $('rBtns').innerHTML=
      (nxt?'<button id="rNext">下一关 '+nxt.name+'</button>':'<button id="rNext">查看全部关卡</button>')+
      '<button class="ghost" id="rAgain">再来一次</button><button class="ghost" id="rMenu">选关</button>';
    $('rNext').onclick=()=>{nxt?showConfirm(startLevel,nxt.id):openMenu();};
    $('rAgain').onclick=()=>{showConfirm(startLevel,L.id);};
    $('rMenu').onclick=()=>{openMenu();};
  }else{
    show('pResult');
    $('rTitle').textContent='失败了';
    $('rStars').innerHTML='<span style="font-size:22px">🐍💀</span>';
    $('rDesc').innerHTML='<p>'+S.reason+'</p><p>'+(L.void
      ? '已缩到 '+S.body.length+' 节 / 开局 '+((L.void&&L.void.startLen)||0)+' 节（走了 '+S.steps+' 步）'
      : '得分 '+sc+' / 目标 '+L.target+'　长度 '+S.body.length+' 节')+'</p>';
    $('rBtns').innerHTML='<button id="rAgain">再来一次</button><button class="ghost" id="rMenu">选关</button>';
    $('rAgain').onclick=()=>{showConfirm(startLevel,L.id);};
    $('rMenu').onclick=()=>{openMenu();};
  }
  updateHUD();
}

/* 自由模式结算：化龙是唯一的「通关」，其余一律是失败。
   化龙先把特效放完再压面板上来 —— 266 节换来的这一下，值得让人看两秒。 */
function showResultFree(){
  const dg=!!S.dragon,dirty=S.cheatUsed;
  S.resWin=dg;   /* 化龙即胜；没化龙就是失败 */
  if(!dirty){
    const f=save.free||(save.free={best:0,bestLen:0,dragons:0});
    if(S.score>(f.best||0))f.best=S.score;
    if(S.body.length>(f.bestLen||0))f.bestLen=S.body.length;
    if(dg)f.dragons=(f.dragons||0)+1;
    writeSave();
  }
  const paint=()=>{
    show('pResult');
    $('rTitle').textContent=dg?'🐉 化龙！':'失败了'+(dirty?'（秘笈局）':'');
    $('rStars').innerHTML=dg?'<span style="font-size:32px">🐉</span>':'<span style="font-size:22px">🐍💀</span>';
    $('rDesc').innerHTML=
      '<p>'+(dg?'身体长到 <b>'+S.body.length+' 节</b>，占满地图的三分之一 —— 这条蛇成了龙。'
               :S.reason+'（化龙线 '+dragonNeed()+' 节）')+'</p>'+
      '<p>得分 <b>'+S.score+'</b>　体长 '+S.body.length+' 节　最高连击 ×'+S.bestCombo+'　化龙线 '+dragonNeed()+' 节</p>'+
      (dg?'':'<p style="color:var(--sub)">化龙进度 '+(progress()*100).toFixed(0)+'%</p>')+
      (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩不计入存档。</p>':'');
    $('rBtns').innerHTML='<button id="rAgain">再来一局</button><button class="ghost" id="rMenu">返回选关</button>';
    $('rAgain').onclick=()=>{showConfirm(L=>startLevel(L),FREE.id);};
    $('rMenu').onclick=()=>{openMenu();};
    updateHUD();
  };
  if(dg){setTimeout(paint,1600);}else paint();
}

/* 决斗模式结算：要么斩了蛇，要么死在它手里。
   胜负**只看蚀蛇死没死** —— 早先用「S.win && !S.alive」，玩家的 alive 一变就会把胜利显示成失败
   （实测截图里赢了却写着「被蚀蛇收掉」）。现在直接看对手状态，不存在歧义。 */
function duelReasonPhrase(){
  /* 统一按「致死判定」表述，而不是叙述它怎么死的 —— 玩家看的是规则，不是故事 */
  const t=String(S.reason||'');
  if(t.indexOf('咬到了自己')>=0)return '自咬判定';
  if(t.indexOf('撞上了我的身体')>=0||t.indexOf('撞我')>=0)return '撞击玩家身体判定';
  if(t.indexOf('撞进巨石')>=0)return '撞击石头判定';
  if(t.indexOf('缩没了')>=0)return '长度归零判定';
  if(t.indexOf('困')>=0)return '可行走格数归零判定';
  if(t.indexOf('停滞')>=0)return '停滞判定（'+idleTxt(DUEL.SPD_NORMAL)+' 拍未移动）';
  return t||'出局';
}
function showResultDuel(){
  const dirty=S.cheatUsed;
  const d=save.duel||(save.duel={plays:0,wins:0,bestSteps:0,fastestScore:0});
  const r0=S.rivals[0];
  const won=!!(r0&&!r0.alive);            /* 它死了 = 我赢，唯一判据 */
  S.resWin=won;
  const steps=S.steps;
  const oldBest=d.bestSteps||0;
  if(!dirty){
    d.plays=(d.plays||0)+1;
    if(won){
      d.wins=(d.wins||0)+1;
      if(!oldBest||steps<oldBest)d.bestSteps=steps;
    }
    writeSave();
  }
  show('pResult');
  if(won){
    const best=d.bestSteps||steps;
    $('rTitle').textContent='🏆 斩蛇成功';
    $('rStars').innerHTML='<span style="font-size:30px">⚔️🐍</span>';
    $('rDesc').innerHTML=
      '<p class="verdict">致敌判定：蚀蛇'+duelReasonPhrase()+'</p>'+
      '<p>用时 <b>'+steps+' 步</b>'+(oldBest&&oldBest<steps?('（最快纪录 '+best+' 步）'):'　🆕 最快纪录')+
        '　终局长度比 <b>'+duelRatio().toFixed(2)+'×</b></p>'+
      '<p>玩家终局长度 '+S.body.length+' 节　蚀蛇峰值 '+S.rivalMax+' 节　玩家吞食负数 '+S.duelNeg+' 个</p>'+
      '<p style="color:var(--sub)">挑战 '+(d.plays||1)+' 次 · 斩蛇 '+(d.wins||0)+' 次</p>'+
      (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩不计入存档。</p>':'');
  }else{
    $('rTitle').textContent='💀 你被蚀蛇收掉';
    $('rStars').innerHTML='<span style="font-size:30px">🐍💀</span>';
    $('rDesc').innerHTML=
      '<p style="color:var(--warn)">死因：'+(S.reason||'出局')+'</p>'+
      '(死因：'+(S.reason||'出局')+' · 坚持 '+steps+' 步 · 终局长度比 '+duelRatio().toFixed(2)+'×）</p>'+
      '<p>我的长度 '+S.body.length+' 节　蚀蛇 '+rivalLen()+' 节（峰值 '+S.rivalMax+'）　我烧掉的负数 '+S.duelNeg+' 个</p>'+
      '<p style="color:var(--sub)">挑战 '+(d.plays||1)+' 次 · 斩蛇 '+(d.wins||0)+' 次</p>'+
      (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩不计入存档。</p>':'');
  }
  $('rBtns').innerHTML='<button id="rAgain">再来一局</button><button class="ghost" id="rMenu">返回选关</button>';
  $('rAgain').onclick=()=>{showConfirm(L=>startLevel(L),DUEL.id);};
  $('rMenu').onclick=()=>{openMenu();};
  updateHUD();
}

/* 抢食模式结算：没有通关，只有「这局比上一局好在哪」。掠夺分 + 被抢次数都是成绩 */
function showResultRace(){
  S.resWin=false;   /* 抢食是成绩导向，没有胜负 —— 面板保持冷色 */
  const dirty=S.cheatUsed,r=save.race||(save.race={best:0,bestLen:0,eats:0,stolen:0,spoiled:0,plays:0});
  const old=r.best||0;
  const beat=!dirty&&S.score>old;
  if(!dirty){
    if(S.score>r.best)r.best=S.score;
    if(S.body.length>r.bestLen)r.bestLen=S.body.length;
    r.eats=(r.eats||0)+S.raceEats;r.stolen=(r.stolen||0)+S.raceStolen;
    r.spoiled=(r.spoiled||0)+S.raceSpoiled;r.plays=(r.plays||0)+1;
    writeSave();
  }
  show('pResult');
  $('rTitle').textContent=beat?'🥇 掠夺结束 · 新纪录！':'🥇 抢食结束';
  $('rStars').innerHTML='<span style="font-size:30px">'+(beat?'🎉':'🥇')+'</span>';
  $('rDesc').innerHTML=
    '<p>'+(S.reason||'本局结束')+'</p>'+
    '<p>掠夺分 <b>'+S.score+'</b>'+(beat?'（旧纪录 '+old+'）':'　历史最高 '+r.best)+
      '　体长 '+S.body.length+' 节　最长 '+S.bestCombo+' 连击</p>'+
    '<p>抢到方块 <b>'+S.raceEats+'</b> 块　被蚀蛇抢走 <b>'+S.raceStolen+
      '</b> 块　腐坏 <b>'+S.raceSpoiled+'</b> 块　剩余养分 '+S.nut+'</p>'+
    (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩不计入存档。</p>':'');
  $('rBtns').innerHTML='<button id="rAgain">再来一局</button><button class="ghost" id="rMenu">返回选关</button>';
  $('rAgain').onclick=()=>{showConfirm(L=>startLevel(L),RACE.id);};
  $('rMenu').onclick=()=>{openMenu();};
  updateHUD();
}

/* 第 21 关「魔术蛇」结算：撑满 60 秒 = 赢，被咬断/撞界/自咬 = 输。
   ⚠ 这模式**没有星级也没有目标分**，成绩记的是「撑了多久 / 分裂了几次 / 换位几次」——
     参照决斗模式存 plays/wins/bestSteps 的思路。 */
function showResultMagic(){
  const dirty=S.cheatUsed;
  const won=!!S.win;
  S.resWin=won;
  const mg=save.magic||(save.magic={plays:0,wins:0,splits:0,swaps:0,bestTime:0});
  const secs=Math.round(S.L.time-(S.timeLeft||0));
  if(!dirty){
    mg.plays=(mg.plays||0)+1;
    if(won)mg.wins=(mg.wins||0)+1;
    mg.splits=(mg.splits||0)+(S.magicSplits||0);
    mg.swaps=(mg.swaps||0)+(S.magicSwaps||0);
    mg.merges=(mg.merges||0)+(S.magicMerges||0);
    if(secs>(mg.bestTime||0))mg.bestTime=secs;
    writeSave();
  }
  show('pResult');
  const aliveN=S.rivals.filter(r=>r.alive).length;
  if(won){
    $('rTitle').textContent='🏁 撑满时限';
    $('rStars').innerHTML='<span style="font-size:30px">🎩🎉</span>';
    $('rDesc').innerHTML=
      '<p>在 <b>'+aliveN+' 条</b>蛇的围追下坚持满 <b>'+S.L.time+' 秒</b></p>'+
      '<p>本体分裂 <b>'+(S.magicSplits||0)+'</b> 次　分身合流 <b>'+(S.magicMerges||0)+'</b> 次　易位 <b>'+(S.magicSwaps||0)+'</b> 次</p>'+
      '<p>终局长度 '+S.body.length+' 节　得分 '+S.score+'　最高连击 ×'+S.bestCombo+'</p>'+
      '<p style="color:var(--sub)">挑战 '+(mg.plays||1)+' 次 · 撑满 '+(mg.wins||0)+' 次'+
        (mg.bestTime?' · 最长存活 '+mg.bestTime+'s':'')+'</p>'+
      (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩不计入存档。</p>':'');
  }else{
    $('rTitle').textContent='💀 折于此局';
    $('rStars').innerHTML='<span style="font-size:30px">🐍💀</span>';
    $('rDesc').innerHTML=
      '<p style="color:var(--warn)">死因：'+(S.reason||'出局')+'</p>'+
      '<p>坚持 <b>'+secs+' 秒</b> / '+S.L.time+' 秒　场上余 '+aliveN+' 条蛇</p>'+
      '<p>本体分裂 <b>'+(S.magicSplits||0)+'</b> 次　分身合流 <b>'+(S.magicMerges||0)+'</b> 次　易位 <b>'+(S.magicSwaps||0)+'</b> 次</p>'+
      '<p>终局长度 '+S.body.length+' 节　得分 '+S.score+'</p>'+
      '<p style="color:var(--sub)">挑战 '+(mg.plays||1)+' 次 · 撑满 '+(mg.wins||0)+' 次'+
        (mg.bestTime?' · 最长存活 '+mg.bestTime+'s':'')+'</p>'+
      (dirty?'<p style="color:var(--warn)">🌀 本局开过秘笈，成绩不计入存档。</p>':'');
  }
  $('rBtns').innerHTML='<button id="rAgain">再来一局</button><button class="ghost" id="rMenu">返回选关</button>';
  $('rAgain').onclick=()=>{showConfirm(L=>startLevel(L),MAGIC.id);};
  $('rMenu').onclick=()=>{openMenu();};
  updateHUD();
}

function togglePause(){
  if(!running)return;
  S.paused=!S.paused;
  if(S.paused)show('pPause');else hide('pPause');
}
function flashTips(t){$('tips').textContent=t;clearTimeout(flashTips._t);
  flashTips._t=setTimeout(()=>{$('tips').textContent=(S&&S.L.race)
    ? '方向键 / WASD 移动 · Q 冲刺 · E 爆破 · 空格暂停 · R 重来 · ESC 选关 · Tab 秘笈'
    : '方向键 / WASD 移动 · 空格暂停 · R 重来 · ESC 选关 · Tab 秘笈 · 手机可直接滑动';},2200);}
/* 抢食模式：放技能。两个技能都走逻辑层的 canSkill，HUD 与键盘/触摸三条入口共用 */
function useSkill(kind){
  if(!S||!S.L.race||S.paused||S.over)return false;
  if(!canSkill(kind)){flashTips('⚗ 养分不足或技能冷却中');return false;}
  const ok=kind==='run'?doRun():doBoom();
  if(ok)consumeEvents();
  updateHUD();
  return ok;
}

/* ================= 输入 ================= */
window.addEventListener('keydown',e=>{
  if(e.key===' '||e.key.indexOf('Arrow')===0)e.preventDefault();
  /* Tab = 秘笈入口。菜单里也要能开（解锁全关就是在菜单用的），所以放在 menuOpen 判断之前 */
  if(e.key==='Tab'){
    e.preventDefault();
    if(cheatOn('pCheat'))closeCheatPanel(false);else openCheatPanel();
    return;
  }
  /* 面板开着时，键盘全归输入框 —— 否则 WASD 会一边打字一边拐弯 */
  if(cheatOn('pCheat')){
    if(e.key==='Escape'){e.preventDefault();closeCheatPanel(false);return;}
    if(e.key==='Enter'){e.preventDefault();submitCheat();return;}
    return;
  }
  const menuOpen=!$('pMenu').classList.contains('hide');
  if(!S)return;
  if(e.key==='Escape'){openMenu();return;}
  if(menuOpen)return;
  if(!S)return;
  /* 抢食模式的技能：放在方向键之前，免得被 WASD 截胡 */
  if(S.L.race&&(e.key==='q'||e.key==='Q')){useSkill('run');return;}
  if(S.L.race&&(e.key==='e'||e.key==='E')){useSkill('boom');return;}
  if(e.key===' '){togglePause();return;}
  if(e.key==='r'||e.key==='R'){if(S){showConfirm(startLevel,S.L.id);}return;}
  const d=DIRKEY[e.key];
  if(d){if(S.paused)togglePause();if(!setDir(d))flashTips('⛔ 不能直接掉头');}
});
$('chGo').onclick=submitCheat;
$('chClose').onclick=()=>closeCheatPanel(false);
$('cheatIn').addEventListener('keydown',e=>{
  if(e.key==='Tab'||e.key==='Escape')return;   /* 留给 window：Tab/Esc 要能收面板 */
  e.stopPropagation();                        /* 其余按键别冒泡去拐弯 */
  if(e.key==='Enter')submitCheat();
});
let tsx=0,tsy=0;
stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){if(running)togglePause();return;}
  if(!S)return;
  if(S.paused)togglePause();
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  setDir(d);
},{passive:true});

$('btnWipe').onclick=()=>{

$('btnResume').onclick=()=>{togglePause();};
/* 结算窗口右上角的✕：回选关。
   结算面板永远带这一条路 —— 万一某个结局把底部按钮渲染空了，
   用户还能靠它脱身（主公报过「按钮都没了」那次，这里留个兜底）。 */
$('rClose').onclick=()=>{hide('pResult');openMenu();};
$('btnRetry2').onclick=()=>{S.paused=false;hide('pPause');showConfirm(startLevel,S.L.id);};
$('btnMenu2').onclick=()=>{S.paused=false;openMenu();};
/* 抢食模式的技能按钮（桌面用 Q/E，手机点这两个）。capture 阶段拦下来，
   否则 stage 的滑动监听也会收到这一下，点按钮顺手把蛇拐个弯。 */
$('skRun').onclick=e=>{e.stopPropagation();useSkill('run');};
$('skBoom').onclick=e=>{e.stopPropagation();useSkill('boom');};
for(const id of ['skRun','skBoom'])$(id).addEventListener('touchstart',e=>{e.stopPropagation();},{passive:true});
stage.addEventListener('touchstart',e=>{if(e.target&&e.target.closest&&e.target.closest('.sk'))e.stopPropagation();},true);

/* ================= 主循环 ================= */
let running=false,acc=0,last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  let dt=t-last;last=t;
  if(!(dt>0))dt=16.7;
  if(dt>120)dt=120;
  stepFx(dt);
  if(!S||!running||S.paused){render(1);return;}
  if(S.over){render(1);return;}
  tickInv(dt);
  tickRivals(dt);
  tickFree(dt);      /* 自由模式时钟：提速 + 到点放第一只蚀蛇（非自由模式里是空操作） */
  tickMagic(dt);     /* 第 21 关「魔术蛇」时钟：统计已存活秒数（其他模式空操作） */
  if(S.L.time){
    S.timeLeft=Math.max(0,S.timeLeft-dt/1000);
    /* ⚠⚠ 第 21 关「魔术蛇」的时间到是**赢**，不是输 —— 它和限时关（第 4 关）方向相反。
       逻辑段 step() 里已经为它提前返回 'win'，正常来说走不到这里；
       这里是兜底：万一某拍时间刚到而 step 又没判（例如秘笈虚化期），
       也绝不能按「限时失败」处理。 */
    if(S.timeLeft<=0&&!S.over&&!CHEAT.ghost&&!S.L.magic){
      S.alive=false;S.over=true;S.reason='⌛ 时间到，没能在限时内吃够';consumeEvents();showResult(false);return;}
  }
  acc+=dt;
  const iv=tickNow();
  let guard=0;
  while(acc>=iv&&!S.over&&guard<8){acc-=iv;guard++;step();consumeEvents();if(S.over)break;}
  if(S.over){if(S.win)showResult(true);else showResult(false);render(1);return;}
  updateHUD();
  render(Math.min(1,acc/iv));
}

/* ================= 启动 ================= */
loadSave();
newState(LEVELS[0].id);   /* 先建一局，画布才能算出尺寸 */
resize();
openMenu();
render(1);
requestAnimationFrame(loop);

/* 调试钩子：便于 headless 截图与自动通关验证 */
window.SB=SB;
window.__game={get S(){return S;},render,resize,startLevel,openMenu,step,setDir,updateHUD,tickNow,showResult,
  showConfirm,startDir,tickInv,tickRivals,tickFree,
  /* ⚠ consumeEvents 原先没挂 —— 但它是「事件 → 屏幕」的唯一出口。
     headless 下 rAF 不推进、主循环不跑，验收脚本就永远观测不到事件字幕；
     挂上它，验收才能手动消费事件并核对飘字（魔术蛇的分裂/易位/合流全靠它）。 */
  consumeEvents,
  /* ⚠ startLevel 收的是**关卡对象**不是 id（早先按 id 传，静默落到第 1 关，
     headless 验收会看到「启动第 11 关却显示初次蜕皮」—— 所以这里把 levelById/lvNo
     也暴露出去，调试和验收脚本才拿得到关卡对象。 */
  levelById,lvNo,LEVELS,
  availH,get CELL(){return CELL;},
  CHEAT,CHEATS,matchCheat,applyCheat,openCheatPanel,killRival,tickRivals,respawnRivals,tickInv,
  FREE,dragonNeed,tickFree,forceDragon,fangBite,rivalAt,freeUnlocked,
  RACE,raceUnlocked,raceLockText,useSkill,doRun,doBoom,canSkill,sprinting,fireRaceEvent,rotBlocks,
  /* 第 21 关「魔术蛇」+ 第五模式的解锁函数（占位）*/
  keyUnlocked,
  DUEL,duelUnlocked,duelLockText,duelRatio,rivalLen,duelRush,countNeg,countFood,
  /* 第 21 关「魔术蛇」：两条蛇（分裂 + 换位 + 合并）*/
  magicRivalMove,
  /* ⚠ 决斗 AI 与停滞判据：headless 验收要靠它们驱动「让蚀蛇动起来 / 造装死局面」，
     漏挂会报 not a function（这项目已吃过一次「加函数忘了挂 __game」的亏）。
     注意 duelStepRival 内部按局部名调 duelPickSpeed/duelRivalMove，
     所以要单独驱动 AI、不能用替身改决策，只能改 duelRivalMove（它有 SB. 前缀）。 */
  duelStepRival,duelRivalMove,duelIdleAllow,idleTxt,levelById,duelClock,rivalFeed,bodyHas,rivalHas,idx,
  set paused(v){S.paused=v;},get running(){return running;},
  setSave(o){save=migrateSave(Object.assign({},save,o));writeSave();}};
}
</script>
