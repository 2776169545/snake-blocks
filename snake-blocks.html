     无敌等于是白给的。这一段把追击权重压下去、把守粮权重抬上来。 */
  OPENING:13,
  /* 门槛（用「我的长度 / 它的长度」表示）：2 倍能开始做陷阱，3 倍能连续做，4 倍能封全场。
     它按这三个比例切换行为档位。 */
  TRAP_LINE:2, DANGER_LINE:3, WIPE_LINE:4,
  RIVAL_START:7,                                /* 开局它 7 节 */
};
function duelUnlocked(){return PROG.cleared8&&PROG.dragons>0&&PROG.racePlays>0;}
function duelLockText(){
  return (PROG.cleared8?'✅':'🔒')+' 第 8 关 · '+(PROG.dragons>0?'✅':'🔒')+' 化龙 · '+
    (PROG.racePlays>0?'✅':'🔒')+' 抢食一局';
}

/* ---------- 决斗模式：判定用的基础函数 ---------- */
/* 蛇头在 (h,d) 上还剩几个合法方向（直行 + 左右，掉头不算）。
   blocked(x,y) 决定「(x,y) 对这条蛇算不算能走」——对它自己就是石头/身体，
   对玩家就是石头 + 自己的身体 + 蚀蛇身体。返回值 0 就是「没有拐弯空间」。 */
function dirCount(h,d,blocked){
  let n=0;
  for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){
    if(dd[0]===-d[0]&&dd[1]===-d[1])continue;
    const nx=h.x+dd[0],ny=h.y+dd[1];
    if(!inB(nx,ny))continue;
    if(blocked(nx,ny))continue;
    n++;
  }
  return n;
}
/* 玩家身体＋石头：对蚀蛇来说都是「撞上去就完」 */
function blockedRival(x,y){const c=S.cells[idx(x,y)];return !!(c&&c.k==='wall')||bodyHas(x,y);}
/* 石头＋蚀蛇身体：对玩家来说也是「撞上去就完」 */
function blockedPlayer(x,y){
  const c=S.cells[idx(x,y)];
  if(c&&c.k==='wall')return true;
  for(const r of S.rivals)if(r.alive)for(const p of r.body)if(p.x===x&&p.y===y)return true;
  return false;
}
function rivalBodyHas(x,y){
  for(const p of rivalBody())if(p.x===x&&p.y===y)return true;
  return false;
}
function rivalBody(){for(const r of S.rivals)if(r.alive)return r.body;return [];}
/* 这一格是不是蚀蛇的**头**：决斗模式里用来区分「头对头」和「撞身体」 */
/* 蚀蛇长一节：接着尾巴往外延伸（不是往头上叠）。
   尾巴方向按最后两节推；只有一节时退回「头的来向」。
   如果往外那格出界或已有身体，就**不长**（宁可它少一节，也不能出现重复坐标 ——
   身体里一旦有重合坐标，下一步的自咬判定就会把它当场判死）。 */
function rivalGrow(r){
  const n=r.body.length;
  const last=r.body[n-1];
  let dx=1,dy=0;
  if(n>=2){dx=last.x-r.body[n-2].x;dy=last.y-r.body[n-2].y;}
  else if(r.dir){dx=-r.dir[0];dy=-r.dir[1];}
  if(dx===0&&dy===0){dx=1;dy=0;}
  const nx=last.x+dx,ny=last.y+dy;
  if(!inB(nx,ny))return null;
  for(const p of r.body)if(p.x===nx&&p.y===ny)return null;
  r.body.push({x:nx,y:ny,px:last.x,py:last.y});
  return r.body[n];
}
/* 蛇的自咬规则（跟经典贪吃蛇一致）：
   新头压在自己身上 → 自毙。但**这一步正要让位的那几节不算** —— 它们腾出来的格子马上就是空的。
   所以不能按「第几节」去跳（pop 之后下标会变），必须把这一步真正让位的**坐标**传进来比对。
   这条对玩家极其重要：它是「把敌人逼进它自己绕出来的圈」时最自然的死法。 */
function tailSelfBite(r,moved,vacated){
  for(let i=1;i<r.body.length;i++){
    const p=r.body[i];
    if(p.x!==moved.x||p.y!==moved.y)continue;
    let gone=false;
    for(const v of (vacated||[]))if(v&&v.x===p.x&&v.y===p.y){gone=true;break;}
    if(!gone)return p;
  }
  return null;
}
/* 这一格是不是蚀蛇的**头**：决斗模式里用来区分「头对头」和「撞身体」 */
function rivalHeadAt(x,y){
  for(const r of S.rivals)if(r.alive&&r.body.length){const h=r.body[0];if(h.x===x&&h.y===y)return true;}
  return false;
}
/* 从一格洪泛，算「走完这一步之后它还能自由活动的格子数」。
   注意这里**不能**拿 floodFrom 的距离表凑数：那个表给的是「离起点几步」，
   把距离当区域大小用，会把所有相邻格都算成 1 格 —— 于是每一步都被判成死角、AI 直接卡住不动。
   snake=自己的身体（挡路），extra=玩家身体（对它同样致命），tailVacates=这一步尾巴让位。 */
function reachCount(sx,sy,snake,tailVacates,extra){
  const w=S.w,h=S.h,cells=S.cells;
  if(!inB(sx,sy))return -1;
  const c0=cells[idx(sx,sy)];
  if(c0&&c0.k==='wall')return -1;
  const blocked=new Uint8Array(w*h);
  const n=snake.length-(tailVacates?1:0);
  for(let i=0;i<n;i++){
    const p=snake[i];
    if(p.x===sx&&p.y===sy)return -1;
    if(inB(p.x,p.y))blocked[p.x+p.y*w]=1;
  }
  if(extra)for(const p of extra){
    if(p.x===sx&&p.y===sy)return -1;
    if(inB(p.x,p.y))blocked[p.x+p.y*w]=1;
  }
  let count=0;
  const seen=new Uint8Array(w*h);
  const q=[sx+sy*w];seen[sx+sy*w]=1;
  for(let head=0;head<q.length;head++){
    const i=q[head];count++;
    const x=i%w,y=(i/w)|0;
    for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dd[0],ny=y+dd[1];
      if(!inB(nx,ny))continue;
      const j=nx+ny*w;
      if(seen[j]||blocked[j])continue;
      if(cells[j]&&cells[j].k==='wall')continue;
      seen[j]=1;q.push(j);
    }
  }
  return count;
}
/* 从 (sx,sy) 洪泛，返回「走 N 步能到」的距离表：dist[rx*w+ry] = 多走几步能到（-1=到不了）。
   蚀蛇比玩家快，所以判断「谁先到某格」要按各自的步行数算 —— 这是它能抢先横切的数学基础。 */
function floodFrom(sx,sy,blocked){
  const w=S.w,h=S.h,d=new Int16Array(w*h).fill(-1);
  if(!inB(sx,sy)||blocked(sx,sy))return d;
  const q=[sx+sy*w];d[sx+sy*w]=0;
  for(let head=0;head<q.length;head++){
    const i=q[head],x=i%w,y=(i/w)|0,nd=d[i]+1;
    for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dd[0],ny=y+dd[1];
      if(!inB(nx,ny))continue;
      const j=nx+ny*w;
      if(d[j]>=0||blocked(nx,ny))continue;
      d[j]=nd;q.push(j);
    }
  }
  return d;
}
/* 蚀蛇的「威胁距离」：只算石头 + 玩家身体，不算它自己 —— 用来判断我能不能抢先站住某个格子 */
function floodThreat(sx,sy){
  const w=S.w,h=S.h,d=new Int16Array(w*h).fill(-1);
  if(!inB(sx,sy))return d;
  const q=[sx+sy*w];d[sx+sy*w]=0;
  for(let head=0;head<q.length;head++){
    const i=q[head],x=i%w,y=(i/w)|0,nd=d[i]+1;
    for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dd[0],ny=y+dd[1];
      if(!inB(nx,ny))continue;
      const j=nx+ny*w;
      if(d[j]>=0)continue;
      const c=S.cells[j];
      if(c&&c.k==='wall')continue;
      /* 玩家身体挡路，但蛇头那一格不算（它不敢撞头） */
      if(j!==idx(headOf().x,headOf().y)&&bodyHas(nx,ny))continue;
      d[j]=nd;q.push(j);
    }
  }
  return d;
}

/* ---------- 决斗模式：蚀蛇的移动 ----------
   速度用「相位累加器」：每步 +spd，攒够 1 就走一格并减 1；1.5× 时一步能攒到 1.5，
   所以要用 while 把攒下的两格都走完（否则剩下的 0.5 白留在相位里，实测会退化成 1.0×）。
     · 常态 0.8× → 每 5 拍走 4 格（隔一拍是自然节奏）
     · 突进 1.5× → 每 2 步走 3 格
   r.movedAt 防止同一个 S.steps 里被重复调用而多走。 */
function duelStepRival(r){
  if(r.movedAt===S.steps)return;
  r.movedAt=S.steps;
  /* 速度档由它自己按局势决定（原实现里 r.rush 永远不会被置 true，加速机制是死代码）。
     先结算本拍的档位：既用于相位推进，也用于后面的燃烧率。 */
  r.spd=duelPickSpeed(r);
  r.rush=r.spd>DUEL.SPD_NORMAL+0.01;
  /* 时间减速：相位推进速率减半 → 它走一格需要的玩家步数翻倍（配合玩家侧 tick 翻倍，
     双方在墙上的观感速度一致）。放在 spd 相加之前，不改档位本身。 */
  r.phase=(r.phase||0)+r.spd*(CHEAT.half?0.5:1);
  /* 停滞窒息判定的基准坐标。用 try/finally 包住主体，是因为函数里有 4 个 return 出口
     （无候选 / 连续性失败 / 自咬回滚 / 头对头判负），漏掉任何一条都会让「装死」变成无解策略。 */
  const x0=r.body.length?r.body[0].x:-1,y0=r.body.length?r.body[0].y:-1;
  try{
    let guard=0;
  while(r.phase>=1&&guard++<4){
    r.phase-=1;
    /* 每一格都必须重新跑一次决策：duelRivalMove 里的洪泛/出口分析是**当下这一刻**的快照，
       连走两格却复用第一格的快照，第二步就会踩进自己刚占的格子（实测自咬率极高）。
       这里必须走 SB.xxx 调用：node 测试会替换它来数步数/隔离观察。 */
    const res=SB.duelRivalMove(r);
    if(!res||S.over||!r.alive)return;
    const moved=res.moved;
    if(!moved)return;
    /* 头对头：它走进我这一格、或者它站着的那格正是我要走进的 → 都算「撞头」。
       必须由蚀蛇这一侧来判，不能只看我这一步的结果 —— 否则「谁先动」会决定生死。 */
    if(S.nextHead&&moved.x===S.nextHead.x&&moved.y===S.nextHead.y){
      duelLose('头对头，撞上了蚀蛇的头');return;
    }
    for(const o of S.rivals){
      if(o===r||!o.alive||!o.body.length)continue;
      if(moved.x===o.body[0].x&&moved.y===o.body[0].y){duelLose('头对头，撞上了蚀蛇的头');return;}
    }
    }
  }finally{
    /* 停滞窒息：蚀蛇必须**在自己的速度下持续运动**。
       没有这条，被堵住的蚀蛇只要站着不动就永远不死（玩家撞它=输），
       「围剿」这条胜利途径等于不存在。

       ⚠⚠ 判据必须跟着它的速度走，不能用固定步数（这里踩过一次坑）：
         速度是相位累加器，「每步 +spd，满 1 走一格」。0.8× 时 5 拍才走 4 格，
         **每 5 拍里有 1 拍天然原地** —— 那是它的节奏，不是装死。
         早先写成固定阈值 IDLE_LIMIT=1，结果两件事同时错：
           ① 常态速度被迫从 0.8× 提到 1.0×（为了迁就判定，白白改了设计）；
           ② 「一步不动就死」被当成「每拍都必须移动」，可主公的原意是
              **不许停止运动**，不是「不许有半拍余量」。
         现在改成按速度推算它走一格需要的拍数，容许
         IDLE_SLACK 拍的余量（这一拍里没走满不算停），
         于是常态可以拿回 0.8×（比玩家慢，本来就是原设计）。 */
    if(r.alive&&!S.over&&r.body.length){
      if(r.body[0].x===x0&&r.body[0].y===y0){
        r.idle=(r.idle||0)+1;
        if(r.idle>=duelIdleAllow(r))duelKillRival(r,'蚀蛇停滞窒息');
      }else r.idle=0;
    }
  }
}
/* 停滞阈值换算成文案 —— **这是本判据的唯一算式真相**。
   判死用 duelIdleAllow(蚀蛇)（带速度与 half 修正），文案用本函数，两者必须同源。
   0.8× → ceil(1/0.8)=2 拍走一格 → 容忍 3 拍（够覆盖它隔拍的节奏）；
   1.5× / 2.8× → 1 拍走一格 → 容忍 2 拍。
   真正的判据是：**连续不动拍数超过了它的节奏所能解释的量** —— 那才是停止运动。
   放在逻辑段（浏览器段之前）：开场说明与结算面板的文案都由它出数，
   而那段代码在浏览器段里，若函数只声明在那里，node 断言就取不到。 */
function idleTxt(spd){return Math.ceil(1/Math.max(0.05,spd))+DUEL.IDLE_SLACK;}
/* 允许连续不动的最大拍数。
   ⚠ 用传入的 r.spd（**本拍 duelPickSpeed 刚算出的档位**）：决斗模式里蚀蛇的速率
     随时会变，如果读上一拍的速率，阈值会晚一拍 —— 实测 1.5× 的蛇第一拍仍按
     0.8× 的阈值 3 判，到第三拍才死，比应判的晚 1 拍。
   ⚠ 直接吃传入的 r，别绕道 S.rivals 去猜是哪一条：决斗只有一条蚀蛇是配置巧合，
     不是结构保证（这项目里被这类巧合坑过）。
   ⚠ half（时间减速秘籍）不再靠硬编码豁免：它把速率折半，阈值自动算宽到
     ceil(1/(spd*0.5))+余量，与它隔拍移动的节奏自洽 —— 之前那个 `&&!CHEAT.half`
     是补丁，不是解法。 */
function duelIdleAllow(r){
  return idleTxt(((r&&r.spd)||DUEL.SPD_NORMAL)*(CHEAT.half?0.5:1));
}
/* 燃烧率与速度成正比：越快烧得越狠。0.8× → 4 步 1 节，2.8× → 1.1 步 1 节。
   「靠超高速缩短自身腾出盘旋空间」这个打法能成立，全靠这条曲线。 */
function duelBurnEvery(spd){return Math.max(1,Math.round(DUEL.BURN_EVERY*DUEL.SPD_NORMAL/Math.max(0.1,spd)));}
/* ---------- 速度档决策 ----------
   ⚠ 原实现里 r.rush 只在初始化和死亡时被写成 false —— **AI 从来没主动开过加速**，
   所以「烧长度换速度」整套机制一直是死代码，主公说的「用加速撞头 / 横在前面 /
   超高速腾空间」全都无从谈起。这里补上决策：它自己按局势选档。

   选档依据（从高位到低位）：
     · 超高速：身体已经很长，可支配空间被自己占满 → 疯狂烧长度换机动性（盘旋用）
     · 加速  ：长度明显占优（≥TRAP_LINE）→ 追得上，压上��去撞头或横位
     · 常态  ：濒死（≤LEN_PANIC）→ 绝不加速，先去找负数回血
   地板长度（≤LEN_FLOOR）以下一律不给加速 —— 那是它最后的保命本钱。 */
function duelPickSpeed(r){
  const myLen=rivalLen(r);                /* 真实体长含待长信贷，别用 body.length */
  if(myLen<=DUEL.LEN_FLOOR)return DUEL.SPD_NORMAL;
  const h=r.body[0];
  if(!h)return DUEL.SPD_NORMAL;
  const p=headOf();
  const pd=Math.abs(h.x-p.x)+Math.abs(h.y-p.y);
  /* 饥饿优先：饿着的时候别想着烧长度瘦身了，先去找吃的。
     主公要求「得让它主动找吃的」—— 这条把饥饿直接接进速度决策：
     饥饿中它改为常态（不烧长度），因为省下的每一节都要留给找粮。 */
  if(r.starve>0)return DUEL.SPD_NORMAL;
  /* ① 超高速瘦身：从 BURST_LEN 烧到 BURST_TARGET。
        这是主公要的那个打法：宁可掉长度也要腾出转身盘旋的地方。
        ⚠ 有上限：不能一路烧到地板，否则蚀蛇会「一加速就躺平」——
        实测触发过宽时它会被烧到 4 节地板不再生长，等于自我阉割。 */
  if(myLen>=DUEL.SPD_BURST_LEN&&myLen>DUEL.BURST_TARGET)return DUEL.SPD_BURST;
  /* ② 加速：玩家就在附近 → 提速抢位（撞他的头 / 横在他必经之路上）。
        主公明确允许它这么做，所以这条优先级高于长度比。 */
  if(pd<=DUEL.RUSH_RANGE)return DUEL.SPD_RUSH;
  /* ③ 加速：长度明显占优 → 追得上，能持续施压 */
  if(duelRatio()>=DUEL.TRAP_LINE)return DUEL.SPD_RUSH;
  return DUEL.SPD_NORMAL;
}
function duelRush(r){return !!(r.rush&&rivalLen(r)>DUEL.LEN_FLOOR);}
function duelRatio(){return S.body.length/Math.max(1,rivalLen());}
/* 蚀蛇的**真实体长** = 身长 + 待长信贷。
   ⚠ 这是信贷模型下最容易漏的一处：吃下 −5 只是记了 5 点待长，
     body.length 此刻还没变。如果速度档/HUD/「我是否比他长」的判断读 body.length，
     就会把「正要长出来」误当成「很短」—— 而这恰恰是最不该误判的时候
     （刚吃到粮正要去抢位，却在 AI 眼里还是个短蛇）。
     凡是**做决策/做显示**要读体长的地方，一律走本函数；
     只有「几何/碰撞/剪尾」这类按坐标操作的地方才直接用 body.length。 */
function rivalLen(r){
  const t=r||(S.rivals&&S.rivals[0]);
  return t?(t.body.length+(t.grow||0)):0;
}
function rivalBodyLen(r){
  const t=r||(S.rivals&&S.rivals[0]);
  return t?t.body.length:0;
}

/* ---------- 决斗模式：蚀蛇的单步决策 ----------
   结构是**两段式漏斗**（原来是把抢粮/卡位/追猎/自保全加起来算总分，
   权重一失调它就会选出一个几何上自杀的走法 —— 那是之前「动不动自咬」的根因）：

     第一段 · 硬筛选：这一步会不会死 / 会不会立刻自咬 / 会不会把自己送进死角
                     → 不合格的方向直接淘汰，**不参与打分**
     第二段 · 只给「活下来」的候选打分：卡位、抢粮、追猎、少绕圈

   如果第一段把所有方向都筛掉了，说明真的被围死了：先尝试花钱掉头，否则认命
   （这正是玩家想看到的结果 —— 它被你逼到无路可走）。 */
function duelRivalMove(r){
  if(!r.alive||!r.body.length)return;
  const h=r.body[0];
  const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!(d[0]===-r.dir[0]&&d[1]===-r.dir[1]));
  r.fd=floodFrom(h.x,h.y,blockedRival);
  const tp=floodThreat(headOf().x,headOf().y);
  const ratio=duelRatio();
  const aggro=ratio<DUEL.TRAP_LINE?1.35:(ratio<DUEL.DANGER_LINE?1.0:(ratio<DUEL.WIPE_LINE?0.55:0.15));
  const panic=rivalLen(r)<=DUEL.LEN_PANIC;
  /* 饥饿时追击让位于找粮（主公：「得让它主动找吃的」）。
     starve 计数越大越急 —— 饿了两轮还没吃到，追你就是在自杀（饿死了玩家赢）。
     实现方式是**压低追击权重 + 提高下面 food 的权重**，而不是硬开关：
     硬开关会让它突然「不看玩家」，看起来像卡bug；压权重则保留它的判断力。 */
  const hunger=r.starve||0;
  /* 临界长度：离饿死线只差几节时，任何进攻都是奢侈品。
     hunger 记录的是「饿了几轮」，但真正决定生死的是**剩余几节** ——
     长度 3 节时下一次饥饿就直接死，它不该还在算你的下一步落点。
     这里把「距离饿死线的余量」也算进求生态，量级比 starvation 更紧迫。 */
  const nearDeath=Math.max(0,rivalLen(r)-DUEL.STARVE_DEATH);
  const starving=hunger>0||nearDeath<=DUEL.PANIC_LEN;
  const aggroEff=aggro*(starving?Math.max(0.15,0.8-0.3*hunger-0.15*nearDeath):1);
  const pt=headOf();

  /* ---------- 二阶空间压制 + 负数诱导（主公要的「会围剿」与「会诱导」）----------

     现状的问题：AI 只会「追着头打 + 脚下有负数就吃」，既不会围，也不会主动去粮场。
     下面两段把战场从「玩家脚下两格」换成「玩家整块活动区域 + 负数方块的分布」。

     ① 空间压制：算「我走完这一步之后，玩家还剩多少格可去」。
        玩家头是 flood 的**起点**（不是障碍），玩家的身体 + 蚀蛇的**新身体**是障碍。
        挤掉的格子越多、分越高。这是从「堵拐弯」升级到「收口」的分界 ——
        压出来的空间会把玩家挤离负数密集区（撞负数要掉长度，玩家自己会躲），
        所以这一项同时也在替你完成「负数诱导」。 */
  const roomAfter=(nx,ny)=>{
    const body=[{x:nx,y:ny}].concat(r.body);           /* 蚀蛇走完后的身体 */
    const pLen=S.body.length-(S.dmgStep?0:1);          /* 玩家尾巴这一步会让位 */
    let n=0;const seen=new Uint8Array(S.w*S.h);
    const s0=idx(pt.x,pt.y);
    if(!inB(pt.x,pt.y))return -1;
    const q=[s0];seen[s0]=1;
    for(let head=0;head<q.length;head++){
      const i=q[head];n++;
      const x=i%S.w,y=(i/S.w)|0;
      for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ax=x+dd[0],ay=y+dd[1];
        if(!inB(ax,ay))continue;
        const j=idx(ax,ay);
        if(seen[j])continue;
        const cc=S.cells[j];
        if(cc&&cc.k==='wall')continue;
        /* 玩家身体挡路，但头那一格不算（蚀蛇不敢也不该撞头） */
        let blockedByBody=false;
        for(let k=1;k<pLen;k++){const q2=S.body[k];if(q2.x===ax&&q2.y===ay){blockedByBody=true;break;}}
        if(!blockedByBody)for(let k=0;k<body.length;k++){
          const q3=body[k];if(q3.x===ax&&q3.y===ay){blockedByBody=true;break;}
        }
        if(blockedByBody)continue;
        seen[j]=1;q.push(j);
      }
    }
    return n;
  };
  /* 负数诱导：把「玩家够得着的负数」标成靶子，朝离靶子更近的走法加分。
     这条是主公那套博弈的落点 —— 玩家吃负数 = 自己掉长度 + 断蚀蛇一餐，
     所以蚀蛇真正的进攻方向不是撞死玩家，而是**先一步把负数吃干净、
     或者把玩家从负数堆里挤出去**（两者都在这段里）。 */
  const bait=(()=>{
    /* 负数诱导的靶子 = 「玩家够得着的负数方块」。
       主公的博弈是：玩家吃 neg = 自己掉长度 **且** 断蚀蛇一餐，所以玩家会主动去抢；
       蚀蛇的应对只有两条 —— ① 自己先吃到（断粮），② 抢在玩家前面把路堵死。
       两者可以统一成一个动作：**朝那个 neg 靠**。
       contested（玩家也在够）时价值翻倍 —— 那正是「它要断我一餐」的节点。 */
    let bx=null,by=null,bs=0;
    /* 开局缓冲：无敌那几步把守粮的优先级抬到最高 —— 先抢负数攒家底，别贴脸送。 */
    const openBoost=(S.steps<DUEL.OPENING)?(1.8-0.8*(S.steps/Math.max(1,DUEL.OPENING))):1;
    for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
      const c=S.cells[idx(x,y)];
      if(!c||c.k!=='neg')continue;
      const j=idx(x,y);
      const myS=r.fd[j];
      if(myS<0)continue;                       /* 我绕不过去 */
      const pS=tp[j];
      const contested=(pS>=0&&pS<=myS+3);
      let sc=DUEL.BAIT/(1+myS*0.15);
      if(contested)sc*=1.8;
      if(sc>bs){bs=sc;bx=x;by=y;}
    }
    return bs>0?{x:bx,y:by,s:bs*openBoost}:null;
  })();
  /* ---------- 抢星靶子 ----------
     稀有块 6/7/8 是**中立资源**（主公 2026-10-10 定）：它吃到也涨 v 节，
     所以那颗星是它**也想要**的东西 —— 不写这条，它在 AI 眼里只会「顺路踩到」，
     看着就像对星毫无兴趣，抢不起来。
     ⚠ 权重压在拦截（68）之下，且只在 RARE_RANGE 格内生效：
       为一颗星横穿半张图会把调好的进攻节奏丢光（踩过一次：手段压过目的，
       它就成了只会捡分不会杀人的蛇）。 */
  const rareT=(()=>{
    if(!rareOn())return null;
    let bx=null,by=null,bs=-1e9;
    for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
      const c=S.cells[idx(x,y)];
      if(!c||!c.rarity)continue;
      const j=idx(x,y);
      const myS=r.fd[j];
      if(myS<0||myS>DUEL.RARE_RANGE)continue;      /* 够不着 / 太远，只抢顺路的 */
      const pS=tp[j];
      let sc=DUEL.RARE_BAIT/(1+myS*0.12);
      if(pS>=0&&pS<myS)sc*=0.4;                    /* 玩家明显更近：抢多半白抢，别浪费步数 */
      if(sc>bs){bs=sc;bx=x;by=y;}
    }
    return bs>-1e8?{x:bx,y:by,s:bs}:null;
  })();
  /* ---------- 自己的觅食靶子 ----------
     ⚠⚠ 这是主公报的「都快饿死了还想着进攻」的**根因**，不是权重问题：
     `food` 评分只在**脚下就是负数**的那一格给分（吃得到才给），
     于是「朝负数靠近」的所有中间步骤 food 全是 0 ——
     在贪心 AI 眼里，朝粮走和原地不动**得分完全一样**，
     它当然会选别的（拦截 34 分 / 追击 / 空间压制都是正分）。
     这与当年「拦截只在正好踩到落点才给分」是同一类错误：
     **贪心 AI 必须为「朝目标靠近」付分，否则多步目标永远竞争不过单步收益。**

     靶子定义：自己走得到（r.fd>=0）、且**玩家抢不到**（tp 更大）的负数优先——
     玩家够不着的粮才是安全的粮。若没有这种，就退而取自己够得着的最近的。
     评分：靠近一格给分，够不到/玩家先到则大幅降权（避免它去抢玩家嘴边那块）。 */
  const forage=(()=>{
    if(!starving)return null;      /* 不饿不找 —— 平时仍以压制/拦截为主 */
    let fx=null,fy=null,fs=-1e9;
    for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
      const c=S.cells[idx(x,y)];
      if(!c||c.k!=='neg')continue;
      const j=idx(x,y);
      const myS=r.fd[j];
      if(myS<0||myS>60)continue;               /* 绕不过去 / 太远，来不及 */
      const pS=tp[j];
      let sc=DUEL.BAIT*1.6/(1+myS*0.10);
      if(pS<0)sc*=1.8;                         /* 玩家够不到 = 安全粮，大优 */
      else if(pS<=myS)sc*=0.25;                /* 玩家比我快：抢多半白抢，压到极低 */
      if(sc>fs){fs=sc;fx=x;fy=y;}
    }
    return fs>-1e8?{x:fx,y:fy,s:fs}:null;
  })();
  r.trail=r.trail||[];
  if(r.trail.length===0||r.trail[0].x!==h.x||r.trail[0].y!==h.y)r.trail.unshift({x:h.x,y:h.y});
  if(r.trail.length>10)r.trail.length=10;

  /* ---------- 第一段：硬筛选 ---------- */
  const cand=[];
  for(const d of opts){
    const nx=h.x+d[0],ny=h.y+d[1];
    if(!inB(nx,ny))continue;                             /* 出界 = 撞墙 = 死 */
    if(blockedRival(nx,ny))continue;                     /* 石头或玩家身体：走上去就是死 */
    const eaten=isFood(S.cells[idx(nx,ny)]);             /* 吃到方块 → 尾巴不让位 */
    /* 自咬预判：走完这一步，新头会不会压在自己身上（让位的尾巴不算） */
    /* 让位的尾巴格：吃到东西、或有待长信贷（本步免剪尾）时，尾巴这一格会留给我们站 */
    const tailStays=(eaten||(r.grow||0)>0)?1:0;
    const lastBody=Math.max(1,r.body.length-tailStays);
    let selfHit=false;
    for(let i=1;i<lastBody;i++){
      if(r.body[i].x===nx&&r.body[i].y===ny){selfHit=true;break;}
    }
    if(selfHit)continue;                                 /* 自杀走法：淘汰 */
    /* 死角判据：走完之后的**真实可达格数**不能低于「身体长度 * 1.2」——
       低于这个数基本就是把自己塞进一条死巷，几步后必死。
       注意这里要现算一次洪泛：r.fd 给的是「离我几步」，不是区域大小。 */
    const myLen=rivalLen(r);          /* 真实体长含待长信贷（马上会长出来，别按短身体判死角） */
    const room=reachCount(nx,ny,r.body,!tailStays,S.body);
    if(room<0)continue;                                  /* 目标格不可站 */
    if(room<myLen*(S.invT>0?0.55:1.2))continue;          /* 送进死角：淘汰（无敌期只卡「完全走不动」） */
    const j=nx+ny*S.w;
    cand.push({dir:d,nx:nx,ny:ny,c:S.cells[j],space:room,
      pNow:dirCount({x:nx,y:ny},d,blockedPlayer),
      rivalSteps:r.fd[j],playerSteps:tp[j],
      selfTurn:dirCount({x:nx,y:ny},d,blockedRival)});
  }

  /* ---------- 第二段：只给活下来的候选打分 ---------- */
  /* 玩家当前的活动面积（我不动时）—— 对所有候选是同一个值，循环外算一次 */
  const roomBase=roomAfter(h.x,h.y);
  let best=null,bestScore=-1e9;
  for(const k of cand){
    const {dir:d,nx,ny,c}=k;
    /* ① 卡位：玩家站到这里还剩几个拐弯方向（0 个最致命） */
    const tc=k.pNow===0?26:(k.pNow===1?12:0);
    /* ② 抢时间：按各自的步行数折算，谁先到 */
    let timeBonus=0;
    if(k.playerSteps>=0){
      const myArrive=k.rivalSteps/(r.spd||1);
      if(myArrive<k.playerSteps-1.2)timeBonus=7;         /* 明显抢先，能卡住它的路 */
      else if(myArrive>k.playerSteps+1.2)timeBonus=-6;   /* 慢了，白跑一趟 */
    }
    /* ③ 追猎 / 保命：按长度比切换，不一味躲 */
    const dist=Math.abs(nx-pt.x)+Math.abs(ny-pt.y);
    /* 开局缓冲（OPENING 步内）：追击权重压到很低 —— 无敌只够撑十几步，
       它开局就贴脸的话玩家连发育窗口都没有，这一局等于白给无敌。 */
    const openCut=(S.steps<DUEL.OPENING)?(0.25+0.75*(S.steps/Math.max(1,DUEL.OPENING))):1;
    let chase=0;
    if(r.body.length<3)chase=dist*2.0;                   /* 太短：躲远点 */
    else if(ratio<DUEL.TRAP_LINE)chase=(12-dist)*aggroEff*openCut;  /* 我短：贴上去压 */
    else if(ratio<DUEL.WIPE_LINE)chase=(8-dist)*aggroEff*openCut;   /* 势均：中等距离 */
    else chase=dist*1.6*aggro;                           /* 我长：拉开，保命 */
    /* ④ 挑食：负数才是粮，正数是毒（不区分的话它会把自己缩死） */
    let food=0;
    if(c&&(c.k==='neg'||c.k==='block')){
      const v=c.v||1;
      /* ⚠ 饥饿加乘：主公反馈「都快饿死了还想着进攻」。
         早先只在 duelPickSpeed 里把档位锁成常态、压低追击权重，但**不够**——
         拦截(68)、空间压制、绕圈避让全是进攻/自保项，food 满分才 44×v≈132，
         饿到濒死时它照样为了「卡住你下一步」而放弃眼前的粮。
         这里给 food 一个随饥饿递增的倍率，并且饥饿时**关掉拦截**（见下）。
         分两档：hunger≥1 是「开始饿了」→ 1.8×；hunger≥3 是「快饿死了」→ 3.2×。 */
      /* starving 覆盖两种求生态：已经饿过几轮（hunger>0）、
         或者离饿死线只剩几节（nearDeath<=PANIC_LEN）——
         后者更紧迫：它下一次饥饿就直接死了。 */
      const boost=starving?(hunger>=3||nearDeath<=1?3.2:1.8):1;
      /* ⚠ 顺序：稀有块也是 k==='block'，必须**排在普通正数之前**判，
         否则会掉进「正数是毒」那条分支，它就会躲着星走。 */
      if(c.rarity)food=(panic?70:35)*v*boost;    /* 中立资源：吃到涨 v 节 */
      else if(c.k==='neg')food=(panic?90:44)*v*boost/(1+Math.abs(nx-pt.x)*0.04);
      else food=-30*v*boost;                     /* 普通正数对它仍是毒 */
    }
    /* ⑤ 空间与绕圈：空间大一点更好；离最近几步走过的头部太近就扣分（对付盘成一团） */
    const safety=Math.min(k.space<0?0:k.space,40)*0.5;
    let loop=0;
    for(let t=0;t<Math.min(8,r.trail.length);t++){
      const q=r.trail[t];
      const md=Math.abs(q.x-nx)+Math.abs(q.y-ny);
      if(md<=1)loop-=(9-t)*2;
      else if(md===2)loop-=(5-t);
    }
    /* ⑥ 二阶空间压制：这一步走完，**玩家**还剩多少格可去（比现在多少少）。
       这是「会围剿」和「只会追」的分界：一阶只盯玩家脚下两格，玩家退一步就化解；
       二阶盯的是玩家整块活动面积，挤得掉才算真围住。
       ⚠ ratio 是「玩家长度 / 蚀蛇长度」，**比值越小蚀蛇越强、越有资格收口**：
         它占优（ratio<1）时全权重压；玩家长到它的两倍（ratio≥TRAP_LINE）时压制近乎无效，
         只留 0.6 权重当作尝试。早先写成 `ratio>=TRAP_LINE 才压`，方向正好搞反 ——
         实测 8 局里蚀蛇/玩家≈1.3，条件几乎从不满足，这一项成了死代码。 */
    const after=roomAfter(nx,ny);
    let press=0;
    /* 饥饿时不收口（hunger>0 即降为0）：饿着还围剿是找死 ——
       它每 25 拍掉 1 节、降到 '+DUEL.STARVE_DEATH+' 节就死，
       而围剿要花几十拍才能见效。主公说的「都快饿死了还想着进攻」就是这个。 */
    if(after>=0&&!panic&&!starving&&roomBase>=0&&roomBase>after){
      const pW=ratio<1?1.3:(ratio<DUEL.TRAP_LINE?1:0.6);
      press=(roomBase-after)*DUEL.PRESS*pW;
    }
    /* ⑦ 负数诱导：朝那个「玩家够得着的负数」靠一步。
       它不需要咬玩家 —— 玩家自己会为了断它一餐去碰负数，
       所以守住粮道比追身体更划算，这就是主公那条博弈的落点。 */
    let baitPull=0;
    if(bait){
      const dTo=Math.abs(nx-bait.x)+Math.abs(ny-bait.y);
      const hTo=Math.abs(h.x-bait.x)+Math.abs(h.y-bait.y);
      if(dTo<hTo)baitPull=bait.s;             /* 靠近了一格 */
      else if(dTo===hTo)baitPull=bait.s*0.4;  /* 平移也算数（绕到另一条路） */
      /* 求生态下加乘：bait 指向的就是负数，饿着时这是唯一该去的地方 */
      if(starving)baitPull*=1.6;
    }
    /* ⑩ 自觅：朝**自己**够得着的负数靠近就得分（不是踩到才给）。
       这条是主公那条反馈的直接解药 —— 见 forage 的注释。
       不饿时不生效（forage 本身返回 null），保持原来的进攻节奏不变。 */
    let foragePull=0;
    if(forage){
      const dTo=Math.abs(nx-forage.x)+Math.abs(ny-forage.y);
      const hTo=Math.abs(h.x-forage.x)+Math.abs(h.y-forage.y);
      if(dTo<hTo)foragePull=forage.s;            /* 靠近一格 */
      else if(dTo===hTo)foragePull=forage.s*0.4; /* 平移（绕另一条路也算） */
    }
    /* ⑪ 抢星：朝那颗稀有块靠近就得分（同样不能「踩到才给」，贪心 AI 需要过程分）。
       饿着的时候不抢 —— 稀有块不一定在附近，饿死线前去找星是拿命赌。 */
    let rarePull=0;
    if(rareT&&!starving){
      const dTo=Math.abs(nx-rareT.x)+Math.abs(ny-rareT.y);
      const hTo=Math.abs(h.x-rareT.x)+Math.abs(h.y-rareT.y);
      if(dTo<hTo)rarePull=rareT.s;
      else if(dTo===hTo)rarePull=rareT.s*0.4;
    }
    /* ⑧ 拦截卡位：抢占玩家**下一步**的落点。规则是「玩家撞蚀蛇 = 玩家输」，
       所以站在它的必经之路上就等于赢 —— 这是蚀蛇最直接、最省事的攻击手段，
       也正是主公说的「横在我前面让我失败」。
       ⚠ 只在「这一步正好踩到落点」给分是不够的：贪心 AI 逐点评分，
         它此刻离落点还有两格，这两格一分都拿不到，就会跑去吃负数。
         所以分两段给：朝落点**靠近**先拿一半，正好占满再拿满 —— 相当于让它为
         「下下步的拦截」做准备。 */
    let intercept=0;
    /* ⚠ 饥饿时**彻底关闭拦截**（不是降权，是关掉）：
       拦截的价值是「几拍之后玩家撞上来我判它死」，
       而饥饿的判据是「'+DUEL.STARVE_EVERY+' 拍内不吃东西就掉 1 节」——
       两者的时钟完全不同步。饿死之前玩家根本不会来撞它，
       还在这算落点就是纯粹的浪费步数。
       hunger===0 才是「有余裕搞小动作」的状态。 */
    if(S.nextHead&&!starving){
      const dNow=Math.abs(h.x-S.nextHead.x)+Math.abs(h.y-S.nextHead.y);
      const dAfter=Math.abs(nx-S.nextHead.x)+Math.abs(ny-S.nextHead.y);
      if(dAfter<dNow)intercept+=DUEL.INTERCEPT*0.5;          /* 往落点靠 */
      if(dAfter===0&&dNow>0)intercept+=DUEL.INTERCEPT*0.5;    /* 正好占住 */
    }
    /* ⑨ 撞头：玩家就在下一格旁边且我能先占住它 → 加速冲上去（配合上面的拦截）。
       同样受饥饿限制：饿着的时候不该主动送上门。 */
    if(!starving&&r.spd>DUEL.SPD_NORMAL+0.01&&S.nextHead&&Math.abs(nx-S.nextHead.x)+Math.abs(ny-S.nextHead.y)<=1)
      intercept+=DUEL.INTERCEPT*0.4;

    const sc=tc+timeBonus+chase+food+safety+loop+press+baitPull+foragePull+rarePull+intercept+(k.selfTurn===0?-25:0)+(S.rnd()*3);
    if(sc>bestScore){bestScore=sc;best={nx:nx,ny:ny,dir:d};}
  }
  if(!best){
    /* 第一段把候选清空了。处理顺序：
       ① 花钱破局掉头；
       ② 都做不到就**朝玩家冲过去**（主公：「实在无路可走，直接撞上去，我赢」）。
          不再原地等死 —— 原地不动会被停滞窒息判定掐死，而且装死本来就是无解策略。
          这一格哪怕会自咬、哪怕会撞上玩家身体都去：撞上玩家身体 = 蚀蛇判死玩家赢，
          自咬 = 蚀蛇判死玩家赢，横竖都是玩家赢，区别只是场面是主动的还是躺着的。 */
    if(duelSpendTurn(r))return;
    r.stuck=(r.stuck||0)+1;
    const pc=headOf();
    let desperate=null,dsc=-1e9;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      let nx=h.x+d[0],ny=h.y+d[1];
      if(!inB(nx,ny))continue;
      if(S.L.wrap&&!inB(nx,ny)){const w2=wrapXY(nx,ny);nx=w2[0];ny=w2[1];}
      const c=S.cells[idx(nx,ny)];
      if(c&&c.k==='wall')continue;
      const dd=Math.abs(nx-pc.x)+Math.abs(ny-pc.y);
      /* 冲向玩家、且优先落在玩家下一步的位置（那就是拦截） */
      let sc=-dd;
      if(S.nextHead&&nx===S.nextHead.x&&ny===S.nextHead.y)sc+=DUEL.CHARGE;
      sc+=S.rnd()*2;
      if(sc>dsc){dsc=sc;desperate={nx,ny,dir:d};}
    }
    if(!desperate)return;                 /* 连玩家方向都出不去：真的无解，交给停滞判定 */
    const prevD=r.dir.slice();
    r.dir=desperate.dir;
    const mv={x:desperate.nx,y:desperate.ny,px:h.x,py:h.y};
    const vac=[];
    r.body.unshift(mv);
    vac.push(r.body.pop());
    S.events.push({type:'charge',x:desperate.nx,y:desperate.ny,
      text:'☠ 蚀蛇无路可走，朝你冲过来',t:S.steps});
    if(S.nextHead&&desperate.nx===S.nextHead.x&&desperate.ny===S.nextHead.y){
      duelLose('头对头，撞上了蚀蛇的头');return;
    }
    return {moved:mv,charge:1};
  }
  /* 不变量自检：这一步走完必须仍是一条**连续**的蛇身（相邻节距离为 1）。
     不连续就说明几何被算坏了 —— 那种状态下它下一步一定「莫名自咬」。
     真出现就整条按坐标重建，宁可它原地不动，也不要它自己把自己弄死。

     ⚠ 这里必须拼**整条** r.body，不能写 r.body.slice(1)：
     新头占据的是**旧头 body[0]** 那一格（下面的 unshift(moved) + pop() 就是这么做的，
     移动后身体 = [新头, 旧B0, 旧B1, …, 旧Bn-2]）。早先误写成 slice(1) 把旧头切掉了，
     于是自检拿新头去比 body[1] —— 无论直行还是转弯，曼哈顿距离恒等于 2，永远判成不连续，
     蚀蛇在决斗模式下 100% 原地卡死（实测 63 步位移 0）。围剿、诱导、烧长度加速一局都没跑过。 */
  {
    const test=[{x:best.nx,y:best.ny}].concat(r.body);
    let broken=false;
    for(let i=1;i<test.length;i++){
      if(Math.abs(test[i].x-test[i-1].x)+Math.abs(test[i].y-test[i-1].y)!==1){broken=true;break;}
    }
    if(broken)return;                     /* 不动：交给收口计时 */
  }
  if(typeof DBG_DUEL!=='undefined'&&DBG_DUEL)DBG_DUEL(r,best,dirCount({x:best.nx,y:best.ny},best.dir,blockedRival),S.steps);
  const prevDir=r.dir.slice();
  r.dir=best.dir;
  const moved={x:best.nx,y:best.ny,px:h.x,py:h.y};
  /* 这一步真正「让位」的坐标（正常尾巴 + 烧长度多剪的那一节）：
     自咬判定要按坐标把它们排除掉，按节数跳会跳错。 */
  const vacated=[];
  r.body.unshift(moved);
  /* 尾巴规则与玩家同构：有待长信贷就**免剪**并消耗 1 点，没有才正常缩尾。
     玩家的写法是 `if(S.grow>0)S.grow--;else S.body.pop();` ——
     语义是「吃掉一块、还剩几节要补」，所以 len+grow 才是最终体长。
     ⚠ 加速烧长度时**即使有信贷也要剪**（那是自付代价，不该被信贷抵消），
     否则它一加速就白长。 */
  const burnNow=r.rush&&((r.burn=(r.burn||0)+1)>=duelBurnEvery(r.spd));
  if(burnNow)r.burn=0;
  if((r.grow||0)>0&&!burnNow)r.grow--;
  else vacated.push(r.body.pop());   /* 正常的尾巴让位 */
  /* 加速就烧长度：**燃烧率跟着实际速度走**（duelBurnEvery），
     整条蛇的长度变化 = 头 +1 − 尾 −1 = 0，所以烧长度必须**额外**再剪一节，
     否则「烧」这件事在净长度上根本看不出来。
     超高速档（2.8×）约 1.1 步烧 1 节 —— 这就是主公要的「靠高速移动缩短自身、
     腾出空间盘旋」的自付代价。 */
  if(burnNow){
    if(r.body.length>DUEL.LEN_FLOOR){
      const extra=r.body.pop();       /* 额外的代价 */
      if(extra)vacated.push(extra);
      S.events.push({type:'burn',x:moved.x,y:moved.y,
        text:(r.spd>DUEL.SPD_RUSH?'🔥 ':'⚡ ')+'蚀蛇烧掉 1 节（'+r.spd.toFixed(1)+'×）',t:S.steps});
    }
  }
  /* 吃到方块：负数它增长（记信贷）、正数它缩短（共享方块的对偶） */
  rivalFeed(r);
  /* 自咬：新头压在自己身上。**当场自毙 —— 玩家赢。**
     这是「把敌人逼进它自己绕出来的圈」最自然的死法，也是这模式最主要的胜利途径。
     ⚠ 早先这里写成「回滚 + stuck++」，理由是「AI 选路时已经预判过，真发生说明索引算错了」，
        于是它永远不死 —— 结果是蚀蛇一旦自咬就**永久卡死**（stuck 累加到 doomed，
        被收口计时判「认命」），玩家永远赢不了，规则也等于不存在。方向完全搞反了：
        真自咬该判它死，只有「身体几何本身不连续」才是索引 bug，那种情况才回滚容错。
     开局无敌期内不判死（那段时间它在出生阶段，几何更容易出错，交给回滚）。 */
  if(r.alive){
    const hit=tailSelfBite(r,moved,vacated);
    if(hit){
      /* 先自检身体是否连续 —— 连续则自咬是真的，不连续则是几何算坏了 */
      let cont=true;
      for(let i=1;i<r.body.length;i++){
        const a=r.body[i-1],b2=r.body[i];
        if(Math.abs(a.x-b2.x)+Math.abs(a.y-b2.y)!==1){cont=false;break;}
      }
      if(cont&&S.invT<=0){
        duelKillRival(r,'蚀蛇咬到了自己');
        return {moved:moved,bite:1};
      }
      /* 几何不可信（或还在无敌期）：回滚这一步，原地不动。
         ⚠ 回滚必须把 vacated 里的坐标**逆序全部**放回去。两个坑都踩过：
           ① 早先错写成 `push(新头坐标)` —— 等于把新头塞进尾巴位，身体变成 [旧头,颈,…,新头]，
              新头那一格反被自己的身体占住，蚀蛇「脑袋卡在自己蛇身上」动不了（主公实测）。
           ② 改成 push 原尾巴后仍断裂 651 次 —— 因为**加速态会额外剪掉一节尾巴**，
              vacated 有两个坐标，只补一个就少一节、坐标错位。
              这个 bug 在 ghost 模式下暴露得最凶（蚀蛇走得勤 → burn 触发频繁 → 断裂 651 次），
              正常模式因为它几乎不动所以看不出来。教训：**回滚要把位移逐一还原，不能只还原一部分**。 */
      r.body.shift();
      for(let i=vacated.length-1;i>=0;i--)if(vacated[i])r.body.push(vacated[i]);
      r.dir=prevDir;
      r.stuck=(r.stuck||0)+1;
      /* ⚠ 这里必须报「没动」（moved:null），不能回一个假的 moved 坐标 ——
         duelStepRival 会拿 res.moved 去判「是否撞上玩家头」，
         回滚状态下那格它根本没进去，报上去可能凭空判玩家输。 */
      return {moved:null,bite:1};
    }
  }
  /* 拐弯空间被堵死的计时：进入死亡行军 */
  const tp2=dirCount({x:moved.x,y:moved.y},r.dir,blockedRival);
  if(tp2<=DUEL.TURN_WINDOW){
    r.choke=(r.choke||0)+1;
    if(r.choke===1)S.events.push({type:'choke',x:moved.x,y:moved.y,text:'🪤 蚀蛇被堵住拐弯空间',t:S.steps});
  }else r.choke=0;
  return {moved:moved,bite:0};
}

/* ---------- 决斗模式：花钱破局（被困死时的最后一搏） ---------- */
function duelSpendTurn(r){
  if(r.body.length<DUEL.LEN_FLOOR+DUEL.TURN_COST)return false;
  if(S.steps-((r.turnCd)||0)<DUEL.TURN_CD)return false;
  const h=r.body[0];
  if(!h)return false;
  /* 反向掉头：允许它走进「来向」那一格（正常规则下这是禁止的） */
  const bx=h.x-r.dir[0],by=h.y-r.dir[1];
  if(!inB(bx,by))return false;
  const cell=S.cells[idx(bx,by)];
  if(cell&&cell.k==='wall')return false;
  for(const p of S.body)if(p.x===bx&&p.y===by)return false;   /* 那格有玩家身体：不许撞上去 */
  r.turnCd=S.steps;
  /* U 形回转的几何（这个函数错了三次，每次错法都不一样，逐条记下来）：
     头进「来向」格，整条身体**往后挪一格**：新身体 = [来向格(新头), 旧头(新颈), b1, b2, …]。
       错误 A：`splice(1,1)` 摘掉脖子、保留旧头 → [新头, 旧头, body[2], …]，
         旧头与 body[2] 中间隔着被摘走的脖子 → **必然断裂**（实测 ghost 下断裂 506 次）。
       错误 B：`shift()` 摘旧头 **又** unshift 新头 → 来向格上叠了两节 → **重复坐标**。
       错误 C：加了「来向格必须等于 body[1]」的前置条件 —— 方向反了。
         来向格正是原脖子所在格（直行时 h - dir == body[1]），蛇头走进自己脖子格**就是自咬**，
         本来就不该允许。真正的合法场景是**身体弯折、来向格是空格**（AI 无路可走时才来破局）。
     正确条件：来向格既不是自己的身体，也不是玩家身体（上面已查玩家），且不是脖子格。 */
  for(let i=1;i<r.body.length;i++)if(r.body[i].x===bx&&r.body[i].y===by)return false;
  r.body.unshift({x:bx,y:by,px:h.x,py:h.y});     /* 整条身体往后挪一格，旧头位变新颈 */
  /* 代价：unshift 补回 1 节，再剪 TURN_COST+1 节 → 净长度 −TURN_COST */
  for(let i=0;i<=DUEL.TURN_COST&&r.body.length>1;i++)r.body.pop();
  r.dir=[-r.dir[0],-r.dir[1]];
  S.events.push({type:'turnbuy',x:bx,y:by,text:'💸 蚀蛇烧 '+DUEL.TURN_COST+' 节强行掉头',t:S.steps});
  return true;
}

/* ---------- 决斗模式：每步的规则结算 ---------- */
function initDuelState(S0){
  S0.duelWins=0;S0.duelNeg=0;
  S0.rivalMax=DUEL.RIVAL_START;
}
/* 开局铺负数：必须等玩家的身体建好之后再调（pickSpot → freeSpots 要读蛇头） */
/* 负数补给的参数出处：决斗模式走 DUEL.*，其余标了 neg 的关卡（第 15 关「噬魂魔蛇」）
   走关卡自己的配置。⚠ 抽成 negCfg() 而不是让两边各写一份 —— 两处真相迟早对不上。 */
function negCfg(){
  if(S.L.duel)return {min:DUEL.negMin,max:DUEL.negMax,vmin:DUEL.vmin,vmax:DUEL.vmax,every:DUEL.negEvery};
  return S.L.neg||null;
}
function negSeed(){
  const g=negCfg();if(!g)return;
  for(let i=0;i<g.min;i++)if(!negSpawn())break;
}
/* 负数独立补给（不跟关卡模式那套 hazards 共用参数）。
   地块类型用 'neg'：跟正数分开计数，它才有独立的上限和补位节奏。 */
function negSpawn(){
  const g=negCfg();if(!g)return false;
  if(countNeg()>=g.max)return false;
  const p=pickSpot(4);if(!p)return false;
  const v=g.vmin+((S.rnd()*(g.vmax-g.vmin+1))|0);
  S.cells[idx(p.x,p.y)]={k:'neg',neg:1,v:v,id:S.nextSpawnId++};
  return true;
}
/* 每步的负数补给时钟。决斗模式与第 15 关共用。 */
function negClock(){
  const g=negCfg();if(!g)return;
  if(countNeg()<g.min&&S.steps%(g.every||8)===0)negSpawn();
}
/* 每步推进：蚀蛇最高长度、补给、收口计时判定 */
function duelClock(){
  const r=S.rivals[0];
  if(r&&r.alive&&r.body.length>S.rivalMax)S.rivalMax=r.body.length;
  /* 负数补给交给 negClock()（决斗模式与第 15 关共用），这里只管饥饿与收口 */
  if(r&&r.alive){
    /* 饥饿掉长度（主公规则）：连续 STARVE_EVERY 拍没进食就掉 1 节，饿到 STARVE_DEATH 节即死。
       计时用 lastEat（进食时记账），所以「吃了但还没长出来」也会继续掉 ——
       这是故意的：它吃到的负数变成信贷，若一直没走完就等于没吃到。 */
    /* 严格大于：lastEat 记的就是「进食那一拍」。早先写成 >= 且重置时又 +1，
       两处边界混用，实测出现「每两次调用才掉一节」。两边配对后边界就干净了。 */
    if(S.steps-(r.lastEat||0)>DUEL.STARVE_EVERY){
      r.lastEat=S.steps;                        /* 重置计时，避免连掉 */
      r.starve=(r.starve||0)+1;
      if(r.body.length>DUEL.STARVE_DEATH){
        r.body.pop();                             /* 从尾巴缩一节 */
        S.events.push({type:'starve',x:r.body[0].x,y:r.body[0].y,
          text:'🍽 蚀蛇饿了，缩到 '+r.body.length+' 节',t:S.steps});
      }
      /* 待长信贷在饥饿时作废：饿着的时候没有「缓步长身」的余裕。
         不作废的话会出现「饿到2 节、然后一口气长回 10 节」的荒唐局面。 */
      r.grow=0;
      if(r.body.length<=DUEL.STARVE_DEATH){
        duelKillRival(r,'蚀蛇饿死了');
        return;
      }
    }
    if((r.choke||0)>=DUEL.TURN_WAIT){
      /* 拐弯空间被堵了足够久：它认命了（下一步就撞死或撞我） */
      if(!r.doomed){r.doomed=1;S.events.push({type:'doom',x:r.body[0].x,y:r.body[0].y,
        text:'☠ 蚀蛇被困死了',t:S.steps});}
    }
  }
}
/* 蚀蛇死亡：决斗模式里它只死一次，死了这局就结束（玩家赢）。
   注意 idempotent：判定是每步都跑的，没有这个 early-return 会重复计分。 */
function duelKillRival(r,reason){
  if(!r||!r.alive)return;
  r.alive=false;r.body.length=0;r.rush=false;
  S.duelWins++;
  S.win=true;S.over=true;
  S.alive=false;                 /* 玩家是「活到对方死」的那一方，标志位必须自洽 */
  S.reason=reason||'蚀蛇死了';
  S.events.push({type:'duelwin',x:headOf().x,y:headOf().y,text:'🏆 '+S.reason,t:S.steps});
}
/* 玩家失败 */
function duelLose(reason){
  if(S.over)return true;
  /* 开局无敌（DUEL.INVULN 秒，与蚀蛇共享计时）：这一下不算输 ——
     玩家只是被顶住不动，等转向。原来决斗的致死判定全部走 duelLose，
     它不认无敌开关，所以必须在**这里**统一拦一次，
     否则前 1.5 秒撞墙/撞蚀蛇照样秒输，开局无敌就成了摆设。 */
  if(S.invT>0){
    S.events.push({type:'inv',x:headOf().x,y:headOf().y,text:'🛡 起步无敌',t:S.steps});
    return false;
  }
  S.alive=false;S.over=true;S.reason=reason;
  S.events.push({type:'die',x:headOf().x,y:headOf().y,text:reason,t:S.steps});
  return true;
}
/* 蚀蛇走完之后的两条判定：撞我身体 → 它死；撞石头/咬到自己 → 也死。
   它自己撞死这件事由 AI 的保命项尽量避免，但玩家把它逼到无路可走时会真的发生。 */
function duelCheckRivalDeath(){
  const r=S.rivals[0];
  if(!r||!r.alive)return;
  const h=r.body[0];
  if(!h)return;
  /* 撞到玩家身体（头对头不算：那是下一拍玩家自己撞上来） */
  for(let i=0;i<S.body.length;i++){
    if(S.body[i].x===h.x&&S.body[i].y===h.y){
      if(i===0)continue;                       /* 和玩家的头重合：交给玩家那一步判负 */
      duelKillRival(r,'蚀蛇撞上了我的身体');
      return;
    }
  }
  /* 撞石头 */
  const c=S.cells[idx(h.x,h.y)];
  if(c&&c.k==='wall'){duelKillRival(r,'蚀蛇一头撞进巨石');return;}
  /* 咬到自己（尾巴会让位，所以跳掉最后一节） */
  const bite=tailSelfBite(r,h);
  if(bite){duelKillRival(r,'蚀蛇咬到了自己');return;}
  /* 它自己缩没了（吃了太多正数方块）*/
  if(r.body.length<=1)duelKillRival(r,'蚀蛇把自己缩没了');
}

/* ---------- 抢食模式：第 10 张图 ----------
   解锁：通关第 8 关 + 至少化龙 1 次（两个终局都打穿，钥匙才交出来）。
   它跟自由模式一样刻意不进 LEVELS 数组 —— 关卡菜单、解锁链、星级一概不认识它，
   所有新规则都挂在 `L.race` 分支下，前 8 关与自由模式的行为一点不动。
   六条规则各自独立，想删哪条就把对应的 on 置 false：
     腐坏 / 暴击 / 里程碑 / 抢食 / 养分技能 / 随机事件 */
const RACE={
  id:10,name:'抢食之战',type:'race',race:true,w:20,h:20,tick:116,blocks:9,vmin:2,vmax:5,
  walls:26,rival:1,powers:[],seed:10101,randWalls:true,
  on:{rot:true,gold:true,combo:true,feed:true,nut:true,event:true},
  /* 玩法 1 腐坏方块 */
  ROT_STEPS:95, ROT_GIVE:34,        /* 活 95 步 → 临期 34 步（期间吃＝双倍）→ 腐坏换新的 */
  /* 玩法 2 金色方块 */
  GOLD_P:0.15, GOLD_MULT:3,         /* 15% 概率带金，3 倍分、不长身 */
  /* 玩法 3 连击里程碑 */
  MILESTONES:[5,10,15,20],          /* 到达即回养分 + 清掉一块最近的石头 */
  /* 玩法 4 蚀蛇抢食 */
  FEED_MAX:7, RIVAL_MAX:10,         /* 吃到 7 块（或长过 10 节）就吐 1~2 块出来 */
  /* 玩法 5 养分 + 技能 */
  NUT_MAX:12, NUT_DECAY:16,         /* 每 16 步自然流失 1 点，逼着人持续进食 */
  RUN_COST:4, RUN_MS:1400,          /* 冲刺：加速 1.4 秒，期间可穿过自己 */
  BOOM_COST:6, BOOM_R:1,            /* 爆破：清掉头周围 3×3 的石头与负能 */
  CD_MS:9000,                       /* 技能公共冷却 */
  /* 玩法 6 场上事件 */
  EVENT_EVERY:42, EVENT_ORDER:['rain','shrink','rush','shrink'],
  RAIN_N:8,
};
/* 抢食模式的钥匙分两把：通关第 8 关 + 至少化龙 1 次。
   这里刻意不复用浏览器段的 `save` —— `let save` 在 <script> 顶层作用域里，
   逻辑段的函数（也就是后续 if(typeof window) 外面的那些）根本看不见它，
   真去读就会 ReferenceError 把整个浏览器段打断（openMenu 一调就炸）。
   所以逻辑层自己留一份解锁状态，浏览器段负责同步。 */
const PROG={cleared8:false,dragons:0,racePlays:0,duelWins:0};
function setProgress(cleared8,dragons,racePlays,duelWins){
  PROG.cleared8=!!cleared8;PROG.dragons=dragons||0;PROG.racePlays=racePlays||0;
  PROG.duelWins=duelWins||0;
}
/* 第 21 关「魔术蛇」的四把钥匙：第 8 关 + 化龙 + 抢食一局 + 斩蛇一次。
   比决斗再多一道 —— 它是目前机制最热闹的模式，不该比决斗还早见到。 */
function magicUnlocked(){return PROG.cleared8&&PROG.dragons>0&&PROG.racePlays>0&&PROG.duelWins>0;}
function magicLockText(){
  return (PROG.cleared8?'✅':'🔒')+' 第 8 关 · '+(PROG.dragons>0?'✅':'🔒')+' 化龙 · '+
    (PROG.racePlays>0?'✅':'🔒')+' 抢食一局 · '+(PROG.duelWins>0?'✅':'🔒')+' 斩蛇一次';
}
/* 第五个特殊模式「门与钥匙」目前只有占位卡，恒不解锁 */
function keyUnlocked(){return false;}
function raceUnlocked(){return PROG.cleared8&&PROG.dragons>0;}
function raceLockText(){
  return (PROG.cleared8?'✅':'🔒')+' 通关第 8 关 · '+(PROG.dragons>0?'✅':'🔒')+' 化龙 1 次';
}
function addNut(n){if(!S)return;S.nut=Math.max(0,Math.min(RACE.NUT_MAX,(S.nut||0)+n));}
function canSkill(kind){
  if(!S||!S.L.race)return false;
  const cost=kind==='run'?RACE.RUN_COST:RACE.BOOM_COST;
  if((S.nut||0)<cost)return false;
  return S.steps>=((S.cd&&S.cd[kind])||0);
}
/* 玩法 8：吃一个 v 方块 = 养 1 点养分，数值越大越划算 */
function nutGain(v){return Math.max(1,Math.round(v/3));}

/* ---------- 抢食模式：状态字段与全部规则 ----------
   规则实现集中在这里，`step()` / `stepRival()` 里只留几行调用点，
   这样「前 8 关 + 自由模式」的代码路径一个字都不改。 */
function initRaceState(S){
  S.nut=3;S.nutAcc=0;S.cd={run:0,boom:0};S.runUntil=0;S.boom=[];
  S.marks={};S.storm=0;S.evIdx=0;S.rushUntil=0;S.goldRush=false;
  S.raceEats=0;S.raceStolen=0;S.raceSpoiled=0;S.raceBirths=0;S.raceEvents=[];
}

/* 玩法 1：腐坏方块 —— 活 ROT_STEPS 步后进入临期（吃＝双倍，给「等一等」一个理由），
   再过 ROT_GIVE 步就腐坏，原地换成一块新的。 */
function rotBlocks(){
  const S0=S;
  for(let i=0;i<S0.cells.length;i++){
    const c=S0.cells[i];
    if(!c||c.k!=='block'||typeof c.born!=='number')continue;
    const e=S0.steps-c.born;
    if(e>RACE.ROT_STEPS+RACE.ROT_GIVE){
      S0.raceSpoiled++;
      pushEvent('rot',i%S0.w,(i/S0.w)|0,'🍂 腐坏了');
      S0.cells[i]=null;
    }else if(e>RACE.ROT_STEPS)c.rot=1;
  }
}
/* 玩法 2：金色方块 —— 3 倍分，但不长身体（「怕长大」的出口） */
/* ---------- 第 12 关「万象归元」：机制轮换 ----------
   前四关的东西全在，但**不是一次全上** —— 每隔 every 秒切换一种主导机制。
   这样玩家看得清"它现在在考什么"，也总有喘息的间隙；
   一次性全开只会变成噪音，而且开局就被三重机制压死。
   ⚠ 轮换只管**新机制**（星屑/流沙/毒雾/抢食）：负能、限时、蚀蛇是常驻的，不参与轮换。 */
function omniPhase(){
  const cfg=S.L.omni;if(!cfg)return null;
  const sec=(S.steps*(S.tickNow||S.L.tick))/1000;
  if(S.omniIdx==null||Math.floor(sec/cfg.every)!==S.omniAt){
    const i=Math.floor(sec/cfg.every)%cfg.phases.length;
    if(S.omniIdx!==i){
      S.omniIdx=i;
      S.events.push({type:'omni',x:0,y:0,t:S.steps,
        text:'🌪 机制切换：'+cfg.phases[i].name});
    }
    S.omniAt=Math.floor(sec/cfg.every);
  }
  return cfg.phases[S.omniIdx];
}
/* 这个机制在当前阶段开不开。非万象关恒开（按关卡自己的配置走）。 */
function omniOn(k){
  if(!S.L.omni)return true;
  const p=omniPhase();
  return !!(p&&p.on.indexOf(k)>=0);
}
/* 本关开不开稀有块。决斗模式恒开；主线关卡要显式标 rare:{...}（第 9 关起）。 */
function rareOn(){return !!(S.L.duel||S.L.rare)&&omniOn('rare');}
/* 场上同时最多几颗稀有块。主线关卡可以在 rare.max 里改（比如终局关给 2 颗）。 */
function rareMax(){return (S.L.rare&&S.L.rare.max)||RARE.MAX;}
function countRare(){
  let n=0;
  for(let i=0;i<S.cells.length;i++){const c=S.cells[i];if(c&&c.rarity)n++;}
  return n;
}
function makeBlock(x,y,v){
  const gold=!!(S.L.race&&RACE.on.gold&&(S.goldRush||S.rnd()<RACE.GOLD_P));
  /* 稀有方块：把数字直接换成 6/7/8 之一，并打 rarity 标记。
     ⚠ 稀有块的**数字就是它的价值**（6/7/8），不是给普通块加个花色 ——
       主公要的是「新数字」，抢到的是真金白银的 6~8 节。
     抢食模式的金色块与它互斥：RACE 只有 gold，不生成 rarity。
     ⚠ 掷骰走 S.rndB（独立流）而不是 S.rnd —— 共用一条流会让「稀有档位」
       和「方块落在地图哪一列」产生正相关，表现为 8 恒在下半、6 恒在上半。
     ⚠ 除了概率还要卡 countRare()<rareMax()：只降概率的话偶尔仍会堆出好几颗，
       而且「场上有且只有一颗星」才让争夺焦点明确（主公：数量还是太多）。 */
  let rarity=0;
  if(rareOn()&&v>=RARE.MIN&&!gold&&countRare()<rareMax()&&S.rndB()<RARE.P){
    rarity=RARE.NUMS[Math.min(RARE.NUMS.length-1,(S.rndB()*RARE.NUMS.length)|0)];
    v=rarity;
  }
  S.cells[idx(x,y)]={k:'block',v:v,gold:gold?1:0,rarity:rarity,born:S.steps,id:S.nextSpawnId++};
  return S.cells[idx(x,y)];
}
/* 玩法 3：连击里程碑 —— 到达 5/10/15/20 就回养分 + 清掉最近的一块石头 */
function comboMark(combo){
  if(!S.L.race||!RACE.on.combo)return;
  if(RACE.MILESTONES.indexOf(combo)<0)return;
  if(S.marks[combo])return;
  S.marks[combo]=1;
  addNut(2);
  const h=headOf();let best=null,bd=1e9;
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    const c=S.cells[idx(x,y)];
    if(c&&c.k==='wall'){const d=Math.abs(x-h.x)+Math.abs(y-h.y);if(d<bd){bd=d;best={x,y};}}
  }
  if(best){S.cells[idx(best.x,best.y)]=null;pushEvent('mark',best.x,best.y,'🧹 ×'+combo+' 清石');}
  else pushEvent('mark',h.x,h.y,'🔥 ×'+combo);
  S.events.push({type:'mark',x:h.x,y:h.y,text:'🎯 ×'+combo+' 连击达成',t:S.steps});
}
/* 玩法 5：养分自然流失 + 技能冷却推进（按步数结算，跟 tickNow 一致） */
function raceNutStep(){
  if(RACE.on.nut){
    if((S.nutAcc=(S.nutAcc||0)+1)>=RACE.NUT_DECAY){S.nutAcc=0;S.nut=Math.max(0,S.nut-1);}
  }
  if(S.cd)for(const k in S.cd)if(S.cd[k]<S.steps)S.cd[k]=S.steps;
}
/* 抢食模式每步的固定结算（要在 step 开头的提前返回之前跑，
   否则起步无敌期顶着石头那几步会把事件时钟一起冻住） */
function raceUpdate(){if(S.L.race){raceNutStep();raceClock();}}

/* ---------- 第 10 关「流沙方阵」：方块会漂移 ----------
   每隔 every 步，场上一部分方块随机挪一格 —— 你瞄准的那颗，等你游过去它可能已经不在那儿了。
   ⚠ 两个必须守住的点：
     ① **只挪一部分**（p 默认 0.5）。全场一起挪会让玩家完全无法规划，
        那不是"流沙"是"地震"，而且方块会自己挤成一堆。
     ② **本步已挪过的块不再挪第二次**：正序扫描时把方块挪到「还没扫到的格子」上，
        下一轮循环会把它当新方块再挪一次（一格变两格）。用 c.mv 打时间戳挡掉。 */
function driftStep(){
  const cfg=S.L.drift;if(!cfg)return;
  if(!omniOn('drift'))return;
  S.driftAcc=(S.driftAcc||0)+1;
  if(S.driftAcc<cfg.every)return;
  S.driftAcc=0;
  const p=cfg.p==null?0.5:cfg.p;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  let moved=0;
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    const i=idx(x,y),c=S.cells[i];
    if(!c||c.k!=='block')continue;          /* 只挪普通/稀有方块：负能与危险块固定，别让危险自己贴脸 */
    if(c.mv===S.steps)continue;             /* 本步刚挪过来的，不再挪 */
    if(S.rnd()>p)continue;
    const d=dirs[(S.rnd()*4)|0];
    const nx2=x+d[0],ny2=y+d[1];
    if(!inB(nx2,ny2))continue;
    if(S.cells[idx(nx2,ny2)])continue;      /* 目标格已有东西 */
    if(bodyHas(nx2,ny2))continue;           /* 不许挪到玩家身上（那是白送） */
    if(rivalHas&&rivalHas(nx2,ny2))continue;
    S.cells[idx(nx2,ny2)]=c;
    S.cells[i]=null;
    c.mv=S.steps;
    moved++;
  }
  if(moved)S.events.push({type:'drift',x:0,y:0,n:moved,t:S.steps,text:'🌀 流沙挪了 '+moved+' 块'});
}
/* ---------- 第 11 关「毒雾收束」：边界往里收 ----------
   每隔 every 步，最外一圈变成毒区（撞上去扣 dmg 节）。地图只会越来越小，
   躲得了一时躲不了一世 —— 逼玩家在收束前把外圈扫干净。
   ⚠ 毒区用独立的 fogMap 记录「第几圈已被吞」，不直接往 cells 里塞 wall：
     ① 渲染要能区分（毒雾是紫雾，不是石头）；
     ② 撞上去是**扣节数**而不是直接死（wall 是直接死），两者规则不同。 */
function shrinkStep(){
  const cfg=S.L.shrink;if(!cfg)return;
  if(!omniOn('shrink'))return;
  S.shrinkAcc=(S.shrinkAcc||0)+1;
  if(S.shrinkAcc<cfg.every)return;
  S.shrinkAcc=0;
  const r=S.fogRing||0;
  /* 收不动了就停：地图总不能被吃到只剩一格 */
  const cap=Math.max(2,Math.floor(Math.min(S.w,S.h)/6));
  if(r>=cap)return;
  const nr=r+1;
  /* 被吞掉的这一圈里的方块一并清掉 —— 不然它们躺在毒雾里，玩家去拿就是白送节数，
     实际上等于这批资源凭空消失，目标分就凑不齐了（spawnBlock 会在安全区补新的）。 */
  let eaten=0;
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    if(x<nr||y<nr||x>=S.w-nr||y>=S.h-nr){
      const c=S.cells[idx(x,y)];
      if(c&&c.k!=='wall'){S.cells[idx(x,y)]=null;eaten++;}
    }
  }
  S.fogRing=nr;
  S.events.push({type:'fog',x:0,y:0,ring:nr,t:S.steps,
    text:'🌫 毒雾收拢第 '+nr+' 圈'+(eaten?'（吞掉 '+eaten+' 块）':'')});
}
/* 这一格是不是**毒雾**。收束只吞最外的 N 圈。 */
function isFog(x,y){
  const r=S.fogRing||0;if(!r)return false;
  return x<r||y<r||x>=S.w-r||y>=S.h-r;
}
/* ---------- 第 13 关「落石阵」：tetromino 石块从天而降 ----------
   ⚠ 三条定死的规则，全是为了避开死局和无妄之灾：
   ① **不堆积**：石块落到最底行就碎掉消失。真俄罗斯方块那套「堆起来再消行」在这里是灾难 ——
      地形垒满就没路走，而消行那一下地形剧变，蛇可能正落在里面，等于凭空判死。
   ② **砸不死人**：石块下落时若下方是墙 / 蛇身 / 蚀蛇 / 另一块石头，它就**悬停**在那儿，
      等障碍让开再继续落。从天而降砸死玩家既不可预判也不公平 —— 这是「躲避」玩法的底线。
      但玩家**主动撞进**石块照样死：威胁必须来自自己走错，不是天上掉馅饼。
   ③ **悬停有寿命**：压在障碍上超过 FALL.HOVER 步就碎裂消失，否则会越积越多把地图堵死。
   ⚠ 石块只被「硬东西」挡（墙 / 蛇 / 蚀蛇 / 别的石块），**可吃的方块不挡它** ——
     否则石块会被地上的方块托住悬停，画面上还把那块方块盖住，玩家看不见自己要吃的东西。 */
const TETRO=[
  [[0,0],[1,0],[2,0],[3,0]],        /* I */
  [[0,0],[1,0],[0,1],[1,1]],        /* O */
  [[0,0],[1,0],[2,0],[1,1]],        /* T */
  [[0,0],[1,0],[1,1],[2,1]],        /* S */
  [[1,0],[2,0],[0,1],[1,1]],        /* Z */
  [[0,0],[0,1],[1,1],[2,1]],        /* J */
  [[2,0],[0,1],[1,1],[2,1]],        /* L */
];
const FALL={HOVER:26};
/* 落石的配色刻意与静态石头（冷灰蓝）拉开 —— 熔岩橙红，一眼分得出「这块会动」 */
const ROCK_COL=[226,110,58];
/* 石块占不占这一格。⚠ 只算 y>=0 的部分 —— 刚生成时石块整块都在地图上方（y<0），
   那时它不可见也不可撞，等落进地图才生效。 */
function rockHas(rk,x,y){
  if(y<0)return false;
  for(const s of rk.sh)if(rk.x+s[0]===x&&rk.y+s[1]===y)return true;
  return false;
}
function rockAt(x,y){
  for(const rk of S.rocks)if(rockHas(rk,x,y))return rk;
  return null;
}
/* 试落一格：'ok' 能落 / 'blocked' 被挡（悬停）/ 'bottom' 触底（消失） */
function rockTry(rk){
  let bottom=false;
  for(const s of rk.sh){
    const nx=rk.x+s[0],ny=rk.y+s[1]+1;
    if(ny>=S.h){bottom=true;continue;}
    if(ny<0)continue;                     /* 还在地图上方，随便落 */
    if(!inB(nx,ny))return 'blocked';
    const c=S.cells[idx(nx,ny)];
    if(c&&c.k==='wall')return 'blocked';  /* 只有硬东西挡路，可吃的方块不挡 */
    if(bodyHas(nx,ny))return 'blocked';
    if(rivalHas&&rivalHas(nx,ny))return 'blocked';
    for(const o of S.rocks)if(o!==rk&&rockHas(o,nx,ny))return 'blocked';
  }
  return bottom?'bottom':'ok';
}
function spawnRock(){
  const sh=TETRO[(S.rndB()*TETRO.length)|0];
  let mw=0,mh=0;
  for(const s of sh){if(s[0]>mw)mw=s[0];if(s[1]>mh)mh=s[1];}
  const x=(S.rndB()*Math.max(1,S.w-mw))|0;
  S.rocks.push({x:x,y:-(mh+1),sh:sh,hover:0});
}
function fallStep(){
  const cfg=S.L.fall;if(!cfg)return;
  S.fallAcc=(S.fallAcc||0)+1;
  if(S.fallAcc%cfg.every===0){
    for(let i=S.rocks.length-1;i>=0;i--){
      const rk=S.rocks[i],t=rockTry(rk);
      if(t==='ok'){rk.y++;rk.hover=0;continue;}
      if(t==='bottom'){S.rocks.splice(i,1);continue;}   /* 落到底，碎掉消失 */
      rk.hover++;
      if(rk.hover>=FALL.HOVER){
        S.rocks.splice(i,1);
        S.events.push({type:'rockbreak',x:rk.x,y:Math.max(0,rk.y),t:S.steps,text:'💥 落石碎裂'});
      }
    }
  }
  if(S.fallAcc%cfg.spawn===0)spawnRock();
}

/* ---------- 第 14 关「暗夜迷雾」：只看得见蛇头周围那一圈 ----------
   ⚠ 第一版做的是「走过的地方永久记住」（探索开图），主公实测后指出**视野全开了** ——
     因为走遍地图后 seen 会被点满，雾等于不存在，这个机制就废了。
     现在改成**瞬时视野**：只看得到蛇头周围 R 格，走开就重新没入黑暗。
     这才是「暗夜」该有的样子：永远只能看着脚下一步，靠预判而不是靠地图。
   ⚠ 两个边界仍然定死：
   ① **蚀蛇永远可见**。威胁藏在雾里等于凭空判死，不公平 ——
      雾遮的是**资源**（方块 / 石头 / 道具），不是危险。
   ② **吃星屑临时开全图**。总得给一个主动解法，否则面对未知区域玩家只能瞎撞。 */
const FOG={REVEAL_STEPS:42};         /* 开图持续多久：约 5 秒（tick 118ms × 42） */
function fogOn(){return !!S.L.fog;}
/* 是否正处于「星屑开图」中：全图可见 */
function revealed(){return (S.revealUntil||0)>S.steps;}
/* 这一格现在看不看得见。⚠ 实时按「离蛇头多远」算，不查任何记忆表 ——
   一旦落盘成数组就会变成「走遍即全开」，那正是第一版被主公退回来的原因。 */
function seenAt(x,y){
  if(!fogOn()||revealed())return true;
  const h=headOf();if(!h)return false;
  const r=(S.L.fog&&S.L.fog.r)||5;
  const dx=x-h.x,dy=y-h.y;
  return dx*dx+dy*dy<=r*r;
}

/* ---------- 第 15 关「噬魂魔蛇」：负数块 → 蚀蛇 → 你 ----------
   ⚠ 这关的骨架是一条**食物链**，三方的成长路径第一次串起来：
     蚀蛇吃负数块长大 → 你吃蚀蛇长大。场上**一块正经方块都没有**（blocks:0），
     所以玩家唯一的成长途径就是猎杀蚀蛇 —— 这是主公定的规则。
   ⚠ 蚀蛇是**猎物，不是猎手**（主公 2026-10-11 定：「见我们应该逃跑，其余时间抓紧吃分」）：
     · 玩家在 SOUL.FLEE 格以内 → **掉头逃**（逃跑权重压过觅食）
     · 其余时间 → 朝最近的负数块去，埋头吃分养肥自己
     第一版给它做了「养到 12 节就转猎食态追杀玩家」的两态设计，主公退回来了 ——
     那样它一半时间在当猎手，玩家就不是捕食者了。现在它永远不主动咬人。
   ⚠ **撞头仍然是死**：正面不能吃，只能绕侧后方下口。否则贴脸对撞就能白吃，这关就没难度。
     这是「你是捕食者」这件事唯一该付的代价。 */
/* SCORE=每吃它一节得多少分。⚠ 定这个数之前先修好了「吃负数不变长」——
   修之前蚀蛇永远 3 节，吃它一次只值 120 分；修好之后它能养到十几节，一次就值几百，
   整关天花板从 4800 涨到 11680。所以分数跟着压了一档（40→25），
   让这关的分数量级和前面几关别差太远（前四关是 3~4 千，原来这里会跳到 7 千多）。 */
const SOUL={FLEE:6,SCORE:25};
function soulOn(){return !!S.L.soul;}
/* 离某个坐标最近的可吃方块 —— 觅食态的蚀蛇朝它去 */
function nearestFoodFrom(p){
  let bd=1e9,bx=-1,by=-1;
  for(let j=0;j<S.cells.length;j++){
    const c=S.cells[j];if(!c||!isFood(c))continue;
    const x=j%S.w,y=(j/S.w)|0;
    const d=Math.abs(x-p.x)+Math.abs(y-p.y);
    if(d<bd){bd=d;bx=x;by=y;}
  }
  return bd<1e9?{x:bx,y:by,d:bd}:null;
}
/* 玩家吞噬一条蚀蛇：长它长度之半，它退场（RIVAL_RESPAWN 秒后重生为幼体，回到觅食态） */
function devourRival(r){
  const len=r.body.length;
  const gainLen=Math.max(1,Math.floor(len/2));
  S.grow+=gainLen;S.pending=(S.pending||0)+gainLen;    /* 走**生长信贷**，与吃方块同一套模型 */
  const gainScore=len*SOUL.SCORE;
  S.score+=gainScore;S.combo++;
  if(S.combo>S.bestCombo)S.bestCombo=S.combo;
  const h=r.body[0]||headOf();
  S.events.push({type:'devour',x:h.x,y:h.y,v:len,gain:gainScore,t:S.steps,
    text:'👻 吞噬'+RIVAL.name+' +'+gainLen+' 节'});
  killRival(r,0);
}

/* ---------- 第 16 关「作减求空」：把自己缩到一节不剩 ----------
   ⚠ 这关做了**两次反转**，却几乎没加新代码 —— 这是全部 16 关里性价比最高的设计：
     · **目标反转**：前 15 关一律「越长越好」，这里「越短越好」，归零即胜。
     · **语义反转**：负能方块从「惩罚」变成「资源」—— 玩家第一次主动去找它撞；
       普通方块反过来是「倒退」。同一个元素、同一套 shrink/grow，只翻转规则意义。
   ⚠⚠ **胜利与死亡共用「长度不够」这一刻**，判定顺序是全案最容易写反的地方：
       必须先判胜利、后判死（见 shrink 致死分支），放到 step 末尾就永远赢不了。
   ⚠ 身体清空后 headOf() 返回 undefined，所以胜利那一拍**必须立刻结束** ——
     step 里每个 shrink 调用点都补了 `if(S.win)return 'win'`。
     浏览器段没有直接使用 headOf()（已核对），渲染只遍历 S.body，空数组安全。 */
const VOID={SCORE:120};              /* 每缩短 1 节得多少分：这关的「分」衡量的是**减掉了多少** */
function voidOn(){return !!S.L.void;}
function voidWin(){
  S.body.length=0;                   /* 一节不剩 —— 这就是「空」 */
  S.win=true;S.over=true;S.alive=true;
  S.events.push({type:'voidwin',x:0,y:0,t:S.steps,text:'🕳 作减求空 —— 归零'});
}
/* 开局摆一条长蛇。⚠ 必须**折线**铺：地图才 26 宽，一条直线放不下 24 节。
   ⚠ 铺完要把蛇身压着的石头清掉 —— 墙是随机生成的，长在蛇身上等于开局自杀。 */
function voidBody(need,sx,sy){
  const b=[{x:sx,y:sy}];
  let cx=sx,cy=sy,guard=0;
  const put=()=>{if(inB(cx,cy)&&!b.some(p=>p.x===cx&&p.y===cy))b.push({x:cx,y:cy});};
  while(b.length<need&&cx>2&&guard++<400){cx--;put();}
  while(b.length<need&&cy>2&&guard++<400){cy--;put();}
  while(b.length<need&&cx<S.w-3&&guard++<400){cx++;put();}
  while(b.length<need&&cy<S.h-3&&guard++<400){cy++;put();}
  S.body=b;
  for(const p of S.body){p.px=p.x;p.py=p.y;}
  for(const p of S.body){const i=idx(p.x,p.y);if(S.cells[i]&&S.cells[i].k==='wall')S.cells[i]=null;}
}

/* ---------- 第 17 关「天坠」：数字从天上掉，重力把蛇往下拽 ----------
   ⚠⚠ 「每秒下移一格」**不能**用「把方向覆盖成 down」实现：
   玩家正在往上走时，那一拍强制反向 → 蛇头会撞进自己的第 2 节 → 直接判死。
   所以必须是**整条蛇整体平移**：每节 y+1，相对形状不变，不会自咬也不会穿模。
   ⚠ 主公定的四条规则：
   ① 数字从顶部落下、**落到底不堆积**，在**下一次重力触发时**直接消失；
   ② 重力把蛇拽进石头/腐地/蚀蛇，**直接判死**；蛇头出界同样是死，
      但**身体出界只截断尾巴**（扣一点点分）—— 理由见 gravStep 里主公退回的那条；
   ③ 平移时压到数字**不算吃到**，漏过去 —— 直到蛇自己走到那一格（所以这里绝不调用吃逻辑）；
   ④ 下落速度比重力快（rain.every=5 vs grav.every=6），否则数字还没落地就被清掉、玩家永远吃不到。 */
/* 尾巴被重力拽断时，每节扣多少分。
   ⚠ 这个数调过两轮：20 分/节时**断尾等于免费**（bot 一局断 55 次、照样拿 15881 分）；
   80 分/节又太重（中位暴跌到 3238，断一截尾巴就把一局打废）。
   40 分/节 ≈ 一块中等方块，断尾是真的疼，但还不至于一次就毁掉一局。
   ⚠ 光调这个数治不了本 —— 真正的病是**这关没有时限**：断尾保命之后 bot 能无限刷分。
   所以同时给关卡加了 time 限制（见「天坠」的关卡配置）。 */
const GRAV={CUT_PENALTY:40};
function gravOn(){return !!S.L.grav;}
function gravStep(){
  const cfg=S.L.grav;if(!cfg)return;
  S.gravAcc=(S.gravAcc||0)+1;
  if(S.gravAcc<cfg.every)return;
  S.gravAcc=0;
  /* ① 先清掉「落到底等死」的那批（主公：下一次重力频率时直接消失） */
  let cleaned=0;
  for(let i=0;i<S.cells.length;i++){
    const c=S.cells[i];
    if(c&&c.fallen){S.cells[i]=null;cleaned++;}
  }
  /* ② 逐节往下走。⚠⚠ 主公实测退回的一条（长蛇被「甩出去」）：
     原先**身体任何一节**出界就整条判死 —— 蛇越长、铺得越开，越容易因为
     「尾巴拖在界外」而白死，这关对长蛇的惩罚重到没道理。
     现在：**蛇头出界才真死；身体出界只截断尾部**，扣一点点分（GRAV.CUT_PENALTY/节）。
     张力保住了（到底部仍然要命），但不再因为「长」被无理由地处死。 */
  const nb=[];
  let cut=0;
  for(let i=0;i<S.body.length;i++){
    const p=S.body[i],ny=p.y+1;
    if(!inB(p.x,ny)){
      if(i===0){die('重力把蛇拽出了地图');return;}
      cut=S.body.length-i;break;               /* 保留头部连续段，尾巴不要了 */
    }
    const c=S.cells[idx(p.x,ny)];
    if(c&&c.k==='wall'){die('重力把蛇拽进了石头');return;}
    if(c&&c.k==='rot'){die('重力把蛇拽进了腐败之地');return;}
    if(rivalHas&&rivalHas(p.x,ny)){die('重力把蛇拽进了'+RIVAL.name);return;}
    nb.push({x:p.x,y:ny,px:p.x,py:p.y});
  }
  /* ③ 截断的代价：扣一点点分 + 冲掉对应节数的生长信贷
     （否则截了也白截，待长几拍就补回来了）—— 主公：「扣一点点分」。 */
  if(cut>0){
    S.score=Math.max(0,S.score-cut*GRAV.CUT_PENALTY);
    S.combo=0;
    S.grow=Math.max(0,(S.grow||0)-cut);
    S.pending=Math.max(0,(S.pending||0)-cut);
    const t0=nb[0];
    S.events.push({type:'gravcut',x:t0?t0.x:0,y:t0?t0.y:0,v:cut,t:S.steps,
      text:'✂️ 重力拽断了 '+cut+' 节尾巴（-'+cut*GRAV.CUT_PENALTY+' 分）'});
  }
  S.body=nb;
  S.events.push({type:'grav',x:S.body[0].x,y:S.body[0].y,t:S.steps,
    text:'⬇ 重力'+(cleaned?'（清掉 '+cleaned+' 块）':'')});
}
/* 数字雨：每 rain.every 拍下落一格，每 rain.spawn 拍在顶行生成一个。
   ⚠ 遍历必须从下往上（y 递减）—— 从上往下会让同一拍里的一个方块连掉好几格。 */
function rainStep(){
  const cfg=S.L.rain;if(!cfg)return;
  S.rainAcc=(S.rainAcc||0)+1;
  if(S.rainAcc%cfg.every===0){
    for(let y=S.h-2;y>=0;y--)for(let x=0;x<S.w;x++){
      const i=idx(x,y),c=S.cells[i];
      if(!c||!c.fall)continue;
      if(S.cells[idx(x,y+1)])continue;        /* 下面有东西就停住（食物会短暂堆叠） */
      S.cells[idx(x,y+1)]=c;S.cells[i]=null;
      if(y+1>=S.h-1)c.fallen=1;               /* 落到底：等下一次重力来收 */
    }
  }
  if(S.rainAcc%cfg.spawn===0){
    const x=(S.rnd()*S.w)|0;
    if(!S.cells[idx(x,0)]){
      const v=S.L.vmin+((S.rnd()*(S.L.vmax-S.L.vmin+1))|0);
      S.cells[idx(x,0)]={k:'block',v:v,fall:1,id:S.nextSpawnId++};
    }
  }
}

/* ---------- 第 18 关「腐径」：走过的路会烂掉 ----------
   蛇身第一次经过一个格子 after 拍后，那里变成腐地，撞上去扣 rot.v 节。
   ⚠⚠ trail 表**只记第一次经过，之后绝不刷新**（主公实测的 bug）：
     早先是无条件覆盖时间戳，于是「蛇离开 → 腐化倒计时开始 → 蛇又绕回这个格子 →
     时间戳被刷成当前步」—— 玩家只要在一小片区域里反复绕圈，就能让整条路永久保鲜，
     这关直接失效。**能被玩家无限刷新的机制等于没有机制**，
     跟第 14 关迷雾「走遍全图后雾全失效」是同一类病。
   ⚠ trail 表**不进存档**（跟 craterMap/trailMap 一个待遇）—— 读档后痕迹消失是接受的取舍。
   ⚠ 只腐**空格子**：上面有方块/石头的不腐。否则等于把资源变成陷阱，
      玩家连「回去吃刚才没吃的那块」都做不到，那不是什么巧妙设计，是折磨。 */
function rotOn(){return !!S.L.rot;}
function rotStep(){
  const cfg=S.L.rot;if(!cfg)return;
  if(!S.trail)S.trail=new Uint32Array(S.w*S.h);
  for(const p of S.body){
    const i=idx(p.x,p.y);
    if(!S.trail[i])S.trail[i]=S.steps;      /* 只记第一次，不刷新 —— 见上方注释 */
  }
  const after=cfg.after||30;              /* 单位是**拍**：tick 114ms 时 34 拍 ≈ 3.9 秒 */
  for(let i=0;i<S.trail.length;i++){
    const t=S.trail[i];
    if(!t||S.steps-t<=after)continue;
    if(S.cells[i])continue;
    const x=i%S.w,y=(i/S.w)|0;
    if(bodyHas(x,y))continue;
    S.trail[i]=0;                         /* 腐过了就清零，别反复触发 */
    S.cells[i]={k:'rot',v:cfg.v||2};
  }
}

/* ---------- 第 19 关「九曲回廊」：成对传送门 ---------- */
function portalOn(){return !!S.L.portal;}
function portalAt(x,y){for(const p of S.portals)if(p.x===x&&p.y===y)return p;return null;}
function portalOther(p){for(const q of S.portals)if(q!==p&&q.pair===p.pair)return q;return null;}
/* 开局生成：挑 2×pairs 个空位，两两配对。
   ⚠ 两扇门必须**离得够远**（默认 8 格）—— 挨在一起的话穿过去跟没穿一样，
     这关就名不副实了。位置不够就少生成几对，绝不硬塞。 */
function seedPortals(){
  const cfg=S.L.portal;if(!cfg)return;
  const n=(cfg.pairs||2)*2,minD=cfg.minDist||8;
  const spots=[];
  let guard=0;
  while(spots.length<n&&guard++<900){
    const x=2+((S.rnd()*(S.w-4))|0),y=2+((S.rnd()*(S.h-4))|0);
    if(S.cells[idx(x,y)])continue;
    if(bodyHas(x,y)||(rivalHas&&rivalHas(x,y)))continue;
    let far=true;
    for(const p of spots)if(Math.abs(p.x-x)+Math.abs(p.y-y)<minD){far=false;break;}
    if(!far)continue;
    spots.push({x:x,y:y});
  }
  S.portals=[];
  for(let i=0;i+1<spots.length;i+=2){
    S.portals.push({x:spots[i].x,y:spots[i].y,pair:i/2});
    S.portals.push({x:spots[i+1].x,y:spots[i+1].y,pair:i/2});
  }
}
/* 踩上传送门：瞬移到配对方，**方向保持** */
function portalJump(pt){
  const o=portalOther(pt);if(!o)return null;
  S.events.push({type:'portal',x:o.x,y:o.y,t:S.steps,text:'🌀 传送'});
  return o;
}
/* 三对传送门的配色：[环色, 核色] —— 一眼能看出哪两个是一对 */
const PORTAL_COL=[['#7cf7c4','#0e7a5c'],['#ffd166','#c98a12'],['#ff9ecf','#c03a7a']];

/* ---------- 第 20 关「镜花水月」：镜像回放 ----------
   延迟 mirror.delay 拍回放你自己的走位，变成一条会动的幽灵蛇，撞上即死。
   ⚠ 它**不需要 AI** —— 走的就是你刚才走过的路，从历史队列里按延迟取坐标即可。
     这也是它和蚀蛇的本质区别：蚀蛇是「另一个会思考的对手」，镜像是「你自己的过去」。
   ⚠ 主公讨论定下的两条：
   ① **撞上即死** —— 威胁等级必须比腐径（扣节）高，两关才有区分度；
   ② **镜像会咬自己** —— 你绕圈，它追自己的尾巴就会碎裂。
      所以这关和腐径对「绕圈」的要求完全相反：腐径惩罚绕圈，镜像**奖励**绕圈。
   ⚠ 镜像咬到自己的判定就是「身体里出现重复坐标」—— 历史路径绕了圈，
      同一格会被走两次，取出来的身体自然就有重合。 */
function mirrorOn(){return !!S.L.mirror;}
/* 位置历史：每步记一个蛇头坐标（身体由历史推导，不用逐节存）。 */
function histPush(){
  if(!S.hist)S.hist=[];
  const h=headOf();if(!h)return;
  /* ⚠⚠ 蛇**没动**的那一步不要记（起步无敌 / 鳞甲挡下 / 撞墙被顶住）：
     同一个坐标连记两次，镜像身体里就会出现重复坐标，被自咬判定误判成
     「它咬到了自己」而凭空碎裂（我第一版就是这么误触发的）。 */
  const last=S.hist[S.hist.length-1];
  if(last&&last.x===h.x&&last.y===h.y)return;
  S.hist.push({x:h.x,y:h.y});
  const cfg=S.L.mirror||{};
  const keep=(cfg.delay||25)+(cfg.len||10)+8;
  if(S.hist.length>keep)S.hist.splice(0,S.hist.length-keep);
}
/* 每步重算镜像身体（从头到尾）。⚠ 结果缓存到 S.mirrorBody ——
   渲染、碰撞、bot 全都要读，每处都遍历一遍历史太浪费。 */
function mirrorBody(){
  const cfg=S.L.mirror;if(!cfg||!S.hist)return [];
  const d=cfg.delay||25,n=cfg.len||10;
  if(S.hist.length<=d)return [];              /* 历史还不够长：镜像还没出生 */
  const out=[];
  for(let i=0;i<n;i++){
    const p=S.hist[S.hist.length-1-d-i];
    if(!p)break;
    out.push({x:p.x,y:p.y});
  }
  return out;
}
function mirrorHas(x,y){
  for(const p of S.mirrorBody)if(p.x===x&&p.y===y)return true;
  return false;
}
/* 推进镜像：重算身体 + 判自咬。自咬就碎裂（清历史 + 冷却），一段时间后从当前历史重新长出来。 */
function mirrorStep(){
  if(!mirrorOn())return;
  S.mirrorBody=mirrorBody();
  if(S.mirrorDead>0){S.mirrorDead--;return;}
  if(!S.mirrorBody.length)return;
  const seen=new Set();
  for(const p of S.mirrorBody){
    const k=p.y*S.w+p.x;
    if(seen.has(k)){                          /* 身体里出现重复坐标 = 它咬到了自己 */
      S.hist.length=0;S.mirrorBody=[];
      S.mirrorDead=(S.L.mirror&&S.L.mirror.cool)||30;
      S.events.push({type:'mirrorbreak',x:p.x,y:p.y,t:S.steps,text:'💠 镜像碎裂'});
      return;
    }
    seen.add(k);
  }
}

/* 事件 6：随机场上事件（方块雨 / 缩圈 / 金色狂潮） */
function fireRaceEvent(){
  if(!S.L.race||!RACE.on.event)return null;
  const kind=RACE.EVENT_ORDER[S.evIdx%RACE.EVENT_ORDER.length];
  S.evIdx++;
  if(kind==='rain'){
    let n=0;
    for(let i=0;i<RACE.RAIN_N;i++){
      const p=pickSpot(2);if(!p)break;
      const L=S.L;makeBlock(p.x,p.y,L.vmin+((S.rnd()*(L.vmax-L.vmin+1))|0));n++;
    }
    pushEvent('rain',headOf().x,headOf().y,'🌧 方块雨 +'+n);
    S.events.push({type:'rain',x:headOf().x,y:headOf().y,text:'🌧 方块雨 +'+n,t:S.steps});
  }else if(kind==='shrink'){
    /* 从四边往里垒一圈石头，开局那几圈会被跳过，所以是「慢慢缩」而不是「一下围死」 */
    let n=0;const d=S.storm;
    const x0=Math.min(d,S.w-1),x1=Math.max(0,S.w-1-d),y0=Math.min(d,S.h-1),y1=Math.max(0,S.h-1-d);
    const put=(x,y)=>{
      if(!inB(x,y)||S.cells[idx(x,y)])return 0;
      if(bodyHas(x,y)||rivalHas(x,y))return 0;
      S.cells[idx(x,y)]={k:'wall'};return 1;
    };
    if(x0<=x1&&y0<=y1){
      for(let x=x0;x<=x1;x++){n+=put(x,y0);if(y1!==y0)n+=put(x,y1);}
      for(let y=y0+1;y<=y1-1;y++){n+=put(x0,y);if(x1!==x0)n+=put(x1,y);}
    }
    S.storm++;
    pushEvent('shrink',headOf().x,headOf().y,n?'🪨 空间收缩':'🪨 收缩（本圈无处可放）');
    S.events.push({type:'shrink',x:headOf().x,y:headOf().y,text:n?'🪨 空间收缩':'🪨 收缩',t:S.steps});
  }else if(kind==='rush'){
    /* 金色狂潮：接下来 160 步里刷出来的方块全是金色（3 倍分、不长身） */
    S.goldRush=true;S.rushUntil=S.steps+160;
    pushEvent('rush',headOf().x,headOf().y,'✨ 金色狂潮');
    S.events.push({type:'rush',x:headOf().x,y:headOf().y,text:'✨ 金色狂潮 160 步',t:S.steps});
  }
  S.raceEvents.push({kind:kind,at:S.steps});
  return kind;
}
/* 事件推进：金色狂潮到点关掉，到点触发下一个事件 */
function raceClock(){
  if(!S.L.race)return;
  if(S.goldRush&&S.steps>=S.rushUntil)S.goldRush=false;
  if(RACE.on.event&&S.steps>=RACE.EVENT_EVERY*(S.evIdx+1))fireRaceEvent();
}
/* 蚀蛇抢食 —— 它现在优先去吃场上的方块，吃掉的方块玩家就拿不到了。
   换句话说：躲它不再是最优解，抢在它前面吃才是。
   ⚠ FEED.* 是**主线关**（第 9 关「星屑之争」起标 feed:true）用的上限；
     抢食模式仍走调好的 RACE.RIVAL_MAX / RACE.FEED_MAX，两套各管各的。 */
const FEED={RIVAL_MAX:10,FEED_MAX:4};
function rivalFeed(r){
  const h=r.body[0];if(!inB(h.x,h.y))return false;
  const c=S.cells[idx(h.x,h.y)];
  if(!isFood(c))return false;                 /* 正数方块和负数方块都算食物 */
  S.cells[idx(h.x,h.y)]=null;
  /* 负数块对蚀蛇**一律是粮**，不分模式 —— 第 15 关「噬魂魔蛇」的场上全是负数，
     它只能靠吃这个长大（主公 2026-10-11：「蚀蛇吃的是负分」）；
     决斗模式里负数也同样是它的粮（那边只是还有正数作为毒）。
     走**增长信贷**，与玩家同一套模型（直接往尾巴 push 会让它原地凭空暴涨一截，
     既不自然，也会把身体撑进自己的死路）：
       吃下 −N → 记 N 点待长；之后每走一步 → 免剪尾并扣 1 点，直到还剩 1 点。 */
  if(c.neg){
    r.grow=(r.grow||0)+c.v;
    r.lastEat=S.steps;              /* 饥饿判定用严格大于这个记账点，两边配对 */
    r.starve=0;
    S.events.push({type:'eatneg',x:h.x,y:h.y,v:c.v,t:S.steps,
      text:'🟥 '+foeName(r)+'吞下 -'+c.v+'（待长 '+c.v+'）'});
    return true;
  }
  /* ⚠⚠ 2026-10-14 主公改规则：**魔术蛇模式的方块全部中立** —— 蛇吃到正数也长 N 节，
     不再是「正数对它来说是毒」。原来的对偶规则（正数玩家+N / 蚀蛇−N）会让蛇躲着正数走，
     永远长不大、不会分裂（主公实测「本体不主动去吃分」的根因就在这里）。
     所以魔术蛇模式在 neg 分支之后**直接走中立的稀有块分支**，不再进 duel 的对偶分支。 */
  if(magicOn()){
    /* 中立块：走增长信贷，与玩家同构（不能往尾巴上直接 push —— 会凭空暴涨一截）。 */
    r.grow=(r.grow||0)+c.v;
    r.lastEat=S.steps;
    r.starve=0;
    S.events.push({type:'eatpos',x:h.x,y:h.y,v:c.v,gain:c.v,rare:true,t:S.steps,
      text:'🐍 '+foeName(r)+'抢到 '+c.v+' 方块，长 '+c.v+' 节'});
    return true;
  }
  /* 决斗模式：共享方块的对偶 —— 正数它缩短（稀有块 6/7/8 是例外，见下）。 */
  if(S.L.duel){
    if(c.rarity){
      /* ★ 稀有块是**中立资源**：它吃到也涨（主公定，2026-10-10）。
         走**增长信贷**，与玩家同一套模型（不能往尾巴上直接 push ——
         那会让它原地凭空暴涨一截，既不自然也会把身体撑进自己的雷区）。
         普通正数对它是毒的规则不变（下面那个分支），只有 6/7/8 是例外。 */
      r.grow=(r.grow||0)+c.v;
      r.lastEat=S.steps;
      r.starve=0;
      S.events.push({type:'eatpos',x:h.x,y:h.y,v:c.v,gain:c.v,rare:true,t:S.steps,
        text:'⚡ 蚀蛇抢到稀有 '+c.v+'，长 '+c.v+' 节'});
    }else{
      /* 吃普通正数对它是毒：缩身。`Math.min(v,len-1)` 保证不会缩到 0。 */
      const lose=Math.min(c.v,r.body.length-1);
      for(let i=0;i<lose;i++)r.body.pop();
      S.events.push({type:'eatpos',x:h.x,y:h.y,v:c.v,lose:lose,rare:false,t:S.steps,
        text:'🟩 蚀蛇吃了 '+c.v+' 方块，缩 '+lose+' 节'});
    }
    /* 缩到死亡线就判死。⚠ 阈值用 STARVE_DEATH 而非 1：
       饥饿规则（饿到 STARVE_DEATH 节即死）已经把这两种死因统一了，
       文案也要跟着说「饥饿」而不是「缩没了」—— 否则玩家看到的死因与规则对不上。 */
    /* ⚠ 分支要跟实际阈值对上：`lose` 上限是 len-1，所以**吃到正数最多缩到 1 节**，
       永远碰不到 STARVE_DEATH（2）。而饥饿掉节走的是另一条路（duelClock），才可能落到 2 节。
       早先这里写成「缩到 STARVE_DEATH 即判死」，等于给一条走不到的路径配了文案 ——
       结果它永远显示「缩没了」，把真正的饿死死因（duelClock 里那条）掩盖掉了。
       两处死因各归各的：这里只管「吃到毒方块缩没了」。 */
    if(r.body.length<=1)duelKillRival(r,'蚀蛇把自己缩没了');
    return true;
  }
  if(S.L.race)S.raceStolen++;      /* 抢食统计只在抢食模式记 —— 主线关没有这个口径 */
  r.fed=(r.fed||0)+1;
  r.body.push({x:h.x,y:h.y,px:h.x,py:h.y});      /* 它吃下去的挂在尾巴上（视觉上「叼着」） */
  S.events.push({type:'steal',x:h.x,y:h.y,
    text:(c.rarity?'🐍 抢走星屑 '+c.v:'🐍 抢走 '+c.v+(c.gold?'（金）':'')),t:S.steps});
  /* 吃够 FEED_MAX 块，或者身体已经太长（>10 节），就吐一块出来 ——
     不然它会一路吃成怪物，玩家连绕都绕不过。
     ⚠ 主线关（第 9 关起）用 FEED.* ，抢食模式沿用调好的 RACE.* —— 两套各管各的，别互相改。 */
  const maxLen=S.L.race?RACE.RIVAL_MAX:FEED.RIVAL_MAX;
  const maxFed=S.L.race?RACE.FEED_MAX:FEED.FEED_MAX;
  const bloated=r.body.length>maxLen;
  if(bloated||r.fed>=maxFed){
    const t1=r.body.pop(),t2=bloated?r.body.pop():null;   /* 吐掉 1~2 节，长度才算真的回落 */
    for(const t of [t1,t2]){
      if(!t||!inB(t.x,t.y))continue;
      if(S.cells[idx(t.x,t.y)]||bodyHas(t.x,t.y)||rivalHas(t.x,t.y))continue;
      const L=S.L;makeBlock(t.x,t.y,L.vmin+((S.rnd()*(L.vmax-L.vmin+1))|0));
      S.events.push({type:'spoil',x:t.x,y:t.y,text:'🤢 蚀蛇吐出一块',t:S.steps});
    }
    r.fed=0;
  }
  return true;
}
/* 玩法 5 技能一：冲刺（加速 + 1.4 秒内可穿过自己） */
function doRun(){
  if(!canSkill('run'))return false;
  S.nut-=RACE.RUN_COST;
  S.runUntil=S.steps+Math.ceil(RACE.RUN_MS/tickNow());
  S.cd.run=S.steps+Math.ceil(RACE.CD_MS/tickNow());
  pushEvent('run',headOf().x,headOf().y,'💨 冲刺');
  S.events.push({type:'run',x:headOf().x,y:headOf().y,text:'💨 冲刺',t:S.steps});
  return true;
}
/* 玩法 5 技能二：爆破（清掉头周围 3×3 的石头与负能） */
function doBoom(){
  if(!canSkill('boom'))return false;
  const h=headOf(),R=RACE.BOOM_R;
  let n=0;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const x=h.x+dx,y=h.y+dy;if(!inB(x,y))continue;
    const j=idx(x,y),c=S.cells[j];if(!c)continue;
    if(c.k==='wall'||c.k==='hazard'){
      S.boom.push({x,y,k:c.k});S.cells[j]=null;n++;
    }
  }
  S.nut-=RACE.BOOM_COST;
  S.cd.boom=S.steps+Math.ceil(RACE.CD_MS/tickNow());
  pushEvent('boom',h.x,h.y,'💥 爆破拆除 '+n);
  S.events.push({type:'boom',x:h.x,y:h.y,text:'💥 爆破拆除 '+n,t:S.steps});
  return n>0;
}
function sprinting(){return !!(S&&S.L.race&&S.runUntil&&S.steps<S.runUntil);}

/* ---------- 确定性随机：关卡地形每次重开都一样，方便练熟 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* ---------- 稀有方块专用的随机流 ----------
   ⚠⚠ 这条流**必须与 S.rnd 分开**，否则会出现「8 全刷在下方、6 全刷在上方」：
   位置是 pickSpot 抽的（freeSpots 按 y 升序 → 索引越大越靠下），档位紧跟着
   再抽一次 S.rnd()，而 **mulberry32 的相邻输出是正相关的**（实测「位置偏下且出 8」
   16.65%，无关联时应为 11.1%）。共用一条流 = 位置和稀有档位被绑死。
   另一条流（`S.rndB`）与选址完全独立，档位分布才均匀。
   同源相噬每局重掷（它本来就 randWalls 每局换地形，布局背板没意义）。 */

/* ---------- 秘笈（调试/测试用，不计入正常玩法） ----------
   主公说「自己打太慢了」，所以给一把可直接开图的钥匙。
   开关是全局的、跨关卡保留 —— 测试时每关都要重输一遍密令纯属折磨。
   代价：开过秘笈的这一局不写存档（不让测试成绩污染星级）。 */
const CHEAT={ghost:false,rush:false,half:false};
const GHOST_MIN=3;                     /* 虚化时身体保底长度，不会被饿死/啃光 */
const CHEATS={
  ghost:{key:'ghost',alias:['虚化','phase','穿墙','穿墙模式','noclip'],name:'虚化模式',icon:'🌀',
    desc:'边界改成穿越 · 巨石/自身/蚀蛇直接穿过 · 身体保底 '+GHOST_MIN+' 节 · 限时不再判负'},
  rush :{key:'rush', alias:['加速','疾行','speed','fast'],name:'疾行',icon:'⚡',
    desc:'每步间隔压到 40%，快速刷分'},
  half :{key:'half', alias:['减速','半速','慢放','慢动作','slow','0.5x'],name:'时间减速',icon:'⏳',
    desc:'双方速度同时降到一半（玩家每步间隔翻倍、蚀蛇相位推进减半）—— 用于观察它的走法'},
  open :{key:'open', alias:['解锁','全解锁','unlock','all'],name:'解锁全关',icon:'🗝',
    desc:'一次解锁全部关卡（仍会被后续存档覆盖）'},
  off  :{key:'off',  alias:['关闭','复原','恢复','normal','reset'],name:'全部复原',icon:'✅',
    desc:'关掉虚化、疾行与时间减速，回到正常规则'},
  dragon:{key:'dragon',alias:['化龙','成龙','long'],name:'直接化龙',icon:'🐉',
    desc:'自由模式局内立刻化龙（测结局与特效，不用真长到 '+Math.floor(20*20*(FREE.DRAGON_RATIO||1/3))+' 节）'},
};
/* 密令匹配：忽略大小写与首尾空格，中文别名同样认 */
function matchCheat(raw){
  const code=String(raw==null?'':raw).trim().toLowerCase();
  if(!code)return null;
  for(const k in CHEATS){const c=CHEATS[k];
    if(code===c.key||c.alias.indexOf(code)>=0)return c;}
  return null;
}
/* 返回 'on' / 'off' / 'open' —— open 需要写存档，交给调用方（浏览器段）执行 */
function applyCheat(c){
  if(!c)return null;
  if(c.key==='ghost'){CHEAT.ghost=!CHEAT.ghost;return CHEAT.ghost?'on':'off';}
  if(c.key==='rush' ){CHEAT.rush =!CHEAT.rush ;return CHEAT.rush ?'on':'off';}
  /* 时间减速：双方同时半速。与疾行相乘时是 0.4×2 = 0.8（净减速 20%），
     这符合「两个开关各自表达一件事」的直觉，不做互斥。 */
  if(c.key==='half' ){CHEAT.half =!CHEAT.half ;return CHEAT.half ?'on':'off';}
  if(c.key==='off'  ){CHEAT.ghost=false;CHEAT.rush=false;CHEAT.half=false;return 'off';}
  if(c.key==='open' )return 'open';
  if(c.key==='dragon')return 'dragon';   /* 实际置位在浏览器段：要能推事件、放特效 */
  return null;
}
function anyCheat(){return CHEAT.ghost||CHEAT.rush||CHEAT.half;}

/* ---------- 状态 ---------- */
let S=null;
function newState(id){

  const w=L.w,h=L.h;

     早先只重掷地形（buildTerrain 里改用 Math.random），选址仍吃固定的 L.seed：
     结果 300 局里方块只落在 9 行上（每局那 10 个位置一模一样），
     稀有块于是「8 恒在下方、6 恒在上方」，而且每局开局必出同一颗 8。
     地形重掷了、道具布局却背得死，randWalls 就等于只做了一半。
     没标 randWalls 的关卡仍用确定性种子，方便练熟套路（这一条不能动）。 */
  const salt=L.randWalls?Math.floor(Math.random()*0x100000000):0;
  S={L,w,h,rnd:mulberry32(L.seed+salt),cells:new Array(w*h).fill(null),

        档位若与选址共用一条流，会因 mulberry32 相邻输出正相关而和落点绑死。 */
     rndB:mulberry32((L.seed^0x9e3779b9)+salt+Math.floor(Math.random()*0x100000000)),
     dir:'right',queue:[],body:[],grow:0,pending:0,dmgStep:false,score:0,combo:0,bestCombo:0,sinceEat:0,
     alive:true,win:false,over:false,reason:'',steps:0,tickNow:L.tick,timeLeft:L.time||0,
