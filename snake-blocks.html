     events:[],nextSpawnId:1,cheatUsed:anyCheat(),invT:INVULN,
     rocks:[],fallAcc:0,             /* 第 13 关「落石阵」：空中的石块与落石时钟（其他关卡恒为空） */
     revealUntil:0,                  /* 第 14 关「暗夜迷雾」：星屑开图的到期步数。
        ⚠ 这里**没有**探索记忆表 —— 视野是实时算的（见 seenAt），
          第一版那张 seen 数组会让走遍地图后雾全失效（主公实测退回）。 */
     /* 第 17~19 关：重力/数字雨时钟、腐径的时间戳表、传送门列表 */
     gravAcc:0,rainAcc:0,trail:null,portals:[],
     /* 第 20 关「镜花水月」：位置历史 + 镜像身体缓存 + 碎裂冷却 */
     hist:[],mirrorBody:[],mirrorDead:0,
     /* resWin：上一次结算是否胜利（结算面板的金色主题读它）。
        ⚠ 必须每局清空 —— 否则上一局赢了、这一局刚开就点暂停重来，
        开场说明会顶着金色窗口（showConfirm 会主动 remove('gold') 兜一道，
        但根本修还是在建局时清干净）。 */
     resWin:null,
     /* 第 21 关「魔术蛇」：分裂次数 / 换位次数 / 合并次数 / 已存活秒数 */
     magicSplits:0,magicSwaps:0,magicMerges:0,magicT:0,
     freeT:0,fang:0,dragon:false};   /* 自由模式专属：已过秒数 / 毒牙次数 / 是否已化龙 */
  /* 决斗模式：开局给 1.5 秒无敌，玩家与蚀蛇**共享同一个计时**（S.invT）。
     玩家侧：die() 已认这个开关，撞死不了只会被顶住不动。
     蚀蛇侧：见 duelRivalMove —— 无敌期内自咬只回滚不判死，且死角判据放宽，
     让开局那 1.5 秒它敢往外钻，别一出生就被地形卡死。 */
  if(L.duel)S.invT=DUEL.INVULN;
  if(L.race)initRaceState(S);        /* 抢食模式专属：养分 / 冷却 / 里程碑 / 事件（其余模式不留痕） */
  if(L.duel)initDuelState(S);        /* 决斗模式专属：蚀蛇最高长度 / 收口统计 */
  if(L.magic)initMagicState(S);      /* 第 21 关「魔术蛇」：两条蛇计数 / 分裂与换位统计 */
  buildTerrain();
  const sx=Math.floor(w/2)-2,sy=Math.floor(h/2);
  if(L.void&&L.void.startLen)voidBody(L.void.startLen,sx,sy);
  else{
    S.body=[{x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy},{x:sx-3,y:sy}];
    for(const b of S.body){b.px=b.x;b.py=b.y;}
  }
  /* 开局朝向：原本写死向右，乱石关里正好有墙的话，起步无敌期会让蛇原地顶住不动，
     一直顶到无敌结束才撞死 —— 玩家看到的是「开局这条蛇不动了」。这里改成挑一个前方开阔的方向。 */
  S.dir=startDir();
  for(let i=0;i<L.blocks;i++)spawnBlock();
  for(let i=0;i<(L.hazards||0);i++)spawnHazard();  /* 开局就得有，否则前 18 步这张图名不副实 */
  negSeed();                                       /* 负数开局铺满：决斗模式 + 第 15 关「噬魂魔蛇」 + 第 21 关 */
  seedPortals();                                   /* 第 19 关「九曲回廊」：开局撒成对的传送门 */
  /* 自由模式的蚀蛇是「30 秒后入场」，开局不放 —— 由 tickFree 到点召唤 */
  if(!L.free)for(let i=0;i<(L.rival||0);i++)spawnRival();
  /* 第 21 关「魔术蛇」：开局那条是**本体**（只有母有分裂能力），长度用 MAGIC.MOM_START。
     ⚠ 必须放在 spawnRival 之后：spawnRival 建的蛇没有 role 字段，会被当成普通蚀蛇，
     永远不会分裂、也不会换位 —— 整关就退化成了「空地图 + 一条追人的蛇」。 */
  if(L.magic){
    const m=S.rivals[0];
    if(m){
      m.role='mom';
      /* ⚠ spawnRival 对非 duel 模式建的蛇是 **3 节且全叠在同一格**（n0=3，body 三次 push 同一坐标），
         而且可能生在贴墙位置。所以这里不能「在原来的身体上接节」——
         两次都失败过：先 slice 截断（静默变 3 节），后按 dir 反方向接（新位置算出界）。
         正确做法：**以蛇头为基准重排一条 MOM_START 节的直线**，跟 duel 的 placeRival 同一思路。 */
      const want=Math.max(1,S.L.MOM_START||5);
      /* ⚠⚠ 不能直接用 spawnRival 给的那个头 —— 它可能贴在边界上（实测生在了 x=21，
         而地图宽 22），本体第二步就冲撞边界，整关开局即终局。
         这里**重新挑一个不贴边的点**当蛇头，再按方向排直线。
         ⚠ 挑点要求「离边界至少 3 格」：want 节直线 + 一步转身的余量。 */
      let h0=null;
      for(let tries=0;tries<200&&!h0;tries++){
        const x=3+((S.rnd()*(S.w-6))|0),y=3+((S.rnd()*(S.h-6))|0);
        if(S.cells[idx(x,y)])continue;
        if(bodyHas(x,y))continue;
        h0={x:x,y:y};
      }
      if(!h0)h0={x:(S.w/2)|0,y:(S.h/2)|0};
      const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
      let line=null;
      for(const d of dirs){
        const ok=[];
        for(let i=0;i<want;i++){
          const x=h0.x+d[0]*i,y=h0.y+d[1]*i;
          if(!inB(x,y))break;
          if(S.cells[idx(x,y)])break;
          if(bodyHas(x,y)&&i>0)break;
          ok.push({x:x,y:y});
        }
        if(ok.length===want){line=ok;break;}
      }
      if(line){
        /* line[0] 是蛇头，其余依次向后 */
        m.body=line.map(p=>({x:p.x,y:p.y,px:p.x,py:p.y}));
        m.dir=[-line[1].x+line[0].x,-line[1].y+line[0].y];   /* 头→第二节的反方向即前进方向 */
        if(m.dir[0]===0&&m.dir[1]===0)m.dir=[-1,0];
      }
    }
  }
  return S;
}
function initMagicState(st){
  st.magicSplits=0;st.magicSwaps=0;st.magicMerges=0;st.magicT=0;
}
function idx(x,y){return y*S.w+x;}
/* 开局朝向：按 右→下→左→上 找一个「前方两格都不是石头」的方向，避免一出生就顶着墙。
   身体在蛇头左侧，所以向左是立即咬自己，放在最后兜底。
   neg（负数方块）也要一起排除：它是「看得见但会掉长度」的地块，撞上去和撞墙一样致命，
   开局就撞上等于白送一局。 */
function startDir(){
  const h=S.body[0];
  const order=['right','down','left','up'];
  const clear=(d,n)=>{
    const v=DIRS[d];
    for(let i=1;i<=n;i++){
      const x=h.x+v[0]*i,y=h.y+v[1]*i;
      if(!inB(x,y))return S.L.wrap;
      const c=S.cells[idx(x,y)];
      if(c&&c.k==='wall')return false;
      if(c&&c.k==='neg')return false;
      if(bodyHas(x,y))return false;
    }
    return true;
  };
  for(const d of order)if(clear(d,2))return d;
  for(const d of order)if(clear(d,1))return d;
  return 'right';
}
function inB(x,y){return x>=0&&y>=0&&x<S.w&&y<S.h;}
function cellAt(x,y){return inB(x,y)?S.cells[idx(x,y)]:null;}
function headOf(){return S.body[0];}
function bodyHas(x,y,skipTail){
  const n=S.body.length-(skipTail?1:0);
  for(let i=0;i<n;i++)if(S.body[i].x===x&&S.body[i].y===y)return true;
  return false;
}
function rivalHas(x,y){
  for(const r of S.rivals)for(const p of r.body)if(p.x===x&&p.y===y)return true;
  return false;
}
/* 撞上去的到底是哪条蛇的第几节 —— 毒牙撕咬要用，光知道「有蛇」不够 */
function rivalAt(x,y){
  for(const r of S.rivals){
    if(!r.alive)continue;
    for(let i=0;i<r.body.length;i++)if(r.body[i].x===x&&r.body[i].y===y)return {r,i};
  }
  return null;
}
/* 毒牙撕咬：咬点之后的半条蚀蛇当场化成数字方块，吃下去就长回来。
   蚀蛇不死，只是被打回一小截 —— 所以毒牙既是保命也是催肥。 */
function fangBite(x,y){
  const hit=rivalAt(x,y);if(!hit)return false;
  const r=hit.r,i=Math.max(1,hit.i);          /* 至少给它留个头，别整条抹掉 */
  const cut=r.body.slice(i);
  if(!cut.length)return false;                /* 没咬到东西就不消耗毒牙 */
  r.body.length=i;
  S.fang--;
  let made=0;
  for(const p of cut){
    const j=idx(p.x,p.y);
    if(S.cells[j]||bodyHas(p.x,p.y))continue;  /* 巢里堆叠的重复节/玩家身下：跳过，不重复给 */
    const v=FREE.FANG_LO+((S.rnd()*(FREE.FANG_HI-FREE.FANG_LO+1))|0);
    S.cells[j]={k:'block',v:v,id:S.nextSpawnId++};made++;
  }
  S.events.push({type:'fang',x,y,text:'🦷 撕咬！截断 '+cut.length+' 节，化作 '+made+' 块',t:S.steps});
  return true;
}
/* 化龙：自由模式的终点。身体长到地图 DRAGON_RATIO 就结束这一局 */
function forceDragon(){
  if(!S||S.over)return false;
  const h=headOf();
  S.dragon=true;S.win=true;S.over=true;
  pushEvent('dragon',h.x,h.y,'🐉 化龙！');
  return true;
}

/* ---------- 地形生成：墙随机散布，但必须保证起点能走到大部分格子 ----------
   标了 randWalls 的关卡（乱石关）每局重掷：地形记不住、练不熟，换来的是每局都新鲜。
   其余关卡仍用关卡种子的确定性随机，方便练熟套路。 */
function buildTerrain(){
  const L=S.L,rnd=(L.randWalls&&L.walls)?Math.random:S.rnd,w=S.w,h=S.h;
  const start=idx(Math.floor(w/2)-2,Math.floor(h/2));
  const put=(x,y)=>{S.cells[idx(x,y)]={k:'wall'};};
  const reachable=(min)=>{
    const seen=new Uint8Array(w*h);const q=[start];seen[start]=1;let n=0;
    while(q.length){const i=q.pop();n++;
      for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
        const x=i%w+d[0],y=(i/w|0)+d[1];
        if(!inB(x,y))continue;const j=idx(x,y);
        if(seen[j]||(S.cells[j]&&S.cells[j].k==='wall'))continue;
        seen[j]=1;q.push(j);}}
    return n>=min;
  };
  /* 墙成 1~3 格的小段，比纯噪点更像遗迹、也更好绕。
     walls 按「格数」结算而不是段数 —— 随机化之后如果格数也随运气漂，
     「总数不变」就是句空话，关卡难度会跟着抖。 */
  for(let tries=0;tries<40&&(L.walls||0)>0;tries++){
    const tmp=S.cells.slice();
    let placed=0;
    for(let guard=0;guard<L.walls*8&&placed<L.walls;guard++){
      const x=1+((rnd()*(w-2))|0),y=1+((rnd()*(h-2))|0);
      const len=1+((rnd()*3)|0),horiz=rnd()<0.5;
      for(let k=0;k<len&&placed<L.walls;k++){
        const px=x+(horiz?k:0),py=y+(horiz?0:k);
        if(px<=0||py<=0||px>=w-1||py>=h-1)continue;
        if(S.cells[idx(px,py)])continue;    /* 已是墙：不重复计数 */
        put(px,py);placed++;
      }
    }
    if(reachable((w*h)*0.72)){return;}
    S.cells=tmp; /* 连通性不够，整批重掷 */
  }
}

/* ---------- 场上物件生成 ---------- */
function freeSpots(minDistFromHead){
  const out=[];const hx=headOf().x,hy=headOf().y;
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    if(S.cells[idx(x,y)])continue;
    if(bodyHas(x,y))continue;
    if(rivalHas(x,y))continue;
    if(Math.abs(x-hx)+Math.abs(y-hy)<minDistFromHead)continue;
    out.push({x,y});
  }
  return out;
}
function pickSpot(minDist){
  const sp=freeSpots(minDist);
  if(!sp.length)return null;
  return sp[(S.rnd()*sp.length)|0];
}
function spawnBlock(){
  const p=pickSpot(3);if(!p)return false;
  const L=S.L,v=L.vmin+((S.rnd()*(L.vmax-L.vmin+1))|0);
  /* ⚠⚠ 走 makeBlock 的模式：抢食（金色 + 临期 born）、同源相噬、以及标了 rare 的
     主线关卡（稀有 6/7/8）。
     早先只有 race 走 makeBlock，duel 走下面的裸生成 —— 结果稀有块一局都出不来
     （裸生成既不掷 rarity 也不写 born）。
     **规则只留一处真相**：凡是需要额外字段的方块类型，一律经 makeBlock 出生。 */
  if(L.race||L.duel||L.rare){makeBlock(p.x,p.y,v);return true;}
  S.cells[idx(p.x,p.y)]={k:'block',v:v,id:S.nextSpawnId++};
  return true;
}
function spawnHazard(){
  const p=pickSpot(5);if(!p)return false;
  const L=S.L,v=1+((S.rnd()*(L.hmax||3))|0);
  S.cells[idx(p.x,p.y)]={k:'hazard',v:v,id:S.nextSpawnId++};
  return true;
}
function spawnPower(){
  const kinds=S.L.powers;if(!kinds||!kinds.length)return false;
  const p=pickSpot(6);if(!p)return false;
  const kind=kinds[(S.rnd()*kinds.length)|0];
  S.cells[idx(p.x,p.y)]={k:'power',p:kind,id:S.nextSpawnId++};
  return true;
}
/* 在 (x,y) 附近找一个能放兽巢的空格（螺线外扩）。巢要是压在玩家身上或别的地块上，
   玩家一走进那格就先判成撞墙 —— 明明是蚀蛇留下的东西，却算玩家操作失误，不合理。 */
function placeNest(x,y){
  for(let r=0;r<6;r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const px=x+dx,py=y+dy;
      if(!inB(px,py))continue;
      if(S.cells[idx(px,py)])continue;
      if(bodyHas(px,py))continue;
      return {x:px,y:py};
    }
  }
  return null;
}
/* 给一条蚀蛇安一个新身体（新建和复活都走这里） */
function placeRival(r){
  /* 自由模式：从兽巢里往外爬。头先出来，身子一节一节跟着，爬完巢就塌成石林。 */
  if(S.L.free&&r.nest){
    const p=r.nest;
    r.body=[{x:p.x,y:p.y,px:p.x,py:p.y}];
    r.emerge=Math.max(0,(r.inherit||FREE.INHERIT_MIN)-1);
    r.dir=[-1,0];r.alive=true;r.respawn=0;
    pushEvent('emerge',p.x,p.y,'🕳 蚀蛇爬出 '+((r.emerge)+1)+' 节');
    return true;
  }
  const p=pickSpot(9)||pickSpot(4);if(!p)return false;
  r.body=[];
  /* 决斗模式：它开局 7 节（比玩家的 4 节长，但还没长到能围死你）。
     身体必须**一节一节排开**，不能全叠在一格上 —— 叠在一起的话它第一步就会
     被判定成「咬到自己」而当场死亡（这是实测踩到的坑）。 */
  const n0=S.L.duel?DUEL.RIVAL_START:3;
  if(S.L.duel){
    /* 决斗：给它找一条**完整直线**的位置（7 节），而且每一节四周都要留出余地。
       这条踩过的坑：早先只在「头部那一格」挑空位，于是
         · 大约 12% 的对局里它根本生不出来（7 节直线塞不进地形）；
         · 更要命的是它会被生成在贴墙的位置（x=19 而最外一圈是石头），
           开局第一步就撞死 —— 那种局等于白送。 */
    const fits=(bx,by,d,len)=>{
      for(let i=0;i<len;i++){
        const x=bx+d[0]*i,y=by+d[1]*i;
        if(x<1||y<1||x>S.w-2||y>S.h-2)return false;          /* 最外一圈留白，别贴墙 */
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          const c=S.cells[idx(x+dx,y+dy)];
          if(c&&c.k==='wall')return false;                    /* 旁边也不能紧贴石头 */
        }
        if(S.cells[idx(x,y)])return false;
        if(bodyHas(x,y))return false;
      }
      /* 关键：身体排成直线时，头的前方和两侧必须有活路。
         否则它第一步就「前/左/右全是墙」，只能贴着自己的脖子——那种局等于白送。 */
      const hx=bx,hy=by,hdir=[-d[0],-d[1]];
      let free=0;
      for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){
        if(dd[0]===-hdir[0]&&dd[1]===-hdir[1])continue;       /* 掉头不算 */
        const x=hx+dd[0],y=hy+dd[1];
        if(!inB(x,y))continue;
        if(S.cells[idx(x,y)])continue;
        if(bodyHas(x,y))continue;
        free++;
      }
      return free>=2;                                          /* 至少两个合法方向 */
    };
    let spot=null,base=null;
    const DIR4=['up','right','down','left'];
    for(let len=n0;len>=3&&!spot;len--){
      for(let tries=0;tries<120&&!spot;tries++){
        const p=(tries<70?pickSpot(8):null)||pickSpot(4)||pickSpot(1);
        if(!p)break;
        for(let t=0;t<4;t++){
          const d=DIRS[DIR4[t]];
          if(fits(p.x,p.y,d,len)){spot={d:d,len:len};base=p;break;}
        }
      }
    }
    if(!spot)return false;
    const len=spot.len||n0;
    /* 自检：蛇身必须是一条**连续**的直线（每一节都和上一节相邻）。
       出生几何一旦不连续（头和身体脱开），AI 的候选格会算到离身体很远的地方，
       下一步就会「压在自己身上」被判自咬 —— 实测的「莫名自咬」就是这么冒出来的。
       所以这里不直接采信 base/d，而是**按坐标重新排一遍**：
       顺 d 方向最远的一节当头，其余依次向后排，保证头尾相连。 */
    const d=spot.d;
    const line=[];
    for(let i=0;i<len;i++)line.push({x:base.x+d[0]*i,y:base.y+d[1]*i});
    line.sort((a,b)=>(d[0]!==0?((a.x-b.x)*d[0]) : ((a.y-b.y)*d[1])));
    /* line 现在按「顺 d 方向从近到远」排列：最远的那节（line[len-1]）当蛇头 */
    const head=line[len-1];
    r.body=[];
    for(let i=0;i<len;i++){
      const p=line[len-1-i];                     /* 从蛇头往回排 */
      r.body.push({x:p.x,y:p.y,px:head.x,py:head.y});
    }
    /* 朝向：身体在后、前方开阔 */
    r.dir=[-d[0],-d[1]];
  }else{
    for(let i=0;i<n0;i++)r.body.push({x:p.x,y:p.y,px:p.x,py:p.y});
    r.dir=[-1,0];      /* dir 用向量而非字符串：AI 里的掉头过滤只认向量 */
  }
  r.alive=true;r.respawn=0;
  if(S.L.duel){r.acc=0;r.spd=DUEL.SPD_NORMAL;r.rush=false;r.burn=0;r.choke=0;r.doomed=0;r.turnCd=-999;
    /* 饥饿与增长的初值：lastEat 记为建局时刻（否则第一拍就判定饿了），
       grow=0 是待长信贷。 */
    r.grow=0;r.starve=0;r.lastEat=S.steps;
    if(r.body.length>S.rivalMax)S.rivalMax=r.body.length;}
  return true;
}
function spawnRival(){
  if(S.rivals.length>=(S.L.rival||0))return false;   /* 场上名额满了就不再叠 */
  const r={alive:false,body:[],dir:[-1,0],respawn:0};
  if(!placeRival(r))return false;
  S.rivals.push(r);return true;
}
/* 蚀蛇退场：不删掉这条记录，留着倒计时等它回来。
   cutLen=自由模式下它这次咬断了多少节 —— 兽巢照这个数记着，下次复活就长这么长。
   这是自由模式的核心循环：咬得越狠，回来的蛇越长，但撕咬它的回报也越大。 */
function killRival(r,cutLen){
  /* 决斗模式：它只死一次，死了就是玩家赢 —— 不走兽巢/复活那套 */
  if(S.L.duel){duelKillRival(r,'蚀蛇死了');return;}
  if(S.L.free){
    const h=r.body[0];
    if(h){
      const n=placeNest(h.x,h.y);
      if(n){
        r.nest=n;
        r.inherit=Math.max(FREE.INHERIT_MIN,Math.min(FREE.INHERIT_MAX,cutLen||FREE.INHERIT_MIN));
        S.cells[idx(n.x,n.y)]={k:'nest',len:r.inherit};
        pushEvent('nest',n.x,n.y,'🕳 兽巢（'+r.inherit+' 节）');
      }
    }
  }
  r.alive=false;r.body=[];r.respawn=RIVAL_RESPAWN;
}
/* 复活倒计时（秒）。放逻辑段，node 才能直接推进做断言 */
function tickRivals(dt){
  if(!S)return;
  const d=(dt||0)/1000;
  for(const r of S.rivals)if(!r.alive)r.respawn=Math.max(0,(r.respawn||0)-d);
}
/* 自由模式时钟：推进已过秒数，到点把第一只蚀蛇放进来（只有自由模式走这条） */
function tickFree(dt){
  if(!S||!S.L.free)return;
  S.freeT+=(dt||0)/1000;
  if(S.freeT>=FREE.RIVAL_AT&&!S.rivals.length)spawnRival();
}
function respawnRivals(){
  if(!(S.L.rival>0))return;
  for(const r of S.rivals){
    if(r.alive||(r.respawn||0)>0)continue;
    if(!placeRival(r)){r.respawn=1;continue;}   /* 暂时没地方生，等下一拍 */
    S.events.push({type:'spawn',x:r.body[0].x,y:r.body[0].y,text:'🐍 '+foeName(r)+'再现',t:S.steps});
  }
}
function countOf(k){
  let n=0;for(const c of S.cells)if(c&&c.k===k)n++;return n;
}
/* 决斗模式：负数方块用独立的地块类型 'neg'（这样它有独立补给上限，不会跟正数互相挤），
   但玩法上它仍然算「方块」—— 吃、算分、算数量都要一起看 */
function countFood(){let n=0;for(const c of S.cells)if(c&&(c.k==='block'||c.k==='neg'))n++;return n;}
function countNeg(){let n=0;for(const c of S.cells)if(c&&c.k==='neg')n++;return n;}
function isFood(c){return !!c&&(c.k==='block'||c.k==='neg');}

/* ---------- 输入方向 ---------- */
function setDir(d){
  if(!S.alive||S.win)return false;
  const last=S.queue.length?S.queue[S.queue.length-1]:S.dir;
  if(d===last||d===OPP[last])return false;
  if(S.queue.length>=2)return false;
  S.queue.push(d);return true;
}

/* ---------- 每步推进 ---------- */
function wrapXY(x,y){
  if(x<0)x=S.w-1;else if(x>=S.w)x=0;
  if(y<0)y=S.h-1;else if(y>=S.h)y=0;
  return [x,y];
}
function pushEvent(type,x,y,text){S.events.push({type,x,y,text,t:S.steps});}

/* 剪掉 n 节（负能方块 / 饥饿）。长度不够就直接死。
   先扣「尚未兑现的生长信贷」再扣身体 —— 否则玩家挨了罚却看不出任何变化。
   ⚠⚠ **致死分支必须先问 die()、再截断身体，顺序不能反**：
   die() 会被起步无敌 / 鳞甲挡下并返回 true（那一步本该「作废、原地不动」）。
   早先写成「先把身体剪到 1 节再 die()」，被挡下时函数返回、调用方看 S.alive 还是 true
   就继续往下走，末尾的尾巴规则再 pop 一下 → **0 节蛇** → headOf() 返回 undefined
   → 之后每一步（spawnBlock→freeSpots 读蛇头）都抛异常，画面冻住、蛇消失、且永远不结算。
   另一个坑：还原身体**不能靠写 arr.length** —— `length=1` 已经把尾元素销毁了，
   再写回原长度得到的是 undefined 空槽，不是原元素（踩过一次，症状是 bodyHas 读 undefined.x）。
   被挡下就整下作废（含生长信贷一并还回去），保证「没死 = 没吃亏」。 */
function shrink(n,reason){
  if(n<=0)return 0;
  let left=n;
  /* 虚化下最多扣到保底长度 —— 不然第 6 关的饥饿照样能饿死，这钥匙就白给了 */
  if(CHEAT.ghost)left=Math.min(left,Math.max(0,S.body.length-GHOST_MIN));
  if(left<=0)return 0;
  if(S.grow>0){
    const use=Math.min(S.grow,left);
    S.grow-=use;left-=use;
    S.pending=Math.max(0,(S.pending||0)-use);   /* pending 是「已发放但还没兑现」的信贷余额 */
  }
  if(left<=0)return voidScore(n);
  if(S.body.length<=left){
    /* ⚠⚠ 第 16 关「作减求空」：长度归零是**胜利**不是死亡。
       判定必须在**这个分支里面**（只有真的一节不剩时才成立），不能提到分支外 ——
       提到外面就会变成「这关挨任何一下都直接通关」，我第一版就是这么写错的。
       同时也不能挪到 step 末尾：胜利与死亡共用「长度不够」这一刻，先走 die() 就永远赢不了。 */
    if(S.L.void){voidWin();return voidScore(n);}
    /* ⚠⚠ **必须先问 die()、后截断身体**，顺序不能反。
       早先写成「先 length=1 再 die()，被挡下就 length=snap.len 还原」——
       这是个隐蔽的假还原：JS 里 `arr.length=1` 会**销毁**尾元素，
       再把 length 调回 3 得到的是 [头, undefined, undefined]，
       下一个 pop 之后 bodyHas 读到 undefined.x 直接抛异常。
       现在改成：身体保持完整 → 问 die() → 真死了才截到 1 节（且用 pop 不用 length）。 */
    const snap={len:S.body.length,grow:S.grow,pending:S.pending||0};
    if(die(reason||'身体被啃光了')){
      /* 挡住了（起步无敌/鳞甲）：这一下整下作废，身体与信贷原样不动 */
      S.grow=snap.grow;S.pending=snap.pending;
      return 0;
    }
    while(S.body.length>1)S.body.pop();   /* 真死了：截到 1 节，留头给渲染与结算读 */
    return voidScore(n);
  }
  for(let i=0;i<left;i++)S.body.pop();
  return voidScore(n);
}
/* 第 16 关：缩短即得分（这关的「分」衡量的是减掉了多少，不是吃了多少）。
   ⚠ 只在**真的减掉了**时加 —— shrink 返回 0（被起步无敌/鳞甲挡下）时不得分。 */
function voidScore(n){if(S.L.void)S.score+=n*VOID.SCORE;return n;}

/* 开局无敌倒计时（秒）。放逻辑段，node 测试才能直接推进它 */
function tickInv(dt){if(S)S.invT=Math.max(0,S.invT-(dt||0)/1000);}
function invincible(){return S.invT>0;}

function die(reason){
  if(S.invT>0){                     /* 起步无敌：这一步作废，蛇停在原地等玩家转向 */
    S.events.push({type:'inv',x:headOf().x,y:headOf().y,text:'🛡 起步无敌',t:S.steps});
    return true;
  }
  if(S.shield>0){
    S.shield--;S.events.push({type:'shield',x:headOf().x,y:headOf().y,text:'🛡 鳞甲碎裂',t:S.steps});
    return true; /* 挡住了 —— 调用方负责让这一步作废 */
  }
  S.alive=false;S.over=true;S.reason=reason;
  S.events.push({type:'die',x:headOf().x,y:headOf().y,text:reason,t:S.steps});
  return false;
}

function step(){
  if(S.over||S.win||!S.alive)return 'idle';
  S.steps++;
  S.dmgStep=false;                       /* 这一步有没有挨罚。挨罚那一步即使有生长信贷也得剪尾 */
  if(anyCheat())S.cheatUsed=true;      /* 开过挂的这一局，结算不写存档 */
  raceUpdate();                        /* 抢食模式：养分流失 / 冷却 / 事件时钟（其他模式空操作） */
  magicStep();                         /* 第 21 关「魔术蛇」：本体分裂检查 + 换位冷却（其他模式空操作） */
  histPush();                          /* 第 20 关「镜花水月」：记下本步开始时的蛇头位置 */
  mirrorStep();                        /* 第 20 关：重算镜像身体 + 判它有没有咬到自己 */
  driftStep();                         /* 第 10 关「流沙方阵」：方块自己会挪（其他关卡空操作） */
  shrinkStep();                        /* 第 11 关「毒雾收束」：边界往里收（其他关卡空操作） */
  omniPhase();                         /* 第 12 关「万象归元」：机制轮换的时钟（其他关卡空操作） */
  fallStep();                          /* 第 13 关「落石阵」：石块下落一格（其他关卡空操作） */
  gravStep();                          /* 第 17 关「天坠」：整条蛇被重力往下拽一格 */
  rainStep();                          /* 第 17 关「天坠」：数字从天上落下来 */
  rotStep();                           /* 第 18 关「腐径」：走过的路到点腐化 */

  /* 取方向 */
  if(S.queue.length)S.dir=S.queue.shift();

  const d=DIRS[S.dir],h=headOf();
  let nx=h.x+d[0],ny=h.y+d[1];
  S.nextHead={x:nx,y:ny};        /* 决斗模式：蚀蛇那边要先知道我要去哪一格，才能判「谁撞谁」 */
  const out=!inB(nx,ny);
  if(out){
    if(!S.L.wrap&&!CHEAT.ghost){
      if(!die('撞上了边界'))return 'dead';
      return 'blocked';
    }
    const w2=wrapXY(nx,ny);nx=w2[0];ny=w2[1];
    if(CHEAT.ghost&&!S.L.wrap)pushEvent('warp',nx,ny,'🌀 穿界',S.steps);
  }
  /* 传送门（第 19 关）：踩进去从配对方出来，方向保持。
     ⚠ 必须放在取 c **之前** —— 传送后脚下那一格换成了出口的地块，
        顺序反了会拿到「门这一格的地块」（而门不是地块，是 portal 列表里的坐标）。 */
  if(portalOn()&&!CHEAT.ghost&&!out){
    const pt=portalAt(nx,ny);
    if(pt){
      const o=portalJump(pt);
      if(o){nx=o.x;ny=o.y;}
    }
  }
  let c=S.cells[idx(nx,ny)];
  let willGrow=S.grow>0?1:0;

  /* 墙 —— 虚化时直接穿过去；决斗模式撞墙就是死（没有起步无敌） */
  if(c&&c.k==='wall'&&!CHEAT.ghost){
    if(S.L.duel){return duelLose('一头撞进巨石')?'dead':'blocked';}
    if(S.shield>0){S.shield--;S.cells[idx(nx,ny)]=null;
      S.events.push({type:'crash',x:nx,y:ny,text:'🛡 撞碎巨石',t:S.steps});
      return 'blocked';}
    if(!die('一头撞进巨石'))return 'dead';
    return 'blocked';
  }
  /* 落石（第 13 关）：撞上去等同于撞墙。
     ⚠ 石块下落时**不会砸死你**（它遇到障碍会悬停），但你自己撞进它照样死 ——
       威胁必须来自走错，不是天灾。 */
  if(!CHEAT.ghost&&rockAt(nx,ny)){
    if(!die('一头撞进落石'))return 'dead';
    return 'blocked';
  }
  /* 自己的身体（尾巴这一步会让位，除非正在生长）—— 同理可穿；抢食模式冲刺时也允许穿过去 */
  if(!CHEAT.ghost&&!sprinting()&&bodyHas(nx,ny,!willGrow)){
    if(S.L.duel){return duelLose('咬到了自己的身体')?'dead':'blocked';}
    if(!die('咬到了自己的身体'))return 'dead';
    return 'blocked';
  }
  /* 蚀蛇身体 —— 自由模式攥着毒牙时，撞上去不是送死，是撕咬；
     决斗模式里撞上去（含头对头）就是玩家输。 */
  if(!CHEAT.ghost&&rivalHas(nx,ny)){
    if(S.L.duel){
      return duelLose(rivalHeadAt(nx,ny)?'头对头，撞上了蚀蛇的头':'撞上了蚀蛇')?'dead':'blocked';
    }
  /* 第 15 关「噬魂魔蛇」：撞头 = 送死，撞身体 = 把它吃掉。
     ⚠ 判据用 rivalAt 的**节号**而不是 rivalHeadAt —— 撞的是哪条蛇的第几节，
        两件事都要知道（要吃掉的是 hit.r，判定生死的是 hit.i===0）。 */
  if(soulOn()){
    const hit=rivalAt(nx,ny);
    if(hit&&hit.i===0){
      if(!die('一头撞进'+RIVAL.name+'的嘴'))return 'dead';
      return 'blocked';
    }
    if(hit){devourRival(hit.r);c=S.cells[idx(nx,ny)];}
    else{if(!die('撞上了'+RIVAL.name))return 'dead';return 'blocked';}
  }
  /* ⚠⚠ 第 21 关「魔术蛇」（主公 2026-10-14 定）：**蛇撞到玩家，吃掉玩家一截长度**，
     不是玩家即死 —— 这关的设定是「你和蛇都在长，撞一下只是被啃一口」。
     反过来蛇主动撞玩家也一样（见 magicRivalMove 的咬人分支）。
     ⚠ 撞蛇头仍然即死：那是「一头撞进它嘴里」，性质不同。 */
  else if(magicOn()){
    const hit=rivalAt(nx,ny);
    if(hit&&hit.i===0){
      /* ⚠ 这关的敌人叫「本体 / 分身」，不是通用的「蚀蛇」——
         死因串要跟着走，否则结算面板会突然冒出一个玩家没见过的称呼。 */
      if(!die('一头撞进本体的嘴'))return 'dead';
      return 'blocked';
    }
    if(hit){
      const before=S.body.length;
      const cut=Math.max(1,before-2);           /* 至少给玩家留 2 节，别一口咬死 */
      S.body.length=cut;S.combo=0;S.grow=0;
      S.events.push({type:'bite',x:nx,y:ny,
        text:'🐍 被啃去 '+(before-cut)+' 节',t:S.steps});
      if(S.body.length<=0){if(!die('长度被啃尽'))return 'dead';}
    }
  }
  else if(S.L.free&&S.fang>0){
      fangBite(nx,ny);
      c=S.cells[idx(nx,ny)];        /* 撕咬可能就在脚下掉出一块，重新取一次 */
    }else{
      if(!die('撞上了蚀蛇'))return 'dead';
      return 'blocked';
    }
  }
  /* 镜像（第 20 关）：撞上几秒前的自己，即死。
     ⚠ 判据必须带 S.mirrorDead<=0 —— 碎裂冷却期内它不存在，别拿空身体误判。 */
  if(!CHEAT.ghost&&mirrorOn()&&S.mirrorDead<=0&&mirrorHas(nx,ny)){
    if(!die('撞上了过去的自己'))return 'dead';
    return 'blocked';
  }

  /* 记录旧位置用于插值渲染 */
  for(const p of S.body){p.px=p.x;p.py=p.y;}
  const oldHead={x:h.x,y:h.y};
  S.body.unshift({x:nx,y:ny,px:oldHead.x,py:oldHead.y});

  /* 吃到什么 —— 只记「生长信贷」，具体兑现交给下面的统一尾巴规则 */
  if(c&&c.k==='neg'){
    /* 负数方块（决斗模式的独立地块类型）：撞上就是掉长度，身体不够就死。
       吃它是拿自己的长度换蚀蛇的机动力 —— 它的加速全靠这个当粮。 */
    S.combo=0;S.cells[idx(nx,ny)]=null;
    if(S.L.duel)S.duelNeg++;
    S.dmgStep=true;
    /* ⚠ shrink() 返回 0 = 致死量被起步无敌/鳞甲挡下（这一下没吃亏），
       这时不能再补一条 hurt 事件 —— 否则玩家看到「🩸 -5」但身体一节没少，自相矛盾。 */
    if(shrink(c.v,'负能方块吃光了身体')>0)
      S.events.push({type:'hurt',x:nx,y:ny,v:c.v,t:S.steps});
    if(!S.alive)return 'dead';
    /* ⚠ 第 16 关：归零是**胜利**，而且这一刻身体已经空了 —— 必须立刻结束这一拍，
       否则后面的 spawnBlock→freeSpots 会去读一个不存在的蛇头。 */
    if(S.win)return 'win';
  }else if(c&&c.k==='block'){
    S.combo++;S.sinceEat=0;
    if(S.combo>S.bestCombo)S.bestCombo=S.combo;
    const mult=1+Math.min(S.combo-1,9)*0.1;
    /* 得分 N×(10+3N)：分数增长快于身体增长，否则「多拿分」和「别长大」完全同向，
       后期只剩死路一条。大方块分数溢价，才敢冒身体暴涨的风险去吃。 */
    const race=!!S.L.race;
    const gold=race&&c.gold?1:0;                     /* 玩法 2：金色 = 3 倍分、不长身 */
    const rot=race&&c.rot?2:1;                       /* 玩法 1：临期方块双倍分 */
    const gain=Math.round(c.v*(10+c.v*3)*mult*(gold?RACE.GOLD_MULT:1)*rot);
    S.score+=gain;
    if(!gold){S.grow+=c.v;S.pending=(S.pending||0)+c.v;}   /* 本步用它抵消尾巴 + 往后 v-1 步继续长 */
    if(race){
      S.raceEats++;S.raceBirths++;
      if(RACE.on.nut)addNut(gold?nutGain(c.v)+1:nutGain(c.v));
      /* 玩法 3：连击里程碑（回养分 + 清一块最近的石头） */
      comboMark(S.combo);
    }
    S.cells[idx(nx,ny)]=null;
    S.events.push({type:'eat',x:nx,y:ny,v:c.v,gain:gain,t:S.steps,
      gold:gold,rot:(rot>1?1:0),rare:!!c.rarity});
    /* 第 14 关「暗夜迷雾」：吃到星屑临时照亮全图 —— 给未知区域一个主动解法，
       否则面对看不见的地方玩家只能瞎撞（这条是这关唯一的破局手段）。 */
    if(c.rarity&&fogOn()){
      S.revealUntil=S.steps+FOG.REVEAL_STEPS;
      S.events.push({type:'reveal',x:nx,y:ny,t:S.steps,text:'✨ 星屑照亮全图'});
    }
  }else if(c&&c.k==='hazard'){
    S.combo=0;S.dmgStep=true;
    S.cells[idx(nx,ny)]=null;
    if(shrink(c.v,'负能方块吃光了身体')>0)      /* 同上：被无敌/鳞甲挡下就不报 hurt */
      S.events.push({type:'hurt',x:nx,y:ny,v:c.v,t:S.steps});
    if(!S.alive)return 'dead';
    /* ⚠ 第 16 关：归零是**胜利**，而且这一刻身体已经空了 —— 必须立刻结束这一拍，
       否则后面的 spawnBlock→freeSpots 会去读一个不存在的蛇头。 */
    if(S.win)return 'win';
  }else if(isFog(nx,ny)&&!CHEAT.ghost){
    /* 毒雾（第 11 关）：踩进去扣节，但**不直接死** —— 与石头（撞上即死）规则不同，
       所以它不能复用 wall 那条分支。虚化时毒雾无效（跟穿墙一致）。
       ⚠ shrink 返回 0 = 被起步无敌挡下，这时不报事件（跟 hazard 同一套规矩）。 */
    S.combo=0;S.dmgStep=true;
    const dmg=(S.L.shrink&&S.L.shrink.dmg)||2;
    if(shrink(dmg,'毒雾吞掉了身体')>0)
      S.events.push({type:'hurt',x:nx,y:ny,v:dmg,fog:1,t:S.steps});
    if(!S.alive)return 'dead';
    /* ⚠ 第 16 关：归零是**胜利**，而且这一刻身体已经空了 —— 必须立刻结束这一拍，
       否则后面的 spawnBlock→freeSpots 会去读一个不存在的蛇头。 */
    if(S.win)return 'win';
  }else if(c&&c.k==='rot'){
    /* 腐地（第 18 关）：踩上去扣节，而且**踩过一次就没了** ——
       不然同一格能反复扣，玩家会被一格腐地无限刮死。 */
    S.combo=0;S.dmgStep=true;
    S.cells[idx(nx,ny)]=null;
    if(shrink(c.v,'踩进了腐烂的路')>0)
      S.events.push({type:'hurt',x:nx,y:ny,v:c.v,rot:1,t:S.steps});
    if(!S.alive)return 'dead';
    if(S.win)return 'win';
  }else if(c&&c.k==='power'){
    S.cells[idx(nx,ny)]=null;
    applyPower(c.p);
  }
  /* 统一的尾巴规则：有信贷就不剪尾巴并消耗 1 点，没有就正常缩尾。
     ⚠ **挨罚那一步必须照常剪尾**，这是审查报告 §1 的核心修复。
     原 bug：`shrink()` 会先拿 `grow` 里的信贷抵掉伤害（设计如此：伤害延迟兑现），
     而尾巴规则只看 `S.grow>0` 就「免剪」—— 于是「吃 +4 撞 -1」这一步身体反而 +1 节，
     玩家看到的是「挨打反而变长」，扣命方块有时完全没用甚至送长度。
     `pending` 记的是「已发放但还没兑现」的信贷余额，shrink 扣 grow 时同步扣它；
     这里先减 pending，再按 (grow>0 && !dmgStep) 决定这一步免不免剪。
     实测对照（吃 +4 后连撞四个 -1）：
       原版 1→2→3→3→2→1（前两下反而变长）｜修复后 1→2→2→2→2→1（每一步真在缩）
     而「吃 +N 总增长 N」「第 6 关吃 +7 跑 20 步饿 2 节净 +5」这两条结算不变。 */
  if(S.pending>0)S.pending--;
  /* ⚠ 硬底线：任何路径都不许把蛇剪成 0 节。0 节 → headOf() 返回 undefined →
     紧接着的 spawnBlock/freeSpots 读蛇头直接抛异常，主循环每帧都炸在这，
     表现为「蛇凭空消失 + 永远不出结算」。shrink 已保证致死时兜到 1 节，
     这里再兜一次底（伤害步 + 无敌挡下时长度已被还原过，但多一道保险不亏）。 */
  if(S.grow>0&&!S.dmgStep)S.grow--;
  else if(S.body.length>1)S.body.pop();
  else S.grow=0;
  if(S.sinceEat++>15)S.combo=0;

  /* 蚀蛇行动：其他模式是「每 2 步走一格」（比玩家慢一半）；
     决斗模式的速度由它自己的倍率决定（0.8× / 1.5×），所以每步都调，由相位累加器卡节奏。 */
  if(S.L.rival)respawnRivals();
  for(const r of S.rivals)if(S.L.duel||(S.steps%2)===0)stepRival(r);
  /* 决斗模式里，蚀蛇走完之可能会「送上门」：它撞到我的身体 → 它死，我赢 */
  if(S.L.duel&&!S.over)duelCheckRivalDeath();

  /* 补充场上物件（决斗：正数走 countFood，负数有自己的上限和节奏；名额内每次最多补一块，
     所以这里要循环到补满为止 —— 否则第一局开头方块会一直是缺的） */
  const foodCap=S.L.duel?(S.L.blocks+countNeg()):S.L.blocks;
  for(let guard=0;guard<8&&countFood()<foodCap;guard++)if(!spawnBlock())break;
  const wantHaz=S.L.hazards||0;
  if(wantHaz&&countOf('hazard')<wantHaz&&S.steps%18===0)spawnHazard();
  if(S.L.powers&&countOf('power')<2&&S.steps%26===0)spawnPower();

  /* 抢食模式：腐坏方块结算（养分/冷却/事件已在步首 raceUpdate 里推进过） */
  if(S.L.race&&RACE.on.rot)rotBlocks();
  /* 负数补给（决斗模式与第 15 关「噬魂魔蛇」共用一套时钟） */
  negClock();
  /* 决斗模式：蚀蛇最高长度 + 收口计时（其他模式空操作） */
  if(S.L.duel&&!S.over)duelClock();

  /* 饥饿：定期掉一节 */
  if(S.L.hunger&&S.steps%S.L.hunger===0){
    shrink(1,'活活饿死');
    if(!S.alive)return 'dead';
    /* ⚠ 第 16 关：归零是**胜利**，而且这一刻身体已经空了 —— 必须立刻结束这一拍，
       否则后面的 spawnBlock→freeSpots 会去读一个不存在的蛇头。 */
    if(S.win)return 'win';
  }

  /* 自由模式的终点不是分数，是化龙 —— 放在分数判定前，它根本没有 target */
  if(S.L.free&&S.body.length>=dragonNeed()){forceDragon();return 'dragon';}
  /* ⚠⚠ 第 21 关「魔术蛇」的终局是「活到时间到」，**方向和限时关正好相反**：
     限时关（第 4 关）时间到算**输**，这里时间到算**赢**。
     浏览器段主循环里那条 `if(S.L.time)` 的判定是「时间到 → 失败」，
     所以这关不能走那条路，必须在这里提前拦下并返回 'win'。
     ⚠ 还必须排在分数判定前 —— 这关没有 target，走分数判定会直接判赢。 */
  if(magicOn()){
    if(S.timeLeft<=0&&!S.over){
      S.win=true;S.over=true;S.reason='⌛ 撑过了 '+S.L.time+' 秒';
      S.events.push({type:'magicwin',x:headOf().x,y:headOf().y,t:S.steps,
        text:'🏁 时限已满'});
      return 'win';
    }
    return 'move';
  }
  /* ⚠ 第 16 关「作减求空」**没有目标分** —— 它靠「归零」取胜，分数只是过程反馈。
     这里必须显式排除：否则它吃正数刷的分一旦越过某个默认值就直接判赢，这关就白做了。 */
  if(!S.L.void&&S.score>=S.L.target){S.win=true;S.over=true;}
  return S.win?'win':'move';
}

function applyPower(kind){
  S.events.push({type:'power',x:headOf().x,y:headOf().y,p:kind,t:S.steps});
  if(kind==='slow')S.slowUntil=S.steps+Math.ceil(6000/S.tickNow);
  else if(kind==='shield')S.shield=Math.min(S.shield+1,3);
  else if(kind==='cut'){const n=Math.min(4,Math.max(0,S.body.length-3));for(let i=0;i<n;i++)S.body.pop();}
  else if(kind==='fang')S.fang=Math.min(S.fang+1,3);   /* 最多攒 3 次，别让毒牙变成常驻武器 */
  else if(kind==='nut')addNut(3);                      /* 抢食模式专属：养分补给 */
}

/* ---------- 蚀蛇 AI：朝玩家头部靠近，够本的时候敢下口咬身体 ----------
   咬人是「一命换一截」：蚀蛇咬完自己也退场，所以它只在划算时才咬。
   早先这分支是死代码 —— 选路时把玩家全身都排除了，蚀蛇永远走不进身体格。 */
/* 咬点评分：返回 null 表示「这一口不下」。bite=玩家第几节（1 起算） */
function biteScore(bite){
  if(!bite)return null;
  if(bite<RIVAL_BITE.keep)return null;                  /* 咬完玩家剩得太少，太狠 */
  if(S.body.length-bite<RIVAL_BITE.gain)return null;     /* 咬掉的不到 3 节，不够本 */
  if(S.steps<RIVAL_BITE.warm)return null;               /* 开局先追一会儿，别一出生就同归于尽 */
  return RIVAL_BITE.base-bite*RIVAL_BITE.decay+S.rnd()*2;
}
/* 本关蚀蛇会不会**抢食**（踩到方块就吃掉，玩家因此丢资源）。
   抢食模式恒开；主线关卡要显式标 feed:true（第 9 关「星屑之争」起）。 */
function feedOn(){return (!!(S.L.race&&RACE.on.feed)||!!S.L.feed)&&omniOn('feed');}
function stepRival(r){
  if(!r.alive)return;               /* 复活统一由 respawnRivals 处理 */
  /* 自由模式：刚从兽巢里往外爬的阶段 —— 头钉在巢口，身子一节一节往外挤。
     爬完这一截，巢塌陷成石林，这条蛇才开始正常活动。 */
  if(S.L.free&&r.emerge>0){
    const h0=r.body[0];
    r.body.push({x:h0.x,y:h0.y,px:h0.x,py:h0.y});
    r.emerge--;
    if(r.emerge<=0&&r.nest){
      S.cells[idx(r.nest.x,r.nest.y)]={k:'wall'};
      pushEvent('nest',r.nest.x,r.nest.y,'🪨 兽巢塌成石林');
      r.nest=null;
    }
    return;
  }
  /* 决斗模式每一步都调 duelStepRival（不再是「每 2 步一格」），由它内部的相位累加器
     按速度档换算走几格：常态 0.8× → 每步 0.8 格（隔一拍才走满，是它的自然节奏）；
     突进 1.5× → 隔步多走一格；瘦身 2.8× → 一步多格。
     ⚠ 常态不足 1 格/步也没关系 —— 停滞判定按速度推算阈值（duelIdleAllow），
     隔拍移动不会被误判成装死。 */
  if(S.L.duel){duelStepRival(r);return;}
  /* 第 21 关「魔术蛇」：两条蛇各自一套 AI，都比 duelStepRival 轻得多。
     ⚠ 为什么不复用 duelStepRival：那套是为「单条蛇围杀玩家」写的，依赖 DUEL.* 十几个常量，
     而且它假设场上只有一条蛇。这里要的只是「追人 + 吃饭 + 别自杀」，
     基于 stepRival 加两个权重更划算，也不会把 DUEL 的语义带进来。 */
  if(magicOn()){magicRivalMove(r);return;}
  const h=r.body[0],t=headOf();
  const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!(d[0]===-r.dir[0]&&d[1]===-r.dir[1]));
  /* 第 15 关「噬魂魔蛇」：它是猎物 —— 玩家在附近就逃，否则埋头吃分。
     目标在循环外算一次（每个方向都全图扫一遍太浪费）。 */
  const soulFood=soulOn()?nearestFoodFrom(h):null;
  const soulFlee=soulOn()&&(Math.abs(h.x-t.x)+Math.abs(h.y-t.y))<=SOUL.FLEE;
  let best=null,bestScore=-1e9,bestBite=0;
  for(const d of opts){
    let nx=h.x+d[0],ny=h.y+d[1];
    if(!inB(nx,ny)){if(!S.L.wrap)continue;const w2=wrapXY(nx,ny);nx=w2[0];ny=w2[1];}
    const c=S.cells[idx(nx,ny)];
    if(c&&c.k==='wall')continue;
    let hit=false;
    for(const p of r.body)if(p.x===nx&&p.y===ny)hit=true;
    if(hit)continue;
    /* 玩家身上第几节？0=不是身体，1..n-1=身体。咬头（第 0 节）不算，那是玩家自己撞上来的事 */
    let bite=0;
    for(let i=1;i<S.body.length;i++)if(S.body[i].x===nx&&S.body[i].y===ny){bite=i;break;}
    let sc=biteScore(bite);
    /* 第 15 关的蚀蛇**永远不下口咬人** —— 它是猎物，不是猎手（见 SOUL 处注释）。
       撞头会死是玩家自己撞上去的，不是它主动攻击。 */
    if(soulOn())sc=null;
    if(bite&&sc===null)continue;                        /* 是身体但这一口不下：按障碍处理 */
    if(sc===null){
      if(bodyHas(nx,ny))continue;                       /* 头/不合格咬点：仍然不可走 */
      const dist=Math.abs(nx-t.x)+Math.abs(ny-t.y);
      sc=-dist+(S.rnd()*3);
      /* 玩法 4：抢食模式 / 第 9 关起标了 feed 的主线关，它优先抢方块。
         注意这个加成不能挂在「离玩家多近」上 —— 玩家跑远之后它就该去抢食，
         所以这里一律给一块「值 30 分距离」的加成，只有蛇头紧贴方块时才反而离开（去咬人）。 */
      if(feedOn()&&c&&c.k==='block'){
        const pd=Math.abs(nx-t.x)+Math.abs(ny-t.y);
        sc+=pd>=5?30:4;
      }
      /* 第 15 关：**见人就逃，其余时间抓紧吃分**（主公定的规则）。
         · 逃跑权重（×3）故意压过觅食权重（×2）—— 手段不能压过目的：
           被玩家逼近时必须先保命，否则「狩猎」就没有博弈感了。
         · 踩到负数块额外 +14：它要真的奔着吃的去，而不是在食物旁边晃。
           ⚠ 场上只有 neg（blocks:0），所以这里判的是 'neg' 不是 'block'。 */
      if(soulOn()){
        const fd=soulFood?Math.abs(nx-soulFood.x)+Math.abs(ny-soulFood.y):99;
        /* ⚠ 逃跑用**欧氏距离**而不是曼哈顿：玩家在正左方时，「往上走」和「往右走」
           的曼哈顿距离可能完全一样（都是 4），评分打平后随机选，于是蛇会 50% 概率
           横着蹭到玩家脸上 —— 实测「距离 3 → 1」，看着像没逃。欧氏距离(3 vs 2.24)
           才能把「真的背对玩家」区分出来。 */
        const pdx=nx-t.x,pdy=ny-t.y;
        const pd2=Math.sqrt(pdx*pdx+pdy*pdy);
        sc=(soulFlee?pd2*3:-fd*2)+(S.rnd()*3)+((c&&c.k==='neg')?14:0);
      }
    }
    if(sc>bestScore){bestScore=sc;best={nx,ny,dir:d};bestBite=bite;}
  }
  if(!best){r.alive=true;return;}
  r.dir=best.dir;
  const moved={x:best.nx,y:best.ny,px:h.x,py:h.y};
  r.body.unshift(moved);
  /* 尾巴规则与玩家同构：**有待长信贷就免剪尾并消耗 1 点**，没有才正常缩尾。
     ⚠⚠ 早先这里是无条件 `r.body.pop()` —— 于是第 15 关「蚀蛇吞下 -5（待长 5）」的字幕
     刷得欢，长度却纹丝不动（主公实测：「蚀蛇吃减分不变长」）。
     根因是 duel 模式那条路（duelStepRival）早就有这段兑现逻辑，而**主线关这条漏了** ——
     同一件事写在两处，就必然会漏一处。 */
  if((r.grow||0)>0)r.grow--;
  else r.body.pop();
  /* 蚀蛇踩到方块就把它吃了 —— 玩家因此丢了资源 */
  if(feedOn())rivalFeed(r);
  /* 咬中：咬点之后的整条身子都没了，蚀蛇自己也活不成（虚化时咬不到） */
  if(bestBite&&!CHEAT.ghost&&S.invT<=0){      /* 起步无敌期内也不许被咬 */
    const before=S.body.length;
    S.body.length=bestBite;S.combo=0;S.grow=0;
    S.events.push({type:'bite',x:best.nx,y:best.ny,
      text:'🐍 被咬断 '+(before-bestBite)+' 节！',t:S.steps});
    killRival(r,before-bestBite);   /* 自由模式：兽巢记住这一口咬掉了多少 */
  }
  return best;
}

/* ---------- 第 21 关「魔术蛇」：本体分裂 + 互换位置 ----------
   ⚠⚠ 分裂算法是全案最容易被写错的一处，三个坑都在这里：
   ① **后半截必须反转**。原 body 是「头在前、尾在后」的顺序，尾巴要变成新头，
      就得把 slice 出来的那半段 reverse —— 不反转的话「新头」长在原来尾巴的位置
      却朝着原来的方向，第一步就撞自己的身体。
   ② **px/py 要按反转后的相邻节重排**。渲染靠 px/py 做插值，直接沿用旧值会让
      新蛇的每一节都从同一个旧坐标滑出来，视觉上是一条蛇「炸开」。
   ③ **本体要有分裂保护期**（SPLIT_MIN）。否则它连吃两个负数，长度从 13 冲到 18，
      同一拍内两次越过 SPLIT_AT，场上凭空多出两条蛇 —— 难度曲线就断了。 */
function magicOn(){return !!S.L.magic;}
function isMom(r){return r&&r.alive&&r.role==='mom';}
function isKid(r){return r&&r.alive&&r.role==='kid';}
/* 本体分裂：返回新建的那条分身（失败返回 null）。
   total = 本体的「实际总长」= body.length + grow（调用方算好传进来，
   因为增长是信贷模型，只看 body.length 会漏判）。 */
function splitMom(total){
  const mom=S.rivals.find(isMom);
  if(!mom)return null;
  const len=mom.body.length;
  const at=S.L.SPLIT_AT||12,min=S.L.SPLIT_MIN||7;
  /* 保护期：刚分裂过的本体要长回 SPLIT_MIN 才允许再分裂 */
  const real=total||(len+(mom.grow||0));
  if(real<at||real<min)return null;
  /* ⚠⚠ 把「待长信贷」也一并劈开：只按 body.length 对半切的话，
     本体身上挂着的几十点 grow 会整份留给本体，分身一出生就是「0 节 + 0 待长」，
     视觉上是一条极短的蛇 —— 而且本体下一拍就把它全长回来，等于没分裂。 */
  const half=real>>1;
  /* 先把 grow 兑现成真实的节数（往尾巴上一节节接出来），再对半切 */
  let g=mom.grow||0;
  const tail=mom.body[len-1];
  let bx=tail.x,by=tail.y;
  /* 延伸方向：沿「尾→头」的反方向（尾巴外侧） */
  const ex=mom.body[0].x-tail.x,ey=mom.body[0].y-tail.y;
  if(ex===0&&ey===0){/* 三节叠一起时按 dir 兜底 */}
  while(g>0){
    bx-=ex;by-=ey;
    if(!inB(bx,by)||S.cells[idx(bx,by)]||bodyHas(bx,by))break;
    mom.body.push({x:bx,y:by,px:bx,py:by});
    g--;
  }
  mom.grow=0;
  const now=mom.body.length;
  const cut=Math.max(1,now>>1);
  const momBody=mom.body.slice(0,cut);
  const kidBody=mom.body.slice(cut).reverse();   /* 后半截反转：原尾变新头 */
  for(let i=0;i<momBody.length;i++){const p=momBody[i];p.px=(momBody[i-1]||p).x;p.py=(momBody[i-1]||p).y;}
  for(let i=0;i<kidBody.length;i++){const p=kidBody[i];p.px=(kidBody[i-1]||p).x;p.py=(kidBody[i-1]||p).y;}
  mom.body=momBody;
  const kid={alive:true,role:'kid',body:kidBody,
    dir:[-mom.dir[0],-mom.dir[1]],
    respawn:0,grow:0,starve:0,lastEat:S.steps,acc:0,spd:1,burn:0,choke:0,doomed:0,turnCd:-999,
    swapCd:(S.L.SWAP_CD||26)};
  S.rivals.push(kid);
  S.magicSplits=(S.magicSplits||0)+1;
  S.events.push({type:'split',x:kidBody[0].x,y:kidBody[0].y,t:S.steps,
    text:'✂️ 本体分裂：分身 '+kidBody.length+' 节（场上 '+S.rivals.filter(r=>r.alive).length+' 条）'});
  return kid;
}
/* 互换位置：两条蛇整体互换 body 与 dir，语义同第 19 关传送门（**方向各自保持**）。
   ⚠ 必须做合法性校验：换过去会出界、撞墙、或压到对方身体，就放弃这次换位 ——
     不然一次换位直接判死一条蛇，玩家会觉得「游戏乱来」。 */
function swapMomKid(){
  const mom=S.rivals.find(isMom),kid=S.rivals.find(isKid);
  if(!mom||!kid)return false;
  if((kid.swapCd||0)>0)return false;
  /* 换过去之后各自的头是否合法 */
  const okHead=(r)=>{
    const h=r.body[0];
    if(!inB(h.x,h.y))return false;
    const c=S.cells[idx(h.x,h.y)];
    if(c&&(c.k==='wall'||c.k==='rot'))return false;
    return true;
  };
  const tb=mom.body,td=mom.dir;
  mom.body=kid.body;mom.dir=kid.dir;
  kid.body=tb;kid.dir=td;
  if(!okHead(mom)||!okHead(kid)||bodyOverlap(mom)||bodyOverlap(kid)){
    /* 不合法就换回来，这次当作没发生 */
    const tb2=mom.body,td2=mom.dir;
    mom.body=kid.body;mom.dir=kid.dir;
    kid.body=tb2;kid.dir=td2;
    return false;
  }
  kid.swapCd=S.L.SWAP_CD||26;
  S.magicSwaps=(S.magicSwaps||0)+1;
  const h=mom.body[0];
  S.events.push({type:'swap',x:h.x,y:h.y,t:S.steps,
    text:'🌀 本体与分身易位（第 '+S.magicSwaps+' 次）'});
  return true;
}
/* 一条蛇的身体有没有自相重叠（换位后要查） */
function bodyOverlap(r){
  const seen=new Set();
  for(const p of r.body){const k=p.y*S.w+p.x;if(seen.has(k))return true;seen.add(k);}
  return false;
}
/* ---------- 两条蛇相撞 → 合并（主公 2026-10-14 定）----------
   规则：短的那条**逐节进入**长的身体，几拍内完成；合并后长蛇变更长。
   ⚠ 「慢慢进入」不是瞬时的：一次性把短蛇的节全塞进长蛇尾巴，
     视觉上就是凭空多出一截（主公明确否掉了「凭空刷新」那种观感）。
     所以用 `r.merge` 状态机：每拍搬 1 节，搬完短蛇才消失。
   ⚠ 本体不参与合并（它是老大，不能被吞也不能吞别人）。
   ⚠ 合并后长蛇获得 MERGE_COOL 拍的「分裂冻结」—— 否则会出现
     「合并变长 → 立刻分裂 → 再合并」的无限循环，场上蛇数失控。 */
function tryKidMerge(r){
  if(!isKid(r))return false;
  if((r.merge||0)>0){r.merge--;return false;}       /* 正在被合并中：不重复触发 */
  const h=r.body[0];
  /* 找撞上的另一个分身（头对头，或头落在对方身体上） */
  for(const o of S.rivals){
    if(o===r||!isKid(o)||(o.merge||0)>0)continue;
    let hit=false;
    for(const p of o.body)if(p.x===h.x&&p.y===h.y){hit=true;break;}
    if(!hit)continue;
    /* 谁长谁吞：短的那条进入长的身体 */
    const a=r.body.length>=o.body.length?o:r;       /* a = 短的（被吞） */
    const b=r.body.length>=o.body.length?r:o;       /* b = 长的（接收） */
    if(a.body.length<2)continue;                    /* 只有 1 节的没意义，直接让它消失 */
    /* 合并方向：把 a 的节从**它的头开始**一节节搬到 b 的**尾巴后面**，
       这样视觉上就是「短蛇钻进了长蛇的身体」。 */
    a.merge=a.body.length;                          /* 还要搬几拍 */
    a.mergeInto=b;
    S.magicMerges=(S.magicMerges||0)+1;
    S.events.push({type:'merge',x:h.x,y:h.y,t:S.steps,
      text:'🔗 分身相撞，短者正并入长者（'+a.body.length+' 节）'});
    return true;
  }
  return false;
}
/* 每拍推进合并：搬 1 节过去 */
function mergeStep(){
  if(!magicOn())return;
  for(const r of S.rivals){
    if(!isKid(r)||(r.merge||0)<=0||!r.mergeInto)continue;
    const b=r.mergeInto;
    if(!b.alive){r.merge=0;r.mergeInto=null;continue;}
    /* 从 r 的头部取一节，接到 b 的尾巴后面（沿 b 的「尾→头」方向继续退一格）。
       ⚠⚠ 方向必须用**相邻两节的实际差**（倒数第 2 节 - 末节），不能用「头 - 尾」——
       蛇身会折返（头尾的连线方向跟实际走向完全无关），用头尾差会算出 (20,14)
       这种跳格坐标，新节和身体脱节，下一拍就判自咬（实测踩过）。 */
    const n=b.body.length;
    const tail=b.body[n-1],prev=b.body[n-2]||b.body[0];
    let ex=prev.x-tail.x,ey=prev.y-tail.y;
    if(ex===0&&ey===0){ex=b.dir[0];ey=b.dir[1];}
    const nx=tail.x-ex,ny=tail.y-ey;
    /* ⚠⚠ 搬完节**先不减 merge**：早先是「搬一节 → merge-- → 判 merge<=0 收尾」，
       结果 2 节的短蛇只搬了 1 节就收工（第 2 节永远留在场上，成了一条 1 节僵尸蛇）。
       正确顺序：搬 → 判短蛇是否空了 → 空了才收尾并递减。 */
    if(inB(nx,ny)&&!S.cells[idx(nx,ny)]&&!bodyHas(nx,ny)){
      b.body.push({x:nx,y:ny,px:nx,py:ny});
      r.body.shift();                              /* 短蛇的头节被搬走了 */
    }
    if(r.body.length===0){
      r.merge=0;r.mergeInto=null;
      r.alive=false;r.body=[];
      /* ⚠ 坐标必须取**接收方尾部**：此刻 r.body 已空，早先写死的 (0,0)
         会让「合流完成」四个字飘在地图左上角。 */
      const tb=b.body[b.body.length-1]||b.body[0]||{x:0,y:0};
      S.events.push({type:'mergedone',x:tb.x,y:tb.y,t:S.steps,text:'🔗 合流完成'});
    }else{
      r.merge--;
    }
  }
}
/* 每拍推进魔术蛇：分裂检查 + 换位冷却 + 合并推进 */
function magicStep(){
  if(!magicOn())return;
  mergeStep();                                     /* 先搬合并的节，再判分裂 */
  /* 本体够长就分裂（放在 rivalFeed 之后调用，那里刚兑现完增长）。
     ⚠⚠ 判定必须用 **len + grow**（总长），不能只看 body.length：
        增长是信贷模型（吃 −N 记 N 点待长，之后每步兑现 1 点），
        本体连吃几个负数时 grow 会堆到几十，而 body 还停在原地 ——
        只看 body.length 会让它「吃了半天的粮却永远不分裂」（实测 grow=149、body=11）。
     ⚠ 合并冻结（mergeCool）：刚吞并过别的蛇就不许立刻分裂，
       防「合并变长→分裂→再合并」无限循环。 */
  const mom=S.rivals.find(isMom);
  if(mom&&(mom.mergeCool||0)<=0){
    const total=mom.body.length+(mom.grow||0);
    const at=S.L.SPLIT_AT||12,min=S.L.SPLIT_MIN||10;
    if(total>=at&&total>=min)splitMom(total);
  }
  for(const r of S.rivals){
    if(r.swapCd>0)r.swapCd--;
    if(r.mergeCool>0)r.mergeCool--;
  }
}
/* 魔术蛇时钟（浏览器段每帧调；node 里由测试显式推进） */
function tickMagic(dt){
  if(!S||!S.L.magic)return;
  S.magicT=(S.magicT||0)+(dt||0)/1000;
}

/* ---------- 第 21 关「魔术蛇」的两条蛇 AI ----------
   母：吃方块长大（FOOD，权重压过追人）+ 追玩家（CHASE）。
   ⚠⚠ FOOD 必须**明显大于** CHASE × 典型距离：主公 2026-10-14 实测「本体不主动去吃分」——
      根因是 FOOD=14 而 `-欧氏距离×2.0` 在距离 7 格时就值 14，两者打平后随机漂移，
      蛇看起来就在原地打转。现在 FOOD=26，且「靠近食物」按距离线性给分，
      保证它真的奔着方块去。只有吃得够多才会分裂，这模式才成立。
   分身：缠玩家但强度低一档（KID_CHASE < CHASE），另外负责**触发换位**
      （玩家离本体够近时，两条蛇对调 —— 玩家眼前的蛇突然变成分身）。 */
function magicRivalMove(r){
  const h=r.body[0],t=headOf();
  const mom=r.role==='mom';
  const chaseW=mom?(S.L.CHASE||1.5):(S.L.KID_CHASE||1.2);
  /* 换位判定：只有分身发起，且玩家离**本体**够近 ——
     这样换位才有战术意义（把母送到玩家嘴边 / 把它从玩家嘴边拉开）。 */
  if(!mom){
    const m=S.rivals.find(isMom);
    if(m){
      const d=Math.abs(m.body[0].x-t.x)+Math.abs(m.body[0].y-t.y);
      if(d<=(S.L.SWAP_RANGE||5)&&(r.swapCd||0)<=0)swapMomKid();
    }
  }
  /* 合并判定：分身之间相撞 → 短的那个慢慢进入长的身体。
     ⚠ 只有「分身 vs 分身」才合并；本体不参与（它是老大，不能被吞）。 */
  if(!mom)tryKidMerge(r);
  const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!(d[0]===-r.dir[0]&&d[1]===-r.dir[1]));
  /* 找最近的方块（蛇的粮）—— 每个方向都全图扫一遍太浪费，循环外算一次。
     ⚠ 中立化之后**正数也是粮**（主公 10-14 改的），所以不能再只扫 neg。 */
  let food=null,fd=1e9;
  if(mom){
    for(let i=0;i<S.cells.length;i++){
      const c=S.cells[i];
      if(c&&(c.k==='block'||c.k==='neg')){
        const x=i%S.w,y=(i/S.w)|0;
        const d=Math.abs(x-h.x)+Math.abs(y-h.y);
        if(d<fd){fd=d;food={x:x,y:y};}
      }
    }
  }
  let best=null,bestScore=-1e9;
  for(const d of opts){
    let nx=h.x+d[0],ny=h.y+d[1];
    if(!inB(nx,ny)){if(!S.L.wrap)continue;const w2=wrapXY(nx,ny);nx=w2[0];ny=w2[1];}
    const c=S.cells[idx(nx,ny)];
    if(c&&c.k==='wall')continue;
    if(c&&c.k==='rot')continue;                  /* 腐地也绕开（虽然这模式没配 rot） */
    let hit=false;
    for(const p of r.body)if(p.x===nx&&p.y===ny)hit=true;
    if(hit)continue;
    /* 压到另一个分身也算障碍（合并由 tryKidMerge 单独处理，不走普通移动） */
    for(const o of S.rivals){
      if(o===r||!o.alive)continue;
      for(const p of o.body)if(p.x===nx&&p.y===ny)hit=true;
    }
    if(hit)continue;
    /* 玩家身体：咬上去就吃掉一截（主公 2026-10-14 定的规则）。
       ⚠ 咬完自己也要退场（一命换一截，同主线规则）—— 不让它无限咬，
         否则玩家再长也会被磨死。走 killRival 但不落兽巢（魔术蛇没有巢）。 */
    let bite=0;
    for(let i=1;i<S.body.length;i++)if(S.body[i].x===nx&&S.body[i].y===ny){bite=i;break;}
    if(bite&&S.invT<=0&&!CHEAT.ghost&&S.body.length-bite>=3){
      const before=S.body.length;
      S.body.length=bite;S.combo=0;S.grow=0;
      S.events.push({type:'bite',x:nx,y:ny,
        text:'🐍 被啃去 '+(before-bite)+' 节',t:S.steps});
      killRival(r,0);
      r.alive=false;r.body=[];
      return null;                     /* 这一拍它已经撞上玩家并退场，不再移动 */
    }
    /* ⚠ 用**欧氏距离**而不是曼哈顿：玩家在正左方时「往上」和「往右」的曼哈顿距离
       可能完全一样，评分打平后随机选，蛇会 50% 概率横着蹭到玩家脸上。 */
    const pdx=nx-t.x,pdy=ny-t.y;
    let sc=-Math.sqrt(pdx*pdx+pdy*pdy)*chaseW+(S.rnd()*3);
    /* 方块是粮（中立）：靠近就按距离线性加分，踩到再给一笔大的 —— 要真的奔着吃的去。
       ⚠⚠ 2026-10-14 主公实测「本体不主动去吃分」，根因是这里的梯度太弱：
         早先只有「踩到那一格 +26」和「朝食物靠近 −1.4×距离」，而追人是 −2.0×距离，
         两边一抵，食物那侧永远追不上 —— 200 步一颗没吃到（实测）。
         现在 FOOD 本身就是「靠近食物」的线性权重（3.2），**明显大于** CHASE，
         保证蛇在「吃饭」和「咬你」之间优先选吃饭。 */
    if(mom&&food){
      const fdx=nx-food.x,fdy=ny-food.y;
      sc-=Math.sqrt(fdx*fdx+fdy*fdy)*(S.L.FOOD||3.2);
      if(c&&(c.k==='block'||c.k==='neg'))sc+=30;    /* 踩到那一格再给一笔 */
    }
    /* 别贴墙：给一点「离边界远更好」的偏好，减少开局卡死 */
    const edge=Math.min(nx,ny,S.w-1-nx,S.h-1-ny);
    sc+=Math.min(edge,3)*2;
    if(sc>bestScore){bestScore=sc;best={nx:nx,ny:ny,dir:d};}
  }
  if(!best){r.alive=true;return;}
  r.dir=best.dir;
  const moved={x:best.nx,y:best.ny,px:h.x,py:h.y};
  r.body.unshift(moved);
  /* 尾巴规则与玩家同构：有待长信贷就免剪尾并消耗 1 点（本体吃负数就靠这个变长） */
  if((r.grow||0)>0)r.grow--;
  else r.body.pop();
  /* 踩到方块就吃（本体的粮；正数对它来说是毒，走 rivalFeed 的 duel 分支） */
  if(feedOn()||magicOn())rivalFeed(r);
}

/* ---------- 结算 ---------- */
/* 三星阈值每关单独写死 —— 早先按「目标分 ×1.35 / ×1.75」算，
   会算出比这关实际天花板还高的三星，永远拿不到。 */
function starOf(score,L){
  /* ⚠ 第 16 关「作减求空」的存档里存的**不是分数，是最短步数**（越小越好）——
     所以它的星级判据是反的：`score<=s2` 才加星，而不是 >=。
     这关没有目标分可言（归零即胜），拿分数评级会把「吃得越多越好」的错误方向固化进去。 */
  if(L.void)return score>0?(1+(score<=L.s2?1:0)+(score<=L.s3?1:0)):0;
  return 1+(score>=(L.s2||Math.round(L.target*1.4))?1:0)+(score>=(L.s3||Math.round(L.target*1.8))?1:0);
}
/* 关卡模式看分数进度；自由模式看化龙进度；抢食模式看养分；
   决斗模式看「长度比 / 收口门槛(2×)」—— 到 100% 就意味着我有资格做陷阱了 */
function progress(){
  if(S.L.duel)return Math.min(1,duelRatio()/DUEL.TRAP_LINE);
  if(S.L.race)return Math.min(1,(S.nut||0)/RACE.NUT_MAX);
  if(S.L.free)return Math.min(1,S.body.length/dragonNeed());
  /* 第 16 关「作减求空」：进度条衡量**减掉了多少**（0 节 = 100%），
     不是分数 —— 这关吃正数反而加分，拿分数当进度会把方向指反。 */
  if(S.L.void){
    const start=(S.L.void&&S.L.void.startLen)||1;
    return Math.max(0,Math.min(1,1-S.body.length/start));
  }
  return Math.min(1,S.score/S.L.target);
}

/* 每步间隔。放逻辑段而不是浏览器段，是为了让「疾行」秘笈也能被 node 断言覆盖 */
function tickNow(){
  let base=S.L.tick;
  if(S.L.duel){
    /* 决斗：玩家速度固定，蚀蛇的快慢由它自己的速度倍率决定（见 duelStepRival） */
  }else if(S.L.free){
    /* 开局 SLOW 倍慢（跟吃到缓步一样），WARM 秒线性提速回正常 */
    const k=Math.min(1,S.freeT/FREE.WARM);
    base=S.L.tick*(FREE.SLOW-k*(FREE.SLOW-1));
  }else if(S.slowUntil>S.steps)base=S.L.tick*2;
  /* 抢食模式冲刺：速度提到约 2 倍（只影响自己，不影响蚀蛇的出手节奏） */
  if(S.L.race&&sprinting())base*=0.45;
  /* 时间减速（half）：双方同时半速。玩家侧表现为每步间隔 ×2；
     蚀蛇侧在 duelStepRival 里把相位推进速率减半 —— 两侧都要改才叫「时间减速」，
     只改玩家就是「我变慢了」而不是「时间变慢了」。 */
  if(CHEAT.rush)base=Math.max(24,Math.round(base*0.4));
  if(CHEAT.half)base=base*2;
  return Math.round(base);
}
/* 当前速度相对正常速度的百分比，HUD 用 */

  for(const c of S.body){if(c.px===undefined){c.px=c.x;c.py=c.y;}}
  /* 画布要同时装进「宽度」和「高度」。以前只按宽度算，正方形画布在矮屏上被溢出裁掉，
     地图最下面一两行就看不见了 —— 现在两边取小值再定格子大小。 */
  const avail=availH();
  const stageW=Math.min(stage.clientWidth-14,640);
  const cell=Math.max(9,Math.floor(Math.min(stageW,avail-12)/Math.max(S.w,S.h)));
  const cw=cell*S.w,ch=cell*S.h;
  CELL=cell;
  /* 舞台高度也由这里定死：它原本是 flex:0 1 auto，会被内容（正方形画布）撑开，
     而正方形在矮屏上必然超高，于是底部被裁。给它一个确定高度，画布在里面居中即可。 */
  const box=Math.min(ch+14,avail,window.innerHeight-CHROME);
  stage.style.height=Math.max(160,Math.round(box))+'px';
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',()=>{resize();if(S)render(1);});
/* 手机转屏 / 地址栏收起也会改变可用高度 */
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();if(S)render(1);},150));
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{resize();if(S)render(1);});

/* ================= 特效池 ================= */
const parts=[],floats=[],rings=[];
function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=.4+Math.random()*2.4;
    parts.push({x:(x+.5)*CELL,y:(y+.5)*CELL,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.6,
      life:1,col,sz:2+Math.random()*3.4});
  }
}
function ring(x,y,col){rings.push({x:(x+.5)*CELL,y:(y+.5)*CELL,life:1,col});}
function floatUp(x,y,text,col){floats.push({x:(x+.5)*CELL,y:(y+.5)*CELL,text,col,life:1});}

let shakeT=0,invFxAt=0;
function stepFx(dt){
  const f=dt/16.7;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=.12*f;p.vx*=.97;p.life-=.028*f;
    if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const t=floats[i];t.y-=.9*f;t.life-=.018*f;
    if(t.life<=0)floats.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=.05*f;if(rings[i].life<=0)rings.splice(i,1);}
  if(shakeT>0)shakeT-=dt;
}

/* ================= 绘制 ================= */
function rr(c,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);
  else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
  ctx.closePath();
}
function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){
  return 'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+')';
}
const SNAKE_HEAD=[124,255,196],SNAKE_TAIL=[74,150,255];
const HAZ_COL=[255,107,141],WALL_COL=[64,70,120],POW_COL=[255,209,102];

function lerpHex(h){ /* '#rrggbb' -> [r,g,b] */
  return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}

function render(alpha){
  if(!S)return;
  const W=S.w*CELL,H=S.h*CELL;
  ctx.clearRect(0,0,W,H);
  /* 地面 */
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#151a44');g.addColorStop(1,'#0e1130');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.045)';ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<=S.w;x++){ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,H);}
  for(let y=0;y<=S.h;y++){ctx.moveTo(0,y*CELL+.5);ctx.lineTo(W,y*CELL+.5);}
  ctx.stroke();
  /* 边界：穿越关卡画成虚线，普通关卡画成实心墙 */
  ctx.save();
  if(S.L.wrap){ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(196,162,255,.55)';}
  else ctx.strokeStyle='rgba(160,190,255,.35)';
  ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);ctx.restore();

  /* 毒雾（第 11 关「毒雾收束」）：外 N 圈整体压一层紫雾 + 画一道内边界线。
     ⚠ 这层必须画 —— 收束是**看不见的边界**，玩家不知道哪几格进去要掉肉，
       那就成了暗箭而不是机制。内边界线是「安全区」的可见轮廓。 */
  if(S.fogRing){
    const r=S.fogRing,ic=r*CELL;
    ctx.save();
    /* ⚠ 变量名别用 puls 开头：测试里有一条「稀有块脉动不许用 performance.now」的断言，
       它按 /const puls[^;]*performance\.now/ 扫全文，撞名会误报（我踩了一次）。 */
    const fogAlpha=0.16+0.06*Math.sin(performance.now()/600);
    ctx.fillStyle='rgba(150,80,220,'+fogAlpha.toFixed(3)+')';
    ctx.fillRect(0,0,W,ic);                       /* 上 */
    ctx.fillRect(0,(S.h-r)*CELL,W,ic);            /* 下 */
    ctx.fillRect(0,ic,ic,(S.h-2*r)*CELL);         /* 左 */
    ctx.fillRect((S.w-r)*CELL,ic,ic,(S.h-2*r)*CELL); /* 右 */
    ctx.strokeStyle='rgba(206,138,255,.7)';ctx.lineWidth=2;
    ctx.strokeRect(ic+1,ic+1,(S.w-2*r)*CELL-2,(S.h-2*r)*CELL-2);
    ctx.restore();
  }

  const bob=Math.sin(performance.now()/420)*0.6;

  /* 墙 / 方块 / 危险块 / 道具 */
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    const c=S.cells[idx(x,y)];if(!c)continue;
    if(fogOn()&&!seenAt(x,y))continue;   /* 第 14 关：没探索过的格子里有什么，一律不画 */
    const px=x*CELL,py=y*CELL;
    if(c.k==='wall'){
      rr(ctx,px+1.5,py+1.5,CELL-3,CELL-3,Math.min(6,CELL*0.22));
      ctx.fillStyle=mix(WALL_COL,[110,120,190],.25);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();
    }else if(c.k==='hazard'){
      const s=CELL-4;
      rr(ctx,px+2,py+2,s,s,Math.min(7,CELL*0.26));
      ctx.fillStyle='rgba(255,70,105,.28)';ctx.fill();
      ctx.strokeStyle=mix(HAZ_COL,[255,180,190],.2);ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#ffd7e0';ctx.font='900 '+Math.round(CELL*.52)+'px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('-'+c.v,px+CELL/2,py+CELL/2+bob*.2);
    }else if(c.k==='neg'){
      /* 负数（决斗模式）：蚀蛇的粮、你的毒 —— 必须画出来。
         配色刻意与 hazard 的粉红拉开（紫 + 蜂窝纹），两者效果不同不能混：
         hazard 扣你长度，neg 扣你长度**并且**断蚀蛇一餐。 */
      const s=CELL-4;
      rr(ctx,px+2,py+2,s,s,Math.min(7,CELL*0.26));
      ctx.fillStyle='rgba(122,52,168,.34)';ctx.fill();
      ctx.strokeStyle='rgba(206,138,255,.9)';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#f2e2ff';ctx.font='900 '+Math.round(CELL*.52)+'px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('-'+c.v,px+CELL/2,py+CELL/2+bob*.2);
    }else if(c.k==='power'){
      const col=POWERS[c.p]?POWERS[c.p].icon:'❔';
      const s=CELL-4;
      rr(ctx,px+2,py+2,s,s,s/2);
      const rg=ctx.createLinearGradient(px,py,px+CELL,py+CELL);
      rg.addColorStop(0,'rgba(255,230,150,.95)');rg.addColorStop(1,'rgba(255,180,90,.85)');
      ctx.fillStyle=rg;ctx.fill();
      ctx.font=Math.round(CELL*.56)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#4a2c00';ctx.fillText(col,px+CELL/2,py+CELL/2+1);
    }else if(c.k==='nest'){
      /* 兽巢：蚀蛇咬断玩家后留下的洞，下次照记着的节数从这里爬出来 */
      const s=CELL-4;
      rr(ctx,px+2,py+2,s,s,s/2);
      ctx.fillStyle='rgba(48,16,66,.9)';ctx.fill();
      ctx.strokeStyle='rgba(206,138,255,'+(0.45+0.3*Math.sin(performance.now()/300))+')';
      ctx.lineWidth=2;ctx.stroke();
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#e9d5ff';ctx.font='900 '+Math.round(CELL*.44)+'px system-ui,sans-serif';
      ctx.fillText('🕳',px+CELL/2,py+CELL/2);
      ctx.fillStyle='#d8b4ff';ctx.font='900 '+Math.round(CELL*.3)+'px system-ui,sans-serif';
      ctx.fillText(String(c.len||0),px+CELL/2,py+CELL/2+CELL*.29);
    }else if(c.k==='block'){
      const rare=c.rarity?RARE.COL[c.rarity]:null;   /* 稀有块：6/7/8 各有专属配色 */
      const base=rare?rare.mid:lerpHex(BLK_COL[Math.min(c.v,BLK_COL.length)-1]||BLK_COL[0]);
      const s=CELL-4-bob;
      const off=(CELL-s)/2;
      const gold=!!c.gold,rot=!!c.rot;
      rr(ctx,px+off,py+off,s,s,Math.min(8,CELL*0.28));
      const rg=ctx.createLinearGradient(px,py,px,py+CELL);
      if(rare){ /* 稀有块：三段饱和渐变，比普通粉彩块艳一个档 */
        rg.addColorStop(0,'rgb('+rare.hi+')');
        rg.addColorStop(.5,'rgb('+rare.mid+')');
        rg.addColorStop(1,'rgb('+rare.lo+')');
      }else if(gold){ /* 玩法 2：金色 = 3 倍分、不长身 */
        rg.addColorStop(0,'#fff3c4');rg.addColorStop(.5,'#ffd166');rg.addColorStop(1,'#e79a1f');
      }else if(rot){ /* 玩法 1：临期 = 双倍分，颜色转枯、带裂纹与倒计时 */
        rg.addColorStop(0,mix(base,[120,120,110],.55));rg.addColorStop(1,mix(base,[40,36,50],.55));
      }else{
        rg.addColorStop(0,mix(base,[255,255,255],.35));rg.addColorStop(1,mix(base,[60,40,90],.15));
      }
      ctx.fillStyle=rg;ctx.fill();
      ctx.strokeStyle=rare?rare.glow:(gold?'rgba(255,255,255,.9)':(rot?'rgba(255,190,120,.7)':'rgba(255,255,255,.5)'));
      ctx.lineWidth=rare?2.2:(gold?2:(rot?1.6:1.4));ctx.stroke();
      /* ---------- 稀有块的闪光特效 ---------- */
      if(rare){
        /* ① 外辉光：脉动 halo，数字越大越强（8 最烫）。步进用 S.steps 不用
           performance.now —— 快照渲染（renderAll/S.lod）下必须确定性，否则回放会跳。 */
        const t=(S.steps||0)*0.06;
        const puls=0.55+0.45*Math.sin(t+c.rarity);
        /*辉光半径按格子缩放：固定 10px 在小格（~28px）上会把整格糊住、
           大格上又显得微弱 —— 用 s 的比例才在任何缩放下都「刚好亮一圈」。 */
        ctx.save();
        ctx.shadowColor=rare.glow;ctx.shadowBlur=s*(0.34+puls*0.46);
        ctx.strokeStyle=rare.glow;ctx.lineWidth=Math.max(1.5,s*0.07);
        ctx.globalAlpha=0.40+0.45*puls;
        rr(ctx,px+off-s*0.09,py+off-s*0.09,s*1.18,s*1.18,Math.min(10,CELL*0.34));
        ctx.stroke();
        ctx.restore();
        /* ② 星芒：四条放射线，随脉动伸缩 */
        ctx.save();
        ctx.globalAlpha=0.55+0.45*puls;
        ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=Math.max(1.2,s*0.055);
        const cxp=px+CELL/2,cyp=py+CELL/2,rl=s*0.46+puls*s*0.13;
        ctx.beginPath();
        ctx.moveTo(cxp,cyp-rl);ctx.lineTo(cxp,cyp+rl);
        ctx.moveTo(cxp-rl,cyp);ctx.lineTo(cxp+rl,cyp);
        ctx.stroke();
        ctx.restore();
        /* ③ 四角亮片（与金色块同款语言，但更亮） */
        ctx.fillStyle='rgba(255,255,255,.95)';
        const q=s*0.12;
        ctx.fillRect(px+off+s*.14,py+off+s*.14,q,q);
        ctx.fillRect(px+off+s*.73,py+off+s*.73,q,q);
        ctx.fillRect(px+off+s*.73,py+off+s*.14,q,q);
        ctx.fillRect(px+off+s*.14,py+off+s*.73,q,q);
      }
      if(rot){      /* 裂纹 */
        ctx.strokeStyle='rgba(30,20,10,.5)';ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(px+off+s*.22,py+off+s*.16);ctx.lineTo(px+off+s*.52,py+off+s*.55);
        ctx.lineTo(px+off+s*.34,py+off+s*.86);
        ctx.moveTo(px+off+s*.52,py+off+s*.55);ctx.lineTo(px+off+s*.86,py+off+s*.34);
        ctx.stroke();
      }
      if(gold){     /* 四角小亮片，远看也能一眼认出来 */
        ctx.fillStyle='rgba(255,255,255,.85)';
        const q=s*.13;
        ctx.fillRect(px+off+s*.16,py+off+s*.16,q,q);
        ctx.fillRect(px+off+s*.71,py+off+s*.71,q,q);
      }
      ctx.fillStyle=rare?'#ffffff':(gold?'#4a2c00':(rot?'rgba(255,235,210,.95)':'rgba(40,30,60,.9)'));
      ctx.font='900 '+Math.round(CELL*(rare?.56:.54))+'px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      if(rare){        /* 数字压一层深色描边，在艳色块上才够清晰 */
        ctx.lineWidth=2.4;ctx.strokeStyle='rgba(30,10,40,.55)';
        ctx.strokeText(String(c.v),px+CELL/2,py+CELL/2+1);
      }
      ctx.fillText(String(c.v),px+CELL/2,py+CELL/2+1);
      if(rot&&S.L.race){    /* 还剩几步腐坏 */
        const left=(c.born+RACE.ROT_STEPS+RACE.ROT_GIVE)-S.steps;
        ctx.fillStyle='rgba(255,190,120,.95)';
        ctx.font='900 '+Math.round(CELL*.3)+'px system-ui,sans-serif';
        ctx.fillText(String(Math.max(0,left)),px+CELL/2,py+off+s+CELL*.16);
      }
      /* 第 17 关「天坠」：正在往下掉的方块带一道拖尾 —— 一眼看出「它在动」，
         也提示玩家它马上要落地消失了（落到底等下一次重力就清掉）。
         ⚠ 拖尾画在**上方**：方块是往下掉的，尾迹应该留在它来的方向。
         第一版画在了下方，看着像方块在往上飞（主公实测指出）。 */
      if(c.fall&&!c.fallen){
        const tg=ctx.createLinearGradient(0,py,0,py-CELL*0.9);
        tg.addColorStop(0,'rgba(255,255,255,.30)');tg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=tg;ctx.fillRect(px+CELL*.32,py-CELL*0.9,CELL*.36,CELL*.9);
      }
    }else if(c.k==='rot'){
      /* 腐地（第 18 关）：褐紫腐败斑。⚠ 三种「踩了要吃亏」的东西必须一眼分得清：
         hazard 是粉红、neg 是蜂窝紫、rot 是褐黄腐败斑。 */
      rr(ctx,px+1,py+1,CELL-2,CELL-2,Math.min(5,CELL*0.16));
      ctx.fillStyle='rgba(72,50,36,.88)';ctx.fill();
      ctx.fillStyle='rgba(126,88,40,.55)';
      ctx.fillRect(px+CELL*.24,py+CELL*.26,CELL*.2,CELL*.17);
      ctx.fillRect(px+CELL*.56,py+CELL*.5,CELL*.24,CELL*.18);
      ctx.fillRect(px+CELL*.3,py+CELL*.66,CELL*.16,CELL*.13);
      ctx.strokeStyle='rgba(198,142,72,.5)';ctx.lineWidth=1;ctx.stroke();
    }
  }

  /* 落石（第 13 关）：画在方块之上、蛇之下 —— 它是实体障碍，必须压过方块。
     ⚠ 悬停中的石块加一圈**脉动的暖黄描边**：那是「它压在障碍上、快碎了」的信号，
        不画出来玩家会以为卡住了。 */
  if(S.rocks&&S.rocks.length){
    const rkPh=0.5+0.5*Math.sin(performance.now()/260);
    for(const rk of S.rocks){
      for(const s of rk.sh){
        const x=rk.x+s[0],y=rk.y+s[1];
        if(y<0||y>=S.h||x<0||x>=S.w)continue;     /* 还在天上 / 已出界的部分不画 */
        const px=x*CELL,py=y*CELL;
        rr(ctx,px+1.5,py+1.5,CELL-3,CELL-3,Math.min(5,CELL*0.18));
        const rg=ctx.createLinearGradient(px,py,px,py+CELL);
        rg.addColorStop(0,mix(ROCK_COL,[255,235,200],.32));
        rg.addColorStop(1,mix(ROCK_COL,[40,12,8],.3));
        ctx.fillStyle=rg;ctx.fill();
        ctx.strokeStyle=rk.hover>0?('rgba(255,225,130,'+(0.55+0.4*rkPh).toFixed(3)+')'):'rgba(255,175,125,.8)';
        ctx.lineWidth=rk.hover>0?2.4:1.5;ctx.stroke();
      }
    }
  }

  /* 暗夜迷雾（第 14 关）：没点亮的格子压一层浓雾。
     ⚠ 光在 cells 循环里 continue **不够** —— 地面网格线还在，玩家照样看得清整张图的轮廓，
        雾就没起到「看不见」的作用。这里再压一层近乎不透明的遮罩，把地面一起盖掉。
     ⚠ 遮罩画在**蚀蛇与蛇之前**：雾遮的是资源和地形，**威胁与你自己永远看得见** ——
        躲在雾里的蚀蛇等于凭空判死，那是不公平，不是难度。 */
  if(fogOn()&&!revealed()){
    ctx.save();
    ctx.fillStyle='rgba(9,7,22,.94)';
    for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
      if(seenAt(x,y))continue;
      ctx.fillRect(x*CELL,y*CELL,CELL+1,CELL+1);   /* +1 盖掉相邻格之间的接缝亮线 */
    }
    ctx.restore();
  }

  /* 传送门（第 19 关）：成对的彩色圆环，**同一对颜色相同** —— 玩家要能一眼看出配对关系，
     否则就只能靠试错，那是把机制变成了谜语。⚠ 门不是地块（不在 S.cells 里），
     所以画在格子循环之后、蛇之前。 */
  if(portalOn()&&S.portals.length){
    const t=performance.now()/500;
    for(const p of S.portals){
      const col=PORTAL_COL[p.pair%PORTAL_COL.length];
      const cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2,r=CELL*0.34;
      ctx.save();
      ctx.globalAlpha=0.85+0.15*Math.sin(t+p.pair);
      ctx.strokeStyle=col[0];ctx.lineWidth=Math.max(2,CELL*.09);
      ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke();
      ctx.globalAlpha=0.35+0.2*Math.sin(t*1.3+p.pair);
      ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,6.283);ctx.stroke();
      ctx.fillStyle=col[1];ctx.globalAlpha=0.5;
      ctx.beginPath();ctx.arc(cx,cy,r*0.22,0,6.283);ctx.fill();
      ctx.restore();
    }
  }

  /* 蚀蛇 */
  for(const r of S.rivals){
    if(!r.alive||!r.body.length)continue;
    for(let i=r.body.length-1;i>=0;i--){
      const p=r.body[i],t=r.body.length>1?i/(r.body.length-1):0;
      ctx.globalAlpha=.95;
      rr(ctx,p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,Math.min(8,CELL*0.3));
      ctx.fillStyle=mix([255,120,120],[180,60,120],t);ctx.fill();
      ctx.globalAlpha=1;
      if(i===0){
        ctx.fillStyle='#2a0a14';
        const cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2,r0=Math.max(1.4,CELL*.07);
        const off=CELL*.16;
        ctx.beginPath();ctx.arc(cx-off,cy-off,r0,0,6.283);ctx.arc(cx+off,cy-off,r0,0,6.283);ctx.fill();
      }
    }
    /* 玩法 4：抢食模式里它肚子里有货 —— 尾巴上挂个方块，一看就知道它刚抢了东西 */
    if(S.L.race&&r.fed>0){
      const p=r.body[r.body.length-1];
      ctx.globalAlpha=.9;
      rr(ctx,p.x*CELL+CELL*.28,p.y*CELL+CELL*.28,CELL*.44,CELL*.44,Math.min(6,CELL*.16));
      ctx.fillStyle='#ffd166';ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle='#4a2c00';ctx.font='900 '+Math.round(CELL*.3)+'px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(r.fed),p.x*CELL+CELL/2,p.y*CELL+CELL/2);
    }
    /* 第 21 关「魔术蛇」：本体**品红**、分身**橙金**、玩家**蓝绿** ——
       三种颜色必须一眼分得清，否则「眼前这条是谁」成了记忆负担。
       ⚠ 2026-10-14 主公反馈「把另一条的色系换一个」：原来是青绿，和玩家撞色，
       现在改成橙金，并加一个实心菱形头标（玩家是圆点眼睛、本体也是圆点）。 */
    if(magicOn()&&r.role){
      const kid=r.role==='kid';
      for(let i=r.body.length-1;i>=0;i--){
        const p=r.body[i],t=r.body.length>1?i/(r.body.length-1):0;
        ctx.globalAlpha=.95;
        rr(ctx,p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,Math.min(8,CELL*0.3));
        ctx.fillStyle=kid?mix([255,196,90],[190,110,20],t):mix([232,120,220],[120,30,110],t);
        ctx.fill();
        ctx.globalAlpha=1;
        if(i===0){
          ctx.fillStyle=kid?'#3a2000':'#2a0a20';
          const cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2,r0=Math.max(1.4,CELL*.07);
          const off=CELL*.16;
          ctx.beginPath();ctx.arc(cx-off,cy-off,r0,0,6.283);ctx.arc(cx+off,cy-off,r0,0,6.283);ctx.fill();
          if(kid){    /* 分身头加一个实心菱形，和玩家/本体的圆点彻底分开 */
            ctx.fillStyle='#fff3d0';
            const mr=CELL*.17;
            ctx.beginPath();
            ctx.moveTo(cx,cy-mr);ctx.lineTo(cx+mr,cy);ctx.lineTo(cx,cy+mr);ctx.lineTo(cx-mr,cy);
            ctx.closePath();ctx.fill();
          }
        }
      }
      if(kid){        /* 周身虚线光环：暗示「它会跑掉/换位/合并」 */
        const h=r.body[0];
        ctx.save();
        ctx.globalAlpha=.5+.25*Math.sin(performance.now()/260);
        ctx.setLineDash([4,4]);
        ctx.strokeStyle='#ffcf7a';ctx.lineWidth=Math.max(1.5,CELL*.06);
        ctx.beginPath();ctx.arc(h.x*CELL+CELL/2,h.y*CELL+CELL/2,CELL*.55,0,6.283);ctx.stroke();
        ctx.restore();
      }
      /* 正在合并中：短的那条画成半透明 + 朝长蛇方向拉一道线，让「慢慢进入」看得见 */
      if((r.merge||0)>0&&r.mergeInto){
        ctx.save();
        ctx.globalAlpha=.55;
        ctx.setLineDash([3,5]);
        ctx.strokeStyle='#ffe9a8';ctx.lineWidth=Math.max(2,CELL*.1);
        const a=r.body[0],b=r.mergeInto.body[r.mergeInto.body.length-1];
        ctx.beginPath();
        ctx.moveTo(a.x*CELL+CELL/2,a.y*CELL+CELL/2);
        ctx.lineTo(b.x*CELL+CELL/2,b.y*CELL+CELL/2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  /* 镜像（第 20 关）：几秒前的你自己，画在蚀蛇之后、玩家蛇之前。
     ⚠ 必须画得**非常清晰**（半透明身体 + 虚线亮轮廓 + 头部菱形标记）——
       主公讨论时点出的头号风险就是「看不见自己身后的幽灵就莫名死掉」。
       配色刻意与玩家蛇（蓝绿实心）和蚀蛇（红）拉开：**白青半透明 + 虚线**。 */
  if(mirrorOn()&&S.mirrorDead<=0&&S.mirrorBody&&S.mirrorBody.length){
    const mn=S.mirrorBody.length;
    for(let i=mn-1;i>=0;i--){
      const p=S.mirrorBody[i],ft=mn>1?i/(mn-1):0;
      ctx.save();
      ctx.globalAlpha=0.46-0.2*ft;
      rr(ctx,p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,Math.min(8,CELL*0.3));
      ctx.fillStyle='rgba(186,242,255,'+(0.55-0.28*ft).toFixed(3)+')';ctx.fill();
      ctx.globalAlpha=0.92;
      ctx.setLineDash([3,3]);
      ctx.strokeStyle='rgba(224,251,255,.95)';ctx.lineWidth=1.4;ctx.stroke();
      ctx.restore();
      if(i===0){                      /* 头部菱形：和玩家蛇的圆点一眼区分 */
        const cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2,mr=CELL*0.16;
        ctx.save();ctx.globalAlpha=0.95;ctx.fillStyle='#eafeff';
        ctx.beginPath();
        ctx.moveTo(cx,cy-mr);ctx.lineTo(cx+mr,cy);ctx.lineTo(cx,cy+mr);ctx.lineTo(cx-mr,cy);
        ctx.closePath();ctx.fill();ctx.restore();
      }
    }
  }

  /* 玩家蛇：位置按 alpha 在上一格与本格之间插值，视觉才连贯 */
  const n=S.body.length;
  const gh=CHEAT.ghost,pulse=0.5+0.5*Math.sin(performance.now()/260);
  for(let i=n-1;i>=0;i--){
    const p=S.body[i];
    const px=lerp(p.px,p.x,alpha),py=lerp(p.py,p.y,alpha);
    const t=n>1?i/(n-1):0;
    const inset=Math.min(2.2,CELL*0.06)*(1-t*0.4);
    const x=px*CELL+1.2+inset,y=py*CELL+1.2+inset,s=CELL-2.4-inset*2;
    rr(ctx,x,y,s,s,Math.min(9,CELL*0.32));
    if(gh){ /* 虚化：青蓝 translucent + 呼吸感，看一眼就知道现在是「不可碰撞」状态 */
      ctx.globalAlpha=0.32+0.10*pulse;
      ctx.fillStyle=mix(mix(SNAKE_HEAD,SNAKE_TAIL,t),[160,242,255],.6);ctx.fill();
      ctx.strokeStyle='rgba(175,246,255,'+(0.45*(1-t*0.6))+')';ctx.lineWidth=1;ctx.stroke();
    }else if(S.dragon){ /* 化龙：整条披金鳞，越靠头越亮 */
      ctx.fillStyle=mix([255,224,140],[255,132,64],t);ctx.fill();
      ctx.strokeStyle='rgba(255,255,220,'+(0.5+0.3*pulse)*(1-t*0.5)+')';ctx.lineWidth=1.4;ctx.stroke();
    }else{
      /* 抢食模式冲刺中：整条带一层风痕，视觉上也能看出「现在穿过自己不掉血」 */
      const sp=sprinting();
      ctx.fillStyle=sp?mix(mix(SNAKE_HEAD,SNAKE_TAIL,t),[210,255,255],.45):mix(SNAKE_HEAD,SNAKE_TAIL,t);
      ctx.fill();
      ctx.strokeStyle=sp?'rgba(159,240,255,'+(0.65*(1-t*0.5))+')':'rgba(255,255,255,'+(0.22*(1-t))+')';
      ctx.lineWidth=sp?1.5:1;ctx.stroke();
    }
    if(i===0){
      ctx.globalAlpha=gh?0.8:1;
      const cx=px*CELL+CELL/2,cy=py*CELL+CELL/2;
      const fwd=DIRS[S.dir],per=[fwd[1],fwd[0]];
      const eOff=CELL*.15,fOff=CELL*.09;
      for(const sgn of [1,-1]){
        const exx=cx+fwd[0]*fOff+per[0]*eOff*sgn, eyy=cy+fwd[1]*fOff+per[1]*eOff*sgn;
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(exx,eyy,Math.max(1.6,CELL*.12),0,6.283);ctx.fill();
        ctx.fillStyle='#0b1030';
        ctx.beginPath();ctx.arc(exx+fwd[0]*CELL*.05,eyy+fwd[1]*CELL*.05,Math.max(.8,CELL*.06),0,6.283);ctx.fill();
      }
      if(S.dragon){        /* 化龙：一对龙角 */
        ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.atan2(fwd[1],fwd[0]));
        ctx.fillStyle='#ffe9a8';
        for(const sgn of [1,-1]){
          ctx.beginPath();
          ctx.moveTo(CELL*.08,sgn*CELL*.14);
          ctx.lineTo(CELL*.36,sgn*CELL*.30);
          ctx.lineTo(CELL*.12,sgn*CELL*.27);
          ctx.closePath();ctx.fill();
        }
        ctx.restore();
      }
      if(S.shield>0){
        ctx.strokeStyle='rgba(255,209,102,'+(0.55+0.25*Math.sin(performance.now()/180))+')';
        ctx.lineWidth=Math.max(2,CELL*.09);
        ctx.beginPath();ctx.arc(cx,cy,CELL*.62,0,6.283);ctx.stroke();
      }
      if(S.invT>0){        /* 起步无敌：青色脉冲环，跟金色鳞甲区分开 */
        ctx.strokeStyle='rgba(165,246,255,'+(0.45+0.3*Math.sin(performance.now()/140))+')';
        ctx.lineWidth=Math.max(2,CELL*.08);
        ctx.beginPath();ctx.arc(cx,cy,CELL*.74,0,6.283);ctx.stroke();
      }
      if(S.slowUntil>S.steps){
        ctx.strokeStyle='rgba(150,220,255,.7)';ctx.lineWidth=Math.max(1.5,CELL*.06);
        ctx.beginPath();ctx.arc(cx,cy,CELL*.48,0,6.283);ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;
  /* 特效层 */
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
  for(const rg2 of rings){
    ctx.globalAlpha=Math.max(0,rg2.life)*.8;
    ctx.strokeStyle=rg2.col;ctx.lineWidth=Math.max(1.5,CELL*.08);
    ctx.beginPath();ctx.arc(rg2.x,rg2.y,CELL*(0.4+(1-rg2.life)*1.5),0,6.283);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.5));
    ctx.font='900 '+Math.round(CELL*.5)+'px system-ui,sans-serif';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(6,10,30,.85)';
    ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

/* 把逻辑事件翻译成画面（顺带合成音效，无音频文件） */
let AC=null;
function beep(freq,dur,type,vol,slide,delay){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function sfx(type,v){
  if(type==='eat')beep(420+(v||1)*70,0.09,'square',0.05,120);
  else if(type==='hurt')beep(160,0.22,'sawtooth',0.07,-70);
  else if(type==='power'){beep(660,0.1,'triangle',0.06,0);beep(880,0.12,'triangle',0.06,0,0.09);}
  else if(type==='shield')beep(520,0.15,'triangle',0.06,-180);
  else if(type==='crash')beep(110,0.18,'sawtooth',0.07,-40);
  else if(type==='bite')beep(200,0.2,'square',0.06,-80);
  else if(type==='die')beep(300,0.5,'sawtooth',0.08,-240);
  else if(type==='win'){[523,659,784,1047].forEach((f,i)=>beep(f,0.14,'triangle',0.06,0,i*0.11));}
  else if(type==='warp')beep(320,0.16,'sine',0.045,460);
  else if(type==='fang'){beep(250,0.08,'square',0.06,-60);beep(720,0.17,'sawtooth',0.05,-320);}
  else if(type==='nest')beep(130,0.32,'sine',0.05,-40);
  else if(type==='emerge')beep(110,0.26,'sawtooth',0.045,70);
  else if(type==='dragon'){[523,659,784,1047,1319].forEach((f,i)=>beep(f,0.5,'triangle',0.05,0,i*0.13));
    beep(88,1.2,'sine',0.07,26);}
  /* 决斗模式：蚀蛇侧的四条反馈音。
     音色刻意与玩家侧区分 —— 玩家侧偏亮（square/triangle），蚀蛇侧偏闷（sawtooth/sine），
     玩家不用看屏幕也知道刚才是它那边发生的事。 */
  else if(type==='rare'){[523,784,1047].forEach((f,i)=>beep(f,0.13,'triangle',0.065,0,i*0.07));}
  else if(type==='eatneg'){beep(190,0.12,'sawtooth',0.05,90);}      /* 它进食：上行的闷音 */
  else if(type==='burn'){beep(240,0.09,'sawtooth',0.05,-110);}      /* 烧长度：下行的闷音 */
  else if(type==='starve'){beep(140,0.24,'sine',0.055,-60);}        /* 饥饿：一声低沉的咕噜 */
  else if(type==='choke')beep(340,0.1,'sine',0.045,-150);           /* 被堵：短促下滑 */
  else if(type==='doom'){beep(400,0.2,'sine',0.05,-260);beep(200,0.3,'sine',0.05,-70,0.14);}
  /* 抢食模式 */
  else if(type==='steal')beep(180,0.14,'triangular',0.05,-60);
  else if(type==='spoil'){beep(300,0.1,'sine',0.05,220);beep(520,0.14,'sine',0.05,0,0.1);}
  else if(type==='rot')beep(150,0.16,'sine',0.04,-50);
  else if(type==='mark'){[784,988].forEach((f,i)=>beep(f,0.12,'triangle',0.06,0,i*0.08));}
  else if(type==='run')beep(300,0.26,'sine',0.05,900);
  else if(type==='boom'){beep(90,0.3,'sawtooth',0.08,-40);beep(60,0.4,'square',0.06,-20,0.02);}
  else if(type==='rain'){[420,520,620].forEach((f,i)=>beep(f,0.1,'triangle',0.045,0,i*0.07));}
  else if(type==='shrink'){beep(120,0.5,'sawtooth',0.06,-50);}
  else if(type==='rush'){[659,880,1175].forEach((f,i)=>beep(f,0.22,'triangle',0.055,0,i*0.1));}
  /* 魔术蛇「本体 / 分身」的三条反馈音。
     沿用本文的约定：玩家侧偏亮（square/triangle），蛇侧偏闷（sawtooth/sine）——
     这三条全走闷音，玩家不看屏幕也知是蛇那边发生的事。 */
  else if(type==='split'){beep(260,0.14,'sawtooth',0.055,180);beep(180,0.2,'sine',0.05,60,0.1);}
  else if(type==='swap')beep(300,0.18,'sine',0.05,420);
  else if(type==='merge')beep(170,0.2,'sawtooth',0.055,-70);
}
function consumeEvents(){
  for(const e of S.events){
    /* ⚠⚠ 这里原来是无条件 sfx('eat',e.v)：于是**所有非 eat 事件**都会先误播一声
       「吃食物」（e.v 为 undefined → 落回 490Hz 的基础音）。逐条核对过：除 eat 之外
       每个分支都自带 sfx(...)，所以把它收进 eat 分支是纯修复、不影响任何事件。
       这也是「蛇那边发生事情却听到一声吃东西」的根因。 */
    if(e.type==='eat'){
      sfx('eat',e.v);
      burst(e.x,e.y,BLK_COL[Math.min(e.v,BLK_COL.length)-1]||'#fff',8+e.v*2);
      ring(e.x,e.y,'rgba(255,255,255,.9)');
      if(e.rare){      /* 稀有块（6/7/8）：强闪光反馈 + 屏震，数字越大越明显 */
        const rc=RARE.COL[e.v]||RARE.COL[6];
        sfx('rare');
        burst(e.x,e.y,'rgb('+rc.hi+')',18+e.v*4);
        ring(e.x,e.y,'rgb('+rc.mid+')');
        ring(e.x,e.y,rc.glow);
        floatUp(e.x,e.y,'✨ 稀有 +'+e.v+'　长 '+e.v+' 节','#fff6d0');
        shakeT=Math.max(shakeT,140);
      }
      else if(e.gold){      /* 金色：额外的金色光环 + 提示 */
        sfx('power');burst(e.x,e.y,'#ffd166',20);ring(e.x,e.y,'rgba(255,209,102,1)');
        floatUp(e.x,e.y,'✨ +'+e.gain,'#fff3c4');
      }else if(e.rot){ /* 临期：双倍分 */
        burst(e.x,e.y,'#ffb066',14);floatUp(e.x,e.y,'🍂 双倍 +'+e.gain,'#ffc98a');
      }else floatUp(e.x,e.y,'+'+e.gain,'#ffe9a8');

      sfx('hurt');

      sfx('power');

      floatUp(e.x,e.y,p.icon+' '+p.name,'#ffd166');
    }else if(e.type==='shield'){sfx('shield');burst(e.x,e.y,'#ffd166',18);ring(e.x,e.y,'rgba(255,209,102,1)');
      floatUp(e.x,e.y,e.text,'#ffd166');shakeT=140;}
    else if(e.type==='crash'){sfx('crash');burst(e.x,e.y,'#9fb0d9',16);floatUp(e.x,e.y,e.text,'#cfe0ff');shakeT=160;}
    else if(e.type==='bite'){sfx('bite');burst(e.x,e.y,'#ff6b8d',18);floatUp(e.x,e.y,e.text,'#ff9db4');shakeT=200;}
    else if(e.type==='spawn'){sfx('bite');ring(e.x,e.y,'rgba(255,140,160,.9)');burst(e.x,e.y,'#ff8ca0',12);
      floatUp(e.x,e.y,e.text,'#ff9db4');}
    else if(e.type==='inv'){   /* 起步无敌期撞墙会连续触发，特效要节流，不然糊满屏 */
      const now=performance.now();
      if(now-(invFxAt||0)>600){invFxAt=now;sfx('shield');ring(e.x,e.y,'rgba(165,246,255,.95)');floatUp(e.x,e.y,e.text,'#9ff0ff');}
    }
    else if(e.type==='warp'){sfx('warp');ring(e.x,e.y,'rgba(165,246,255,.95)');

    else if(e.type==='emerge'){sfx('emerge');ring(e.x,e.y,'rgba(255,140,160,.85)');
      burst(e.x,e.y,'#ff8ca0',10);floatUp(e.x,e.y,e.text,'#ff9db4');}
    else if(e.type==='dragon'){      /* 化龙：整条身子沿路炸金环，屏幕长震 */
      sfx('dragon');
      const gap=Math.max(1,Math.floor(S.body.length/14));
      for(let i=0;i<S.body.length;i+=gap){const p=S.body[i];ring(p.x,p.y,'rgba(255,215,120,.95)');burst(p.x,p.y,'#ffd166',10);}
      floatUp(e.x,e.y,'🐉 化 龙','#ffe9a8');shakeT=900;}
    else if(e.type==='die'){sfx('die');burst(e.x,e.y,'#ff5a7a',26);shakeT=320;}
    /* 决斗模式的事件特效。
       ⚠ 早先这一整段是缺失的：逻辑段推事件（eatneg/burn/choke/starve/doom），
         浏览器段却没有对应分支，于是全都静默丢弃 —— 玩家看到的是
         「蚀蛇忽然就变长了」。裁决/进食/饥饿都是玩家判断局势的依据，必须有反馈。 */
    else if(e.type==='eatneg'){   /* 它吃下负数：记待长，不即时涨身 */
      sfx('eatneg');
      burst(e.x,e.y,'#8f7ae0',14);
      /* ⚠ 用 e.text 不要再拼 '−'+e.v —— 早先这里拼 e.v 而事件对象没这个字段，
         字幕直接显示「undefined」。**事件对象带什么字段就用什么，渲染侧不猜。** */
      floatUp(e.x,e.y,e.text,'#b8a6ff');
    }
    else if(e.type==='eatpos'){   /* 它吃下正数：缩身（对它纯毒） */
      sfx('hurt');
      if(e.rare){   /* ⚠ 误食稀有块：这是玩家的胜机，音效/特效必须够显眼 */
        sfx('starve');
        burst(e.x,e.y,'#ff9ce6',26);
        ring(e.x,e.y,'rgba(255,120,220,.95)');
        floatUp(e.x,e.y,e.text,'#ffc2ee');
        shakeT=320;
      }else{
        burst(e.x,e.y,'#7cf6c4',10);floatUp(e.x,e.y,e.text,'#9ff0d8');
      }
    }
    else if(e.type==='burn'){     /* 加速烧长度：它的自付代价 */
      sfx('burn');burst(e.x,e.y,'#ff9a5a',12);floatUp(e.x,e.y,e.text,'#ffc08a');
    }
    else if(e.type==='starve'){   /* 饥饿缩身：玩家「围住它就能赢」的可见反馈 */
      sfx('starve');burst(e.x,e.y,'#8b7d6b',12);
      floatUp(e.x,e.y,e.text,'#d9c4a0');shakeT=120;
    }
    else if(e.type==='choke'){    /* 被堵住拐弯 */
      sfx('choke');ring(e.x,e.y,'rgba(124,246,196,.75)');floatUp(e.x,e.y,e.text,'#7cf6c4');
    }
    else if(e.type==='doom'){     /* 拐弯空间长期被堵 → 认命 */
      sfx('doom');ring(e.x,e.y,'rgba(124,246,196,.95)');burst(e.x,e.y,'#7cf6c4',14);
      floatUp(e.x,e.y,e.text,'#7cf6c4');shakeT=160;
    }
    /* 抢食模式的事件特效 */
    else if(e.type==='steal'){sfx('steal');ring(e.x,e.y,'rgba(255,140,160,.9)');burst(e.x,e.y,'#ff8ca0',10);
      floatUp(e.x,e.y,e.text,'#ff9db4');}
    else if(e.type==='spoil'){sfx('spoil');ring(e.x,e.y,'rgba(255,209,102,.9)');burst(e.x,e.y,'#ffd166',14);
      floatUp(e.x,e.y,e.text,'#ffd166');}
    else if(e.type==='rot'){sfx('rot');burst(e.x,e.y,'#8b7d6b',12);floatUp(e.x,e.y,e.text,'#c9b79b');}
    else if(e.type==='mark'){sfx('mark');ring(e.x,e.y,'rgba(255,209,102,1)');burst(e.x,e.y,'#ffd166',20);
      floatUp(e.x,e.y,e.text,'#ffe9a8');}
    else if(e.type==='run'){sfx('run');burst(e.x,e.y,'#a5f6ff',16);ring(e.x,e.y,'rgba(165,246,255,.95)');
      floatUp(e.x,e.y,e.text,'#9ff0ff');}
    else if(e.type==='boom'){sfx('boom');shakeT=260;
      for(const b of (S.boom||[])){
        burst(b.x,b.y,b.k==='wall'?'#7f8ac4':'#ff6b8d',10);
        ring(b.x,b.y,'rgba(255,209,102,.85)');
      }
      S.boom=[];
      floatUp(e.x,e.y,e.text,'#ffd166');}
    else if(e.type==='rain'){sfx('rain');floatUp(e.x,e.y,e.text,'#9ff0ff');}
    else if(e.type==='shrink'){sfx('shrink');shakeT=220;floatUp(e.x,e.y,e.text,'#cfe0ff');}
    else if(e.type==='rush'){sfx('rush');shakeT=180;
      for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const c=S.cells[idx(x,y)];
        if(c&&c.k==='block')ring(x,y,'rgba(255,209,102,.8)');}
      floatUp(e.x,e.y,e.text,'#ffe9a8');}
    /* 魔术蛇「本体 / 分身」的事件特效。
       ⚠⚠ 2026-10-14 之前这一段是**缺失的**：逻辑段早就推 split/swap/merge/mergedone/magicwin
         五类事件，浏览器段却没有对应分支，于是**分裂/易位/合流全程静默发生** ——
         玩家只看到蛇头突然多了一条，不知道刚才发生了什么（而循环开头还会误播一声吃食物，
         见函数顶部那条注释）。分裂是这模式的命脉，必须看得见。 */
    else if(e.type==='split'){    /* 本体一分为二：品红爆环 + 屏震 */
      sfx('split');
      ring(e.x,e.y,'rgba(255,140,220,.95)');burst(e.x,e.y,'#e878dc',18);
      floatUp(e.x,e.y,e.text,'#ff9db4');shakeT=220;
    }
    else if(e.type==='swap'){     /* 易位：两道门户光环交错，呼应第 19 关传送门的视觉 */
      sfx('swap');
      ring(e.x,e.y,'rgba(216,180,255,.95)');ring(e.x,e.y,'rgba(165,246,255,.7)');
      burst(e.x,e.y,'#d8b4ff',14);floatUp(e.x,e.y,e.text,'#d8b4ff');
    }
    else if(e.type==='merge'){    /* 相撞起手：橙金亮一下，说明「开始并入了」 */
      sfx('merge');burst(e.x,e.y,'#ffcf7a',14);floatUp(e.x,e.y,e.text,'#ffcf7a');
    }
    else if(e.type==='mergedone'){sfx('merge');ring(e.x,e.y,'rgba(255,207,122,.9)');floatUp(e.x,e.y,e.text,'#ffe9a8');}
    else if(e.type==='magicwin'){ /* 撑满时限。
         ⚠ 这一支还兼任「补胜利音」：showResult(win) 在 magic 分支**提前 return**（见 showResult），
           跳过了通用的 sfx(win?'win':'die')，所以不在这里补，魔术蛇赢了会是一片寂静。 */
      sfx('win');
      ring(e.x,e.y,'rgba(255,215,120,.95)');burst(e.x,e.y,'#ffd166',22);
      floatUp(e.x,e.y,e.text,'#ffe9a8');shakeT=420;
    }
  }
  S.events.length=0;
}

const $=id=>document.getElementById(id);
let _hudRows=-1;      /* 上一次 HUD 是否带「养分条/技能」那两行，用来决定要不要重算画布 */
function updateHUD(){
  const free=!!S.L.free,race=!!S.L.race,duel=!!S.L.duel,magic=!!S.L.magic;
  /* ⚠ 养分条/技能按钮是**抢食模式的对局专属 UI**，回到选关面板就必须撤掉。
     早先只按 S.L.race 切换 body.race，而 openMenu() 结尾也会调 updateHUD()，
     于是「抢食打完 → 回选关」时养分条和技能按钮还杵在菜单下面。
     判据加一条 running：不在局内就不显示。 */
  const showRaceUi=race&&running;
